<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEFEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Playback">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest?v=20261021a">

<link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261021a">
<title>Playback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Fraunces:ital,opsz,wght@1,9..144,600&family=Manrope:wght@600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: catalog sidebar (artists / shows) + detail sheet; "up next" strip on top. Archival record-sleeve feel. */
:root{
  --bg:#ECEFEC; --surface:#F8FAF8; --sunk:#E1E6E2; --ink:#18221E; --muted:#5D6A64; --line:#CDD5D0;
  --accent:#0F6E72; --accent-ink:#FFFFFF; --done:#2C7A55; --done-soft:#D6EBDF; --warn:#B4502F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201D; --sunk:#0C100E; --ink:#E3E9E6; --muted:#8F9C96; --line:#2C3632;
  --accent:#6FD3C6; --accent-ink:#0B2A2C; --done:#6FCB9A; --done-soft:#1D3328; --warn:#F08A66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201D; --sunk:#0C100E; --ink:#E3E9E6; --muted:#8F9C96; --line:#2C3632;
  --accent:#6FD3C6; --accent-ink:#0B2A2C; --done:#6FCB9A; --done-soft:#1D3328; --warn:#F08A66; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
html,body{-webkit-tap-highlight-color:transparent}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.tabs{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 18px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* up next */
.next{display:flex;flex-direction:column;gap:8px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.card{flex:0 0 auto;width:240px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* shell */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.shell{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:10px}
.entry{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px}
.entry:hover{background:var(--sunk)}
.entry[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.entry .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .p{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px}

form.add{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical;font-size:14px}
.row2{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--surface);border-color:var(--warn)}

/* detail */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:500px){.sheet{padding:16px}}
.head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.head h2{font:700 30px/1.1 var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.head .meta{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.ring{--p:0;width:84px;aspect-ratio:1;border-radius:50%;flex:0 0 auto;
  background:repeating-radial-gradient(circle,transparent 0 3px,rgb(127 127 127 / .08) 3px 4px),conic-gradient(var(--done) calc(var(--p)*1%),var(--sunk) 0);
  display:grid;place-items:center}
.ring span{width:46px;aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.group{display:flex;flex-direction:column;gap:6px}
.ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.ghead h3{font:700 18px/1.2 var(--display);margin:0}
.ghead .sp{flex:1}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;width:80px}
.bar i{display:block;height:100%;background:var(--done)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.link:disabled{opacity:.45;cursor:default}
.arate{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:2px 0 6px;border-bottom:1px solid var(--line)}
.avg{font:500 12px var(--mono);color:var(--muted)}
.avg .of{opacity:.8}
.diff{font:600 12px var(--mono);color:var(--muted)}
.diff.up,.diff.down{color:var(--accent)}
.rymrep{display:flex;flex-direction:column;gap:6px}
.rymrep ul{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.5}
.rymrep summary{cursor:pointer;font-weight:600;font-size:13px}
.ghead .art{width:44px;height:44px;border-radius:5px;object-fit:cover;background:var(--sunk);flex:0 0 auto;align-self:center;box-shadow:0 0 0 1px var(--line)}

/* MusicBrainz import */
.mbres{display:flex;flex-direction:column;gap:4px}
.mbhit{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.mbhit:hover{border-color:var(--accent)}
.mbhit b{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mbsub{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}
.tag{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px}
.mbpick{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);background:var(--surface);border-radius:10px;padding:12px}
.mbpick .note{margin:0}
.tick{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.tick input{width:18px;height:18px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--accent)}
.mbprog{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.bar.wide{width:100%;height:6px;border-radius:3px}
.bar.wide i{background:var(--accent);transition:width .4s}
.mberr,.mbok{margin:0;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.45}
.mberr{border:1px solid var(--warn);color:var(--warn);background:var(--surface)}
.mbok{border:1px solid var(--done);background:var(--done-soft);color:var(--ink)}
.mbok .link{margin-left:8px}
.mbsrc{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.mbsrc.warn{flex-direction:column;align-items:flex-start;border:1px dashed var(--line);border-radius:10px;padding:12px}
.mbsrc.warn .note{margin:0}
/* TMDB (Screen tab) */
.tmhit{flex-direction:row;align-items:center;gap:10px}
.tmhit img,.tmhit>span:first-child:empty{width:34px;height:51px;border-radius:4px;object-fit:cover;background:var(--sunk);flex:0 0 auto;box-shadow:0 0 0 1px var(--line)}
.tmhit>span:last-child{display:flex;flex-direction:column;gap:1px;min-width:0}
.tmhit i{font-style:normal;color:var(--accent)}
.mbhit:disabled{opacity:.6}
.poster{width:62px;height:93px;border-radius:6px;object-fit:cover;background:var(--sunk);flex:0 0 auto;box-shadow:0 0 0 1px var(--line)}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.steps a,.tmcredit a{color:var(--accent)}
.tmcredit{font-size:12px;margin:0}
.airs{color:var(--accent);font-weight:600}
.genres{font-size:13px;color:var(--muted)}
.overview{margin:0;max-width:70ch;line-height:1.5}
.srate{border-bottom:0;padding:10px 12px;background:var(--bg);border-radius:8px}
.track.ep{align-items:start}
/* where to watch */
.watch{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface)}
.provrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.provrow .pk{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);min-width:52px}
.prov{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;font-weight:600;background:var(--bg)}
.prov img{width:20px;height:20px;border-radius:5px;flex:0 0 auto}
.prov.noimg{padding-left:10px}
.watch details summary{cursor:pointer;font-size:13px;color:var(--muted)}
.watch details[open]{display:flex;flex-direction:column;gap:6px}
.watch .note{margin:0}
.card .on{color:var(--accent)}
/* Spotify */
.sp-on{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.sp-on i{width:8px;height:8px;border-radius:50%;background:var(--done);flex:0 0 auto}
.sp-on.err i{background:var(--warn)}
.spmiss ul{margin:6px 0 0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.spmiss .why{color:var(--muted)}
code.uri{font:500 12px var(--mono);background:var(--sunk);border-radius:4px;padding:2px 5px;word-break:break-all;user-select:all}
.track.ep .num,.track.ep .check{margin-top:2px}
.eptl{all:unset;cursor:pointer;font-weight:500;overflow-wrap:anywhere}
.eptl:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.eptl[aria-expanded="false"]::after{content:" \203A";color:var(--muted)}
.epm{display:block;font:12px var(--mono);color:var(--muted);margin-top:2px}
.epo{margin:6px 0 2px;font-size:13px;color:var(--muted);line-height:1.5;max-width:62ch}
.track.done .eptl{color:var(--muted)}

.track{display:grid;grid-template-columns:28px 26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 4px;border-radius:6px}
.track:hover{background:var(--bg)}
.track .num{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.track .ttl{min-width:0;overflow-wrap:anywhere}
.track.done .ttl{color:var(--muted)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
.check[aria-pressed="true"]::after{content:"";width:8px;height:4px;border:2px solid var(--surface);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.rate{display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:3px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);display:flex;overflow:hidden;flex:0 0 auto}
.dot.full{background:var(--accent);border-color:var(--accent)}
.dot.half{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot button{flex:1;border:0;background:transparent;padding:0;margin:0}
.dots:hover .dot{border-color:var(--muted)}
.rv{font:500 12px var(--mono);font-variant-numeric:tabular-nums;min-width:28px;text-align:right;color:var(--muted)}
.rv.set{color:var(--accent);font-weight:600}
@media (pointer:coarse){.dot{width:18px;height:18px}.dots{gap:4px}}
@media (max-width:560px){.track{grid-template-columns:28px 26px minmax(0,1fr)}.track .rate{grid-column:3}}


details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.more form{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-width:460px}
.note{color:var(--muted);font-size:13px;max-width:62ch}
.empty{color:var(--muted);padding:30px 0;text-align:center}
footer{display:flex;flex-direction:column;gap:8px}
footer details{max-width:640px}
footer textarea{font:12px var(--mono);margin-top:8px}
@media (prefers-reduced-motion:no-preference){.ring{transition:background .3s}}
.topr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:500 12px var(--mono);color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.sync[data-s="ok"] i{background:var(--done)}
.sync[data-s="busy"] i{background:var(--accent)}
.sync[data-s="error"] i,.sync[data-s="conflict"] i{background:var(--warn)}
.banner{border:1px solid var(--warn);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.banner p{margin:0;flex:1;min-width:220px}
.panel{display:flex;flex-direction:column;gap:8px;max-width:520px;margin-top:8px}
.panel .msg{font-size:13px;color:var(--muted)}
.panel .msg.err{color:var(--warn)}
.buildid{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
/* ---- update bar (same behavior as the other apps) ---- */
.updbar{position:fixed;left:0;right:0;top:0;z-index:130;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.updin{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 16px;
  border-radius:24px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 10px 30px rgb(0 0 0 / .28);pointer-events:auto;
  transform:translateY(calc(-100% - 40px));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.updbar.up .updin{transform:none}
.upddot{width:8px;height:8px;border-radius:4px;background:var(--accent);flex:0 0 auto}
.updtxt{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.updgo{height:36px;padding:0 16px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700}
.updx{width:36px;height:36px;border:0;border-radius:18px;background:transparent;color:var(--muted);display:grid;place-items:center}
.updx svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
@media (prefers-reduced-motion:reduce){.updin{transition:none}}
</style>

<!-- suite:css v10 · shared by Kitchen, Grocery, Lift, DishLog, Protocol, Rail, Game Log, Playback — edit tools/suite.py in the kitchen repo, not here -->
<style id="suite-css">
/* App colors come from each app's home-screen icon, so the bar, the icon and
   the page all agree. The tab for every app carries its own color, so the
   whole set reads as one color-coded system wherever you are in it. */
.sx-bar{
  --sx-kitchen:#7A2E1E; --sx-grocery:#2D5840; --sx-lift:#A8522B; --sx-dishlog:#6A2347; --sx-protocol:#1E3550; --sx-rail:#3A2A63; --sx-gamelog:#242B5C; --sx-playback:#124C50;
  --sx-on:#FFF8EF;
  --sx-paper:#FAF6F0; --sx-ink:#1F1A14; --sx-dim:#7D7262; --sx-line:#DDD3C2; --sx-hover:#EFE7DA;
}
@media (prefers-color-scheme:dark){ .sx-bar:not(.sx-light){
  --sx-kitchen:#E8987C; --sx-grocery:#7CC39A; --sx-lift:#EE9C66; --sx-dishlog:#DD8DB2; --sx-protocol:#5FE6B0; --sx-rail:#B9A6F2; --sx-gamelog:#F5B63F; --sx-playback:#6FD3C6;
  --sx-on:#15120E;
  --sx-paper:#17140F; --sx-ink:#F1EADF; --sx-dim:#A0947F; --sx-line:#3B342B; --sx-hover:#2A251E;
}}
.sx-bar.sx-dark{
  --sx-kitchen:#E8987C; --sx-grocery:#7CC39A; --sx-lift:#EE9C66; --sx-dishlog:#DD8DB2; --sx-protocol:#5FE6B0; --sx-rail:#B9A6F2; --sx-gamelog:#F5B63F; --sx-playback:#6FD3C6;
  --sx-on:#15120E;
}
/* layout tokens every app's own layout lines up with. No width cap: on a
   computer the apps use the whole window; each app decides how many columns. */
:root{ --sx-max:100000px; --sx-gut:clamp(16px,2vw,40px); --sx-barh:56px; }

.sx-bar{position:relative;z-index:40;background:var(--sx-paper);border-bottom:1px solid var(--sx-line);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;color:var(--sx-ink)}
.sx-in{max-width:var(--sx-max);margin:0 auto;box-sizing:border-box;min-height:52px;
  padding:calc(8px + env(safe-area-inset-top,0px)) var(--sx-gut) 8px;display:flex;align-items:center;gap:18px}
.sx-id{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.sx-tile{width:32px;height:32px;border-radius:7.5px;display:block;background:var(--app);flex:0 0 auto;
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 2px 6px -2px rgba(0,0,0,.3)}
.sx-name{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:21px;letter-spacing:-.01em;line-height:1;color:var(--sx-ink);white-space:nowrap}
.sx-t svg,.sx-gbtn svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* phone: app name on the left, the grid button on the right */
.sx-gbtn{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--sx-line);background:transparent;
  color:var(--sx-dim);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s,scale .22s var(--sx-spring)}
.sx-gbtn svg{width:19px;height:19px}
.sx-gbtn[aria-expanded="true"]{background:var(--sx-hover);color:var(--sx-ink)}
.sx-menu{position:fixed;inset:0;z-index:300}
.sx-menu[hidden]{display:none}

    else m.hidden=true; }

})();

    return Object.keys(m).map(function(k){ return m[k]; }).filter(function(x){ return !(x.deleted && (x.u||0)<cut); });
  }
  function plain(){
    var rows=live(load()).filter(function(x){ return !x.done; }).sort(function(a,b){ return (a.t||0)-(b.t||0); });
    if(!rows.length) return '';
    return ['## '+LABEL].concat(rows.map(function(x){ return '- '+x.text; })).join(String.fromCharCode(10));
  }

  /* ---- sync: saved here first, then sent in the background. Failing is fine; it tries again on the next change. ---- */
  var busy=false, again=false, timer=null;
  function say(s){ stat.textContent=s; }
  function endpoint(){ var u=''; try{ u=localStorage.getItem(URLKEY)||''; }catch(e){} return (u||WORKER).replace(/\/+$/,''); }

  function sync(){

    fetch(endpoint()+'/sync/'+APP,{method:'POST',headers:{'content-type':'application/json','x-ideas-key':TOKEN},body:JSON.stringify({items:load()})})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })

  schedule(1500);
  window.addEventListener('online',function(){ schedule(300); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden && !pan.hidden) schedule(300); });

  /* ---- panel ---- */
  function mk(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  var SVG_CK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var SVG_X='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function render(){
    var pool=live(load()).sort(function(a,b){ return (a.done?1:0)-(b.done?1:0) || (b.t||0)-(a.t||0); });
    list.textContent='';
    if(!pool.length) list.appendChild(mk('li','sx-iempty','Nothing yet. Jot down anything you wish '+LABEL+' did.'));
    pool.forEach(function(x){
      var li=mk('li','sx-ii'+(x.done?' sx-done':'')); li.setAttribute('data-id',x.id);
      var ck=mk('button','sx-ick'); ck.type='button'; ck.setAttribute('role','checkbox'); ck.setAttribute('aria-checked',x.done?'true':'false');
      ck.setAttribute('aria-label',(x.done?'Mark not done: ':'Mark done: ')+x.text); ck.innerHTML=SVG_CK;
      li.appendChild(ck); li.appendChild(mk('span','sx-itx',x.text));
      var dl=mk('button','sx-idel'); dl.type='button'; dl.setAttribute('aria-label','Delete idea: '+x.text); dl.innerHTML=SVG_X;
      li.appendChild(dl); list.appendChild(li);

  }
  function paint(){ /* the panel lives on <body>, so hand it the bar's current colors */
    var cs=getComputedStyle(bar);
    VARS.forEach(function(v){ pan.style.setProperty(v,cs.getPropertyValue(v)); });
    pan.style.setProperty('--sx-ac',cs.getPropertyValue('--app'));
  }

    if(pan.parentNode!==document.body) document.body.appendChild(pan);

  }

  btn.addEventListener('click',function(e){ e.stopPropagation(); set(pan.hidden); });
  pan.addEventListener('click',function(e){ if(e.target===pan) set(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !pan.hidden){ set(false); btn.focus(); } });
  window.addEventListener('pageshow',function(e){ if(e.persisted){ pan.hidden=true; btn.setAttribute('aria-expanded','false'); } });  /* only when the page comes back from the back/forward cache */
  window.addEventListener('storage',function(e){ if(e.key===KEY && !pan.hidden) render(); });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=input.value.replace(/\s+/g,' ').trim(); if(!v){ input.value=''; return; }
    var n=Date.now(), a=load(); a.push({id:n.toString(36)+Math.random().toString(36).slice(2,6), text:v.slice(0,280), done:0, deleted:0, t:n, u:n});
    put(a); input.value=''; render(); schedule(); input.focus({preventScroll:true});
  });
  list.addEventListener('click',function(e){
    var li=e.target.closest('.sx-ii'); if(!li) return;
    var id=li.getAttribute('data-id'), a=load(), n=Date.now();
    if(e.target.closest('.sx-ick')){ a.forEach(function(x){ if(x.id===id){ x.done=x.done?0:1; x.u=n; } }); }
    else if(e.target.closest('.sx-idel')){ a.forEach(function(x){ if(x.id===id){ x.deleted=1; x.text=''; x.u=n; } }); }
    else return;
    put(a); render(); schedule();
  });
  clrB.addEventListener('click',function(){
    var n=Date.now(), a=load(); a.forEach(function(x){ if(x.done && !x.deleted){ x.deleted=1; x.text=''; x.u=n; } });
    put(a); render(); schedule();
  });
  copyB.addEventListener('click',function(){
    var t=plain(); if(!t) return;
    function ok(){ copyB.textContent='Copied'; setTimeout(function(){ copyB.textContent='Copy list'; },1400); }
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(err){ copyB.textContent='Copy failed'; }
      document.body.removeChild(ta);
    }
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok,fallback); else fallback();
  });
})();

<script>
/* suite motion helpers (window.SX), shared by every app. Each one is a
   no-op extra: if the browser can't animate or you've asked for reduced
   motion, the change just happens, exactly as it did before.
     SX.flip(root, sel, change)  redraw a list and let the items that stay
                                 glide to their new spots; new ones fade in
     SX.enter(root, sel, dir)    play a short staggered entrance on fresh content
     SX.pill(row, activeSel)     slide a highlight to the selected tab/chip
     SX.expand(el, open, apply)  open or close a block by its height
     SX.morph(root, sel, prop, change)  bars and meters ease to their new size
     SX.bump(el)                 a small pop for a value that just changed */
(function(){
  if(window.SX) return;
  var mq=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
  var E='cubic-bezier(.2,.8,.2,1)', SPRING='cubic-bezier(.3,1.25,.5,1)';
  function still(){ return !!(mq&&mq.matches) || typeof Element.prototype.animate!=='function'; }
  function q(x){ return typeof x==='string'?document.querySelector(x):x; }
  function keyOf(el,kf){ return kf?kf(el):(el.getAttribute('data-sx-key')||el.getAttribute('data-id')||el.getAttribute('data-k')||el.id||null); }
  function quietCss(el){ /* a redraw should not replay an entrance the item already did */
    try{ el.getAnimations({subtree:true}).forEach(function(a){ if(a.animationName) a.cancel(); }); }catch(e){} }

  function flip(root,sel,change,o){
    o=o||{}; root=q(root);
    if(!root || still()){ change(); return; }
    var before={}, vh=window.innerHeight;
    root.querySelectorAll(sel).forEach(function(el){
      var k=keyOf(el,o.key); if(k==null || before[k]) return;
      var r=el.getBoundingClientRect(); if(!r.width && !r.height) return;
      before[k]=r;
    });
    change();
    var seen={}, n=0;
    root.querySelectorAll(sel).forEach(function(el){
      var k=keyOf(el,o.key); if(k==null || seen[k]) return; seen[k]=1;
      var b=before[k], r=el.getBoundingClientRect();
      if(!r.width && !r.height) return;
      if(r.bottom<-40 || r.top>vh+40){ if(b) quietCss(el); return; }
      if(b){
        quietCss(el);
        var dx=b.left-r.left, dy=b.top-r.top;
        if(Math.abs(dx)<1 && Math.abs(dy)<1) return;
        if(Math.abs(dy)>vh) dy=dy>0?vh*.5:-vh*.5;
        el.animate([{translate:dx+'px '+dy+'px'},{translate:'0 0'}],{duration:o.dur||340,easing:E});
      } else if(o.enter!==false){
        quietCss(el);
        el.animate([{opacity:0,translate:'0 6px',scale:.985},{opacity:1,translate:'0 0',scale:1}],
                   {duration:260,delay:Math.min(n++,8)*24,easing:E,fill:'backwards'});
      }
    });
  }

  function enter(root,sel,dir,o){
    o=o||{}; root=q(root); if(!root || still()) return;
    var els=sel?root.querySelectorAll(sel):root.children, vh=window.innerHeight, i=0;
    var from=dir==='left'?'-18px 0':dir==='right'?'18px 0':dir==='none'?'0 0':'0 8px';
    Array.prototype.forEach.call(els,function(el){
      if(el.classList && el.classList.contains('sx-pill')) return;
      var r=el.getBoundingClientRect(); if(r.bottom<0 || r.top>vh || !r.height) return;
      quietCss(el);
      el.animate([{opacity:0,translate:from},{opacity:1,translate:'0 0'}],
                 {duration:o.dur||300,delay:Math.min(i++,10)*(o.step==null?30:o.step),easing:E,fill:'backwards'});
    });
  }

  var rows=[];
  function pill(row,activeSel,o){
    row=q(row); if(!row) return;
    var rec=null; rows.forEach(function(x){ if(x.row===row) rec=x; });
    if(!rec){ rec={row:row, sel:activeSel, last:null, o:o||{}}; rows.push(rec); watch(rec); }
    rec.sel=activeSel||rec.sel; place(rec,true);
  }
  function place(rec,animate){
    var row=rec.row, p=row.querySelector(':scope > .sx-pill');
    if(!p){ p=document.createElement('span'); p.className='sx-pill'+(rec.o.cls?' '+rec.o.cls:''); p.setAttribute('aria-hidden','true'); row.insertBefore(p,row.firstChild); }
    if(!row.classList.contains('sx-pilled')){ row.classList.add('sx-pilled');
      if(getComputedStyle(row).position==='static') row.style.position='relative'; }
    var a=row.querySelector(rec.sel);
    if(!a || !a.offsetWidth){ p.style.opacity='0'; rec.last=null; return; }
    var now={x:a.offsetLeft, y:a.offsetTop, w:a.offsetWidth, h:a.offsetHeight}, last=rec.last;
    rec.last=now;
    p.style.opacity='1'; p.style.width=now.w+'px'; p.style.height=now.h+'px';
    p.style.transform='translate('+now.x+'px,'+now.y+'px)';
    if(animate && last && !still() && (last.x!==now.x || last.y!==now.y || last.w!==now.w)){
      p.animate([{transform:'translate('+last.x+'px,'+last.y+'px)',width:last.w+'px',height:last.h+'px'},
                 {transform:'translate('+now.x+'px,'+now.y+'px)',width:now.w+'px',height:now.h+'px'}],
                {duration:360,easing:SPRING});
    }
  }
  function watch(rec){ if(window.ResizeObserver){ new ResizeObserver(function(){ place(rec,false); }).observe(rec.row); } }
  window.addEventListener('resize',function(){ rows.forEach(function(r){ place(r,false); }); });

  function expand(el,open,apply){
    el=q(el); if(!el){ apply(open); return; }
    if(el._sx){ el._sx.cancel(); el._sx=null; }
    if(still()){ apply(open); return; }
    var cs, h, f, a;
    if(open){
      apply(true); cs=getComputedStyle(el); h=el.offsetHeight; if(!h) return;
      f={height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,marginTop:cs.marginTop,marginBottom:cs.marginBottom,opacity:1};
      el.style.overflow='hidden';
      a=el.animate([{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0},f],{duration:300,easing:E});
    } else {
      cs=getComputedStyle(el); h=el.offsetHeight; if(!h){ apply(false); return; }
      f={height:h+'px',paddingTop:cs.paddingTop,paddingBottom:cs.paddingBottom,marginTop:cs.marginTop,marginBottom:cs.marginBottom,opacity:1};
      el.style.overflow='hidden';
      a=el.animate([f,{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0}],{duration:240,easing:E});
    }
    el._sx=a;
    a.onfinish=function(){ el._sx=null; el.style.overflow=''; if(!open) apply(false); };
    a.oncancel=function(){ el.style.overflow=''; };
  }

  /* redraw something whose bars or meters are set inline (width:40%), and
     let each one ease from where it was instead of snapping */
  function morph(host,sel,prop,change){
    host=q(host); if(!host){ change(); return; }
    var old=Array.prototype.map.call(host.querySelectorAll(sel),function(e){ return e.style[prop]; });
    change();
    if(still()) return;
    var now=host.querySelectorAll(sel), to=Array.prototype.map.call(now,function(e){ return e.style[prop]; });
    Array.prototype.forEach.call(now,function(e,i){ if(old[i]===to[i]) return; e.style.transition='none'; e.style[prop]=old[i]!=null&&old[i]!==''?old[i]:'0'; });
    void host.offsetWidth;
    Array.prototype.forEach.call(now,function(e,i){ e.style.transition=''; e.style[prop]=to[i]; });
  }

  function bump(el){
    el=q(el); if(!el || still()) return;
    el.animate([{scale:1},{scale:1.08},{scale:1}],{duration:320,easing:SPRING});
  }

  /* <details> sections open and close by height instead of snapping.
     The toggle still happens for real, so anything listening for it works. */
  document.addEventListener('click',function(e){
    var sm=e.target.closest && e.target.closest('summary'); if(!sm || e.defaultPrevented) return;
    var d=sm.parentElement; if(!d || d.tagName!=='DETAILS' || d.hasAttribute('data-sx-still') || still()) return;
    e.preventDefault();
    if(d._sx){ d._sx.cancel(); d._sx=null; }
    var from=d.offsetHeight, opening=!d.open, to;
    d.style.overflow='hidden';
    if(opening){ d.open=true; to=d.offsetHeight; }
    else { d.open=false; to=d.offsetHeight; d.open=true; }
    var a=d.animate([{height:from+'px'},{height:to+'px'}],{duration:opening?320:240,easing:E});
    d._sx=a;
    a.onfinish=function(){ d._sx=null; d.style.overflow=''; if(!opening) d.open=false; };
    a.oncancel=function(){ d.style.overflow=''; };
    if(opening){ Array.prototype.forEach.call(d.children,function(c){ if(c!==sm) c.animate([{opacity:0},{opacity:1}],{duration:260,delay:60,easing:E,fill:'backwards'}); }); }
  });

  window.SX={still:still, flip:flip, enter:enter, pill:pill, expand:expand, morph:morph, bump:bump};
})();
</script>

   count, since that is what streaming services carry. Live albums, remixes, demos and alternate versions are skipped

function mbNorm(s){return String(s).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase()

  if(!s)return null;

  if(/^(radio|single|album|lp|original|short|long|full[- ]?length|7|7 inch|12|12 inch)? ?(edit|version|mix)$/.test(s))return 'same';

/* brackets that are just credits ("feat. X", "with Y", "from the film") */
const MB_CREDIT=/^\s*(feat\.?|ft\.?|featuring|with|prod\.?|produced by|from)\s/i;

   else (EPs, singles, compilations) only adds songs no release has yet, so a B-side

  const groups=[];
  for(const G of incoming){
    const items=[];
    for(const t of G.items){if(placed.has(t.k))continue;placed.add(t.k);items.push({id:idFor(t.k),title:t.title,k:t.k})}
    if(items.length)groups.push({id:sid(a.id,'rg',G.rgid),src:'mb',mbid:G.rgid,title:G.title,year:G.year,kind:G.kind,...(G.img?{img:G.img}:{}),items});
  }
  const manual=[];
  for(const g of a.groups){if(replaced(g))continue;
    const items=[];for(const i of g.items){const k=mbItemKey(i);if(placed.has(k))continue;placed.add(k);items.push(Object.assign({},i,{id:idFor(k)}))}
    if(items.length)manual.push(Object.assign({},g,{items}));
    else if(rating(g.id)&&!incoming.some(G=>nTitle(G.title)===nTitle(g.title)))manual.push(Object.assign({},g,{items}))}
  const kept=[];let dropped=0;const usedIds=new Set([...groups,...manual].flatMap(g=>g.items.map(i=>i.id)));
  for(const g of a.groups){if(!replaced(g))continue;
    for(const i of g.items){const k=mbItemKey(i);if(placed.has(k))continue;placed.add(k);
      const id=idFor(k);if(usedIds.has(id))continue;
      if(mbMarked(id)||(tidy&&g.src==='kept'))kept.push({id,title:i.title,k});else dropped++}}
  const oldR=a.groups.map(g=>[nTitle(g.title),rating(g.id)]).filter(x=>x[1]);
  a.groups=[...groups,...manual];
  const fromSp=tidy?a.src==='sp':!!sp;
  if(kept.length)a.groups.push({id:sid(a.id,'kept'),src:'kept',title:'Kept from your earlier list',year:'—',kind:fromSp?'Not on Spotify':'Not in the MusicBrainz import',items:kept});
  a.mbid=art.id;if(!tidy){a.name=art.name;a.mbVersions=!!versions;a.mbAt=Date.now();a.src=sp?'sp':'mb';if(sp)a.spid=sp.id}
  for(const g of a.groups){if(rating(g.id))continue;const o=oldR.find(x=>x[0]===nTitle(g.title));if(o)S.marks[g.id]={...(S.marks[g.id]||{}),r:o[1]}}
  applyPending(a);
  const all=groups.flatMap(g=>g.items),kinds={};groups.forEach(g=>kinds[g.kind]=(kinds[g.kind]||0)+1);
  return{aid:a.id,name:a.name,kinds,songs:all.length,added:all.filter(i=>!before.has(i.id)).length,kept:kept.length,dropped,src:fromSp?'sp':'mb'};
}
function mbTidy(a){
  const inc=a.groups.filter(g=>g.src==='mb').map(g=>({rgid:g.mbid,title:g.title,year:g.year,kind:g.kind,img:g.img||'',items:g.items.map(i=>({k:mbItemKey(i),title:i.title}))}));
  mbMerge({id:a.mbid,name:a.name},inc,a.mbVersions,true);
}
function mbReportText(r){
  const names={'Studio album':['studio album','studio albums'],'EP':['EP','EPs'],'Single':['single','singles'],'Compilation':['compilation','compilations'],'Live':['live release','live releases'],'Other':['other release','other releases']};
  const parts=MB_KIND_ORDER.filter(k=>r.kinds[k]).map(k=>r.kinds[k]+' '+names[k][r.kinds[k]===1?0:1]);
  let s=r.name+': '+parts.join(', ')+' · '+r.songs+' songs'+(r.added===r.songs?'.':'. '+r.added+' new, '+(r.songs-r.added)+' were already in your log with their checkmarks and ratings.');
  const where=r.src==='sp'?'on Spotify':'on MusicBrainz';
  if(r.src==='sp')s=r.name+' (tracklists from Spotify): '+s.slice(r.name.length+2);
  if(r.kept)s+=' '+r.kept+' song'+(r.kept===1?'':'s')+' you had marked '+(r.kept===1?"isn't":"aren't")+' '+where+', so '+(r.kept===1?'it stays':'they stay')+' in “Kept from your earlier list”.';
  if(r.dropped)s+=' '+r.dropped+' unmarked song'+(r.dropped===1?' from the old list was':'s from the old list were')+' not '+(r.src==='sp'?'on Spotify':'found')+' and removed.';
  return s;
}

async function mbSearch(q){

async function mbImport(art,where){
  if(MBX.busy)return;

  Object.assign(MBX,{busy:true,cancel:false,err:'',report:'',where,errWhere:where,aid:existing?existing.id:null,name:art.name,step:'Asking MusicBrainz',n:0,of:0,note:''});render();
  let phase='mb',hint='';
  try{
    let groups=null,sp=null;
    if(spCanImport()){
      phase='sp';

        if(!groups.length){groups=null;sp=null;hint=' Spotify had no releases for this artist, so this came from MusicBrainz.'}}

    if(!groups){

    touch();
    UI.tab='music';UI.sel.music=r.aid;UI.filter='all';
    try{localStorage.setItem(KEY+'_tab','music')}catch(e){}

  }catch(e){MBX.err=phase==='sp'&&e.code!=='cancel'?spImportMessage(e):mbMessage(e,art.name)}
  finally{MBX.busy=false;MBX.cancel=false;render()}
  /* on a phone the sheet sits below the sidebar: bring the result into view */

}

/* ---------- Rate Your Music album ratings ----------
   RYM's export is one row per rated release (ratings already run 1-10). Each
   rating goes onto the matching album or EP here; anything not here yet waits in
   S.pendingR and fills in the moment that artist is imported. Matching is by
   artist and title, never by year: RYM often carries a reissue date. */
const RATEABLE=['Studio album','EP','Live','Compilation','Other'];
const RYX={err:'',report:null};
const decodeEnt=x=>{const t=document.createElement('textarea');t.innerHTML=x;return t.value};
const nrm=x=>decodeEnt(String(x)).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/&/g,' and ').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const nArtist=x=>nrm(x).replace(/^the /,'');
const nTitle=x=>nrm(String(x).replace(/\s*[\(\[][^)\]]*(deluxe|remaster|edition|version|anniversary|expanded)[^)\]]*[\)\]]/ig,''));
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function rymEntries(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('shape');
  const H=rows[0].map(h=>h.trim().toLowerCase()),ix=n=>H.indexOf(n);
  if(['title','rating','last name'].some(n=>ix(n)<0))throw new Error('shape');
  const get=(r,n)=>ix(n)<0?'':String(r[ix(n)]||'').trim();
  const by=new Map();let zero=0;
  for(const r of rows.slice(1)){
    const title=decodeEnt(get(r,'title')),rate=parseFloat(get(r,'rating'));
    if(!title)continue;
    if(!(rate>0)){zero++;continue}
    const prim=decodeEnt([get(r,'first name'),get(r,'last name')].filter(Boolean).join(' ')),br=prim.match(/\[(.+)\]\s*$/);
    const fl=get(r,'first name localized'),ll=get(r,'last name localized');
    const display=br?br[1]:prim;
    const names=[...new Set([display,prim,fl&&ll?fl+' '+ll:'',fl&&ll?ll+' '+fl:'',ll].filter(Boolean).map(nArtist))];
    const key=nArtist(display)+'|'+nTitle(title),yr=parseInt(get(r,'release_date'))||9999;
    const e={key,a:display,t:title,r:Math.min(10,rate),n:names,yr};
    const o=by.get(key);if(!o)by.set(key,{...e,dups:[]});
    else{const keep=e.yr<o.yr?e:o,drop=keep===e?o:e;
      by.set(key,{...keep,dups:[...o.dups,...(drop.r!==keep.r?[drop.r]:[])]})}
  }
  return{list:[...by.values()],zero};
}
const pendingFor=a=>{const k=nArtist(a.name);return Object.entries(S.pendingR||{}).filter(([,p])=>p.n.includes(k))};
function rymGroup(a,tk){return a.groups.find(g=>RATEABLE.includes(g.kind)&&nTitle(g.title)===tk)}
/* ratings that were waiting for this artist's albums land on them now */
function applyPending(a){
  let n=0;
  for(const [key,p] of pendingFor(a)){
    const g=rymGroup(a,key.split('|')[1]);if(!g)continue;
    if(!rating(g.id)){S.marks[g.id]={...(S.marks[g.id]||{}),r:p.r};n++}
    delete S.pendingR[key];
  }
  return n;
}
/* artists you do not have yet come in with just the albums you rated (no songs
   until you pull the tracklist from MusicBrainz); their ratings go straight on */
function rymAddWaiting(){
  const out={artists:0,albums:0},made=new Map();
  for(const [key,p] of Object.entries(S.pendingR||{})){
    const k=nArtist(p.a);let a=made.get(k);
    if(!a){if(S.music.some(x=>p.n.includes(nArtist(x.name))))continue;
      a={id:sid('artist',p.a),name:p.a,groups:[]};made.set(k,a)}
    const g={id:sid(a.id,p.t),title:p.t,year:p.y&&p.y<9999?String(p.y):'—',kind:'Studio album',items:[]};
    if(a.groups.some(x=>x.id===g.id))continue;
    a.groups.push(g);S.marks[g.id]={...(S.marks[g.id]||{}),r:p.r};delete S.pendingR[key];out.albums++;
  }
  [...made.values()].sort((x,y)=>x.name.localeCompare(y.name)).forEach(a=>{a.groups.sort((x,y)=>(x.year>y.year)-(x.year<y.year));S.music.push(a);out.artists++});
  return out;
}
const rymMissing=()=>Object.values(S.pendingR||{}).filter(p=>!S.music.some(x=>p.n.includes(nArtist(x.name)))).length;
function rymImport(text){
  RYX.err='';RYX.report=null;
  try{
    const {list,zero}=rymEntries(text);
    S.pendingR=S.pendingR||{};
    const rp={total:list.length,zero,filled:0,same:0,kept:[],waiting:[],notFound:[],dups:[]};
    for(const e of list){
      if(e.dups.length)rp.dups.push(e.a+' – '+e.t+': kept '+fmt(e.r)+' (also '+e.dups.map(fmt).join(', ')+')');
      const a=S.music.find(x=>e.n.includes(nArtist(x.name)));
      const g=a&&rymGroup(a,e.key.split('|')[1]);
      if(g){
        const cur=rating(g.id);delete S.pendingR[e.key];
        if(!cur){S.marks[g.id]={...(S.marks[g.id]||{}),r:e.r};rp.filled++}
        else if(cur===e.r)rp.same++;
        else rp.kept.push(e.a+' – '+e.t+': you have '+fmt(cur)+' here, RYM says '+fmt(e.r));
      }else{
        S.pendingR[e.key]={a:e.a,t:e.t,r:e.r,n:e.n,y:e.yr};
        (a?rp.notFound:rp.waiting).push(e);
      }
    }
    rp.added=rymAddWaiting();
    RYX.report=rp;touch();
  }catch(err){
    RYX.err=err.message==='shape'?'That does not look like a Rate Your Music export (it needs Title, Rating and name columns). Nothing was changed.':'Could not read that file. Nothing was changed.';
  }
  render();
}
function rymReport(){
  const r=RYX.report,cnt=(n,w)=>n+' '+w+(n===1?'':'s');
  const byArtist=l=>{const m={};l.forEach(e=>m[e.a]=(m[e.a]||0)+1);return Object.entries(m).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0])).map(([k,v])=>esc(k)+' ('+v+')').join(', ')};
  let h=`<div class="mbok rymrep" role="status"><span><b>${cnt(r.total,'rated album')}</b> in your file. ${r.filled} filled in now${r.same?', '+r.same+' already matched':''}.</span>`;
  if(r.added&&r.added.artists)h+=`<span>Added <b>${cnt(r.added.artists,'new artist')}</b> with just the ${cnt(r.added.albums,'album')} you rated. Open an artist and tap Find on MusicBrainz to fill in the songs; your ratings stay.</span><details><summary>Which artists</summary><p class="note">${byArtist(r.waiting)}</p></details>`;
  if(r.notFound.length)h+=`<span>${r.notFound.length} are for artists you have, but I could not find the album under the same name.</span><details><summary>Which albums</summary><ul>${r.notFound.map(e=>'<li>'+esc(e.a+' – '+e.t)+'</li>').join('')}</ul></details>`;
  if(r.kept.length)h+=`<span>${cnt(r.kept.length,'rating')} here already differed, so I kept yours.</span><details><summary>Which</summary><ul>${r.kept.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`;
  if(r.dups.length)h+=`<details><summary>${cnt(r.dups.length,'album')} appeared twice in your file</summary><ul>${r.dups.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="note">I used the earliest release.</p></details>`;
  if(r.zero)h+=`<span class="note">${cnt(r.zero,'row')} had no rating (singles and the like) and were skipped.</span>`;
  return h+'</div>';
}
function rymSide(){
  const n=Object.keys(S.pendingR||{}).length;
  let h=`<div class="add"><span class="label">Import ratings from Rate Your Music</span>
    <p class="note">Pick the CSV you exported from RYM. Album and EP ratings land on the releases you already have here; the rest wait for that artist.</p>
    <div><label class="btn primary" for="rym-file">Choose CSV file</label><input type="file" id="rym-file" accept=".csv,text/csv,text/plain" hidden></div>`;
  if(RYX.err)h+=`<p class="mberr" role="alert">${esc(RYX.err)}</p>`;
  if(RYX.report)h+=rymReport();
  const miss=rymMissing();
  if(miss)h+=`<div><button class="btn" data-act="rymadd">Add the ${miss} waiting album${miss===1?'':'s'} and their artists</button></div>`;
  if(!RYX.report&&n-miss>0)h+=`<p class="note">${cnt0(n-miss)} held for albums not found under an artist you have.</p>`;
  return h+'</div>';
}
const cnt0=n=>n+' rating'+(n===1?'':'s');

/* ---------- Rate Your Music song ratings ----------
   RYM's CSV export has no song ratings, so a small Tampermonkey script
   (rym-helper.user.js in this repo) reads them off the album pages you open on
   RYM and queues them. It hands the queue over with postMessage; anything that
   lands goes back as "done" and leaves the queue, the rest waits for that artist
   or album to be here. A song rating you already set is never overwritten. */
const RTX={bridge:false,queue:[],report:null};
const HELPER_URL='https://frostie4life9.github.io/playback/rym-helper.user.js';
const rtClean=x=>{                        /* the queue comes from outside the app: check every field */
  if(!x||typeof x!=='object'||typeof x.url!=='string'||!/^https:\/\/rateyourmusic\.com\/release\//.test(x.url))return null;
  const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';
  const artists=(Array.isArray(x.artists)?x.artists:[]).map(a=>str(a,200)).filter(Boolean).slice(0,10);
  const tracks=(Array.isArray(x.tracks)?x.tracks:[]).map(t=>({t:str(t&&t.t,300),r:Math.round(Math.min(10,Math.max(0,+(t&&t.r)||0))*2)/2})).filter(t=>t.t&&t.r>0).slice(0,200);
  const title=str(x.title,300);
  if(!title||!artists.length||!tracks.length)return null;
  return{url:x.url,title,artists,tracks,tracklist:(Array.isArray(x.tracklist)?x.tracklist:[]).map(t=>str(t,300)).filter(Boolean).slice(0,200)};
};
window.addEventListener('message',e=>{
  if(e.source!==window||e.origin!==location.origin)return;
  const d=e.data;if(!d||d.src!=='rym-bridge'||d.type!=='queue'||!Array.isArray(d.items))return;
  RTX.bridge=true;RTX.queue=d.items.map(rtClean).filter(Boolean);
  if(UI.tab==='music')render();
});
const rtAsk=()=>window.postMessage({src:'playback',type:'ask'},location.origin);
setTimeout(rtAsk,300);setTimeout(rtAsk,2000);           /* the helper loads after the page */
function rtArtist(names){const ns=names.map(nArtist);return S.music.find(x=>ns.includes(nArtist(x.name)))}
function rtGroup(a,title){const k=nTitle(title),hits=a.groups.filter(g=>nTitle(g.title)===k);return hits.find(g=>RATEABLE.includes(g.kind))||hits[0]}
function rtImport(){
  const rp={albums:0,filled:0,same:0,kept:[],missing:[],songs:[],made:0},done=[];
  for(const e of RTX.queue){
    const a=rtArtist(e.artists),g=a&&rtGroup(a,e.title);
    if(!g){rp.missing.push(e.artists[0]+' – '+e.title+(a?' (album not found under '+a.name+')':' (artist not here yet)'));continue}
    /* an album that came in from the CSV has no songs yet: give it RYM's tracklist,
       with the same song IDs a later MusicBrainz import uses, so nothing doubles */
    if(!g.items.length){
      const seen=new Map();a.groups.forEach(x=>x.items.forEach(i=>seen.set(mbItemKey(i),i.id)));
      for(const t of (e.tracklist.length?e.tracklist:e.tracks.map(x=>x.t))){const k=mbKeyOf(t);if(!k||seen.has(k))continue;
        const id=sid(a.id,'song',k);seen.set(k,id);g.items.push({id,title:t,k});rp.made++}
    }
    const byKey=new Map();g.items.forEach(i=>byKey.set(mbItemKey(i),i));
    const other=new Map();a.groups.forEach(x=>x.items.forEach(i=>{const k=mbItemKey(i);if(!other.has(k))other.set(k,i)}));
    for(const t of e.tracks){
      const i=byKey.get(mbKeyOf(t.t))||other.get(mbKeyOf(t.t));

/* ---------- Spotify: songs you play get checked off ----------

async function wkSp(method,body,q){

const spSlim=items=>items.map(x=>{const t=x.track||{};return{p:Date.parse(x.played_at)||0,t:t.name||'',a:(t.artists||[]).map(a=>a.name).filter(Boolean),al:(t.album&&t.album.name)||''}}).filter(x=>x.p&&x.t);

/* ---------- Spotify catalog: tracklists exactly as Spotify carries them ----------

   singles and compilations from Spotify itself (market=from_token, so only what
   plays in your country), one album at a time. With sync Worker v4 the requests go
   through the Worker's sign-in (/spotify/api); without a Worker, this device's own.
   Editions of one release (deluxe, remaster, clean/explicit) fold into one: the
   standard one's tracklist, then any songs only the other editions carry. */
function spCanImport(){

let spLast=0;
const spRel=u=>String(u||'').replace(/^https:\/\/api\.spotify\.com\/v1\//,'');
async function spApi(path){
  for(let tries=0;;tries++){
    const wait=spLast+150-Date.now();if(wait>0)await mbSleep(wait);
    if(MBX.cancel)throw MBError('cancel');
    spLast=Date.now();
    const viaW=spViaWorker();let r;
    try{
      if(viaW)r=await fetch(SY.url.replace(/\/+$/,'')+'/spotify/api?p='+encodeURIComponent(path),{cache:'no-store',headers:{'x-sync-key':SY.key}});
      else{await spLocalToken();r=await fetch(SP_API+path,{headers:{authorization:'Bearer '+SPL.at}})}
    }catch(e){if(e&&e.code)throw e;throw SPError('network')}
    if(r.status===429||r.status===503||r.status===502){
      if(tries>=5)throw SPError('busy',r.status);
      const ra=parseInt(r.headers.get('retry-after'),10);
      MBX.note='Spotify asked for a short pause';mbProgress();
      await mbSleep((ra>0?Math.min(ra,30):2+tries*3)*1000);MBX.note='';continue;
    }
    if(r.status===401){if(viaW)throw SPError('synckey',401);if(tries<1){SPL.exp=0;splSave();continue}throw SPError('reconnect',401)}
    if(r.status===409){const j=await r.json().catch(()=>({}));throw SPError(j.error==='reconnect'?'reconnect':'notconnected',409)}
    if(r.status===403)throw SPError('forbidden',403);
    if(!r.ok)throw SPError('http',r.status);
    try{return await r.json()}catch(e){throw SPError('http',r.status)}
  }
}
function spImportMessage(e){
  if(e.code==='notconnected')return 'Spotify is not connected on your Worker, so the import could not read Spotify. Connect it in the Spotify box, then try again. Nothing in your log was changed.';
  return 'Spotify import stopped: '+spMessage(e)+' Nothing in your log was changed.';

function spPickImg(imgs){

async function spFetchCatalog(art,existing){

  if(!id){
    const j=await spApi('search?'+new URLSearchParams({q:art.name,type:'artist',limit:10}));
    const list=(j.artists&&j.artists.items)||[],n=nArtist(art.name);

    if(!hit)throw SPError('nomatch');

  }

    catch(e){if(e.code==='http'&&e.status===400&&lim>10){lim=10;continue}throw e}

const SP_ED=/\b(deluxe|remaster(ed)?|edition|anniversary|expanded|bonus|special|explicit|clean|reissue)\b/i;

function spBuild(albums,artistId,versions){

    const nm=String(al.name||''),type=al.album_type||'album';
    const tr=(al.tracks||[]).filter(t=>t&&t.name&&t.is_playable!==false&&t.type!=='episode'&&(type!=='compilation'||(t.artists||[]).some(x=>x.id===artistId)));

    const alt=/\b(remix(es|ed)?|instrumentals|karaoke|demos)\b/i.test(nm);
    if((live||alt)&&!versions)continue;
    const kind=live?'Live':type==='compilation'?'Compilation':alt?'Other':type==='album'?'Studio album':(/\bEP\b/.test(nm)||tr.length>=4)?'EP':'Single';
    const ek=kind+'|'+spEd(nm);
    if(!byEd.has(ek))byEd.set(ek,[]);
    byEd.get(ek).push({al,tr,kind,date:mbDateKey(al.release_date)});
  }
  const T=t=>({title:t.name,recording:{title:t.name}});

    eds.sort((a,b)=>(tagged(a)-tagged(b))||(ex(b)-ex(a))||(a.tr.length-b.tr.length)||(a.date<b.date?-1:a.date>b.date?1:0));

    h+=`<p class="note">${viaW?'Your Worker will check Spotify every hour, so plays are caught even while the app is closed.':'This device will check Spotify each time you open the app. Spotify only remembers your last 50 plays, so open it at least every few hours of listening, or update your sync Worker and it checks every hour for you.'}</p>
      <div class="tools"><button class="btn primary" data-act="spgo" ${SPX.busy?'disabled':''}>${SPX.busy?'Connecting…':'Connect Spotify'}</button><button type="button" class="link" data-act="spcid">Change Client ID</button></div>
      <p class="note">Connect on your PC. On iPhone the home-screen app does not get the sign-in back from Spotify.</p>`;
  }else{
    const err=viaW&&w&&w.err;
    h+=`<span class="sp-on${err||SPX.err?' err':''}"><i></i>Spotify connected</span>
      <p class="note">${viaW?'Your Worker checks every hour'+(w.polled?', last at '+esc(new Date(w.polled).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})):'')+'.':'Checked when you open the app on this device.'}${S.sp&&S.sp.last?' Last new plays: '+S.sp.last.plays+', '+S.sp.last.marked+' song'+(S.sp.last.marked===1?'':'s')+' checked off ('+esc(new Date(S.sp.last.at).toLocaleDateString([],{month:'short',day:'numeric'}))+').':''}</p>`;
    if(viaW&&(SY.wv||0)<4)h+=`<p class="note">Paste the updated sync Worker (worker/playback-sync.js) into Cloudflare so discography imports can use Spotify’s own tracklists.</p>`;
    if(err)h+=`<p class="mberr" role="alert">${esc(err==='reconnect'?spMessage({code:'reconnect'}):'Your Worker could not reach Spotify last time ('+err+'). It will try again on its next check.')}</p>`;
    if(viaW&&w&&(!w.cronAt||Date.now()-w.cronAt>3*3600e3))h+=`<div class="mbsrc warn"><p class="note">Your Worker's hourly check is not on yet, so plays are only picked up when you open the app. In Cloudflare open <b>playback-sync</b> › <b>Settings</b> › <b>Trigger events</b> › <b>Add</b> › <b>Cron trigger</b>, choose every hour (<code class="uri">0 * * * *</code>) and save.</p></div>`;
    if(!viaW&&syncOn())h+=`<p class="note">Paste the new worker/playback-sync.js into your Worker and it will take over and check every hour, even with the app closed.</p>`;
    h+=`<div class="tools"><button class="btn" data-act="spnow" ${SPX.busy?'disabled':''}>${SPX.busy?'Checking…':'Check now'}</button><button class="btn danger" data-act="spoff" ${SPX.busy?'disabled':''}>Disconnect</button></div>`;
  }
  if(SPX.err)h+=`<p class="mberr" role="alert">${esc(SPX.err)}</p>`;
  const m=S.sp&&S.sp.miss||[];
  if(m.length){const why={artist:'artist not here yet',song:'song not in the list',version:'that version is not in the list'};
    h+=`<details class="spmiss"><summary class="note">${m.length} song${m.length===1?'':'s'} you played that are not in Playback</summary>
      <ul>${m.map(x=>`<li>${esc(x.a)} – ${esc(x.t)} <span class="why">(${why[x.why]||x.why})</span></li>`).join('')}</ul>
      <div><button type="button" class="link" data-act="spmissclear">Clear this list</button></div></details>`}
  return h+'</div>';
}

/* ---------- TMDB for the Screen tab ----------
   Search shows and films on The Movie Database and bring in the poster, year,
   seasons and episode counts. The TMDB key lives in the log (S.cfg.tmdb), so it
   reaches the other devices through the playback-sync Worker and never sits in
   this public repo.
   Episode IDs come from show ID + season + episode number, exactly like shows
   added by hand, so importing over a hand-added show keeps every checkmark.
   Only aired episodes are counted (an airing season would otherwise sit below
   100% for episodes that don't exist yet). "Check for new episodes", plus a
   quiet once-a-day check of shows still airing, adds them as they come out.
   Specials (season 0) stay out. An episode that is checked or rated is never
   dropped, even if TMDB's count goes down. */
const TM_API='https://api.themoviedb.org/3/',TM_IMG='https://image.tmdb.org/t/p/';
const TMX={q:'',results:null,searching:false,busy:false,err:'',errWhere:'side',report:'',sid:null,keyOpen:false,keyErr:'',keyBusy:false,auto:false};
const tmKey=()=>(S.cfg&&S.cfg.tmdb)||'';
function TMError(code,status){const e=new Error(code);e.code=code;e.status=status;return e}
async function tmGet(path,params,key){
  key=key||tmKey();if(!key)throw TMError('nokey');
  const u=new URL(TM_API+path);Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
  const h={accept:'application/json'};
  if(/^eyJ/.test(key))h.authorization='Bearer '+key;else u.searchParams.set('api_key',key);   /* read access token or v3 key */
  let r;try{r=await fetch(u,{headers:h})}catch(e){throw TMError(navigator.onLine===false?'offline':'network')}
  if(r.status===401)throw TMError('badkey',401);
  if(r.status===404)throw TMError('gone',404);
  if(r.status===429)throw TMError('busy',429);
  if(!r.ok)throw TMError('http',r.status);
  return r.json();
}
function tmMessage(e,q){
  switch(e.code){
    case 'nokey':return 'Add your TMDB key first.';
    case 'badkey':return 'TMDB did not accept that key. Copy it again from themoviedb.org under Settings › API.';
    case 'offline':return 'You look offline. Try again once you are connected.';
    case 'network':return 'Could not reach TMDB. Check your connection and try again.';
    case 'busy':return 'TMDB is asking for a short break. Try again in a few seconds.';
    case 'nomatch':return 'Nothing on TMDB matches “'+q+'”. Try the original title or fewer words.';
    case 'gone':return 'TMDB no longer has that title.';
    default:return 'TMDB had a problem ('+(e.status||e.message)+'). Try again in a moment.';
  }
}
const tmYear=d=>String(d||'').slice(0,4);
const tmDay=d=>{const t=new Date(d+'T12:00:00');return isNaN(t)?'':t.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})};

/* the entry a TMDB title belongs to: already linked, or added by hand under the same title */
function tmExisting(kind,tid,title,year){
  return S.screen.find(x=>x.type===kind&&x.tmdb===tid)
    ||S.screen.find(x=>x.type===kind&&!x.tmdb&&x.id===(kind==='show'?sid('show',title):sid('film',title,year||'')))
    ||S.screen.find(x=>x.type===kind&&!x.tmdb&&nrm(x.title)===nrm(title)&&(!x.year||!year||x.year===year));
}

async function tmFetchShow(tid){
  const j=await tmGet('tv/'+tid,{language:'en-US',append_to_response:'watch/providers'});
  const last=j.last_episode_to_air,nxt=j.next_episode_to_air,seasons=[];
  for(const se of (j.seasons||[])){
    const n=se.season_number;if(!(n>0))continue;
    const total=se.episode_count||0;
    const aired=!last?0:n<last.season_number?total:n===last.season_number?last.episode_number:0;
    seasons.push({n,aired,total:Math.max(total,aired)});
  }
  return{title:j.name||j.original_name||'Untitled',year:tmYear(j.first_air_date),poster:j.poster_path||'',status:j.status||'',seasons,...tmInfo(j),watch:tmWatch(j['watch/providers']),
    next:nxt&&nxt.air_date?{n:nxt.season_number,e:nxt.episode_number,d:nxt.air_date}:null};
}
async function tmFetchFilm(tid){
  const j=await tmGet('movie/'+tid,{language:'en-US',append_to_response:'watch/providers'});
  return{title:j.title||j.original_title||'Untitled',year:tmYear(j.release_date),poster:j.poster_path||'',runtime:j.runtime||0,...tmInfo(j),watch:tmWatch(j['watch/providers'])};
}
/* Where to watch. TMDB passes on JustWatch's list per country: stream (subscription),
   free or with ads, rent, buy. It is a handful of names, so it lives on the entry and
   syncs. Shows still airing refresh it with their daily check; anything else picks it
   up again when you open it and it is over a week old. */
const tmRegion=()=>(S.cfg&&S.cfg.region)||'US';
function tmWatch(wp){
  const w=wp&&wp.results&&wp.results[tmRegion()]||{},seen=new Set();
  const pick=(...lists)=>lists.flatMap(a=>a||[]).sort((x,y)=>(x.display_priority??99)-(y.display_priority??99))
    .filter(p=>p&&p.provider_name&&!seen.has(p.provider_name)&&seen.add(p.provider_name)).slice(0,8).map(p=>[p.provider_name,p.logo_path||'']);
  const s=pick(w.flatrate),f=pick(w.free,w.ads);
  seen.clear();const r=pick(w.rent);seen.clear();const b=pick(w.buy);
  return{at:Date.now(),c:tmRegion(),link:w.link||'',s,f,r,b};
}
const TMW={busy:null,failed:{}};
const tmwKey=x=>x.type+':'+x.tmdb;
function tmNeedsWatch(x){
  if(!x.tmdb||!tmKey()||TMW.busy||TMW.failed[tmwKey(x)])return false;
  return !x.watch||x.watch.c!==tmRegion()||Date.now()-(x.watch.at||0)>7*864e5;
}
async function tmLoadWatch(x){
  if(!tmNeedsWatch(x))return;
  TMW.busy=x.id;render();
  try{x.watch=tmWatch(await tmGet((x.type==='film'?'movie/':'tv/')+x.tmdb+'/watch/providers'));touch()}
  catch(e){TMW.failed[tmwKey(x)]=true}
  finally{TMW.busy=null;render()}
}
function watchBlock(x){
  if(!x.tmdb)return '';
  const w=x.watch;
  if(!w)return TMW.busy===x.id?'<p class="note">Checking where it\u2019s streaming\u2026</p>':'';
  const chips=a=>a.map(([n,l])=>`<span class="prov${l?'':' noimg'}">${l?`<img src="${TM_IMG}w45${esc(l)}" alt="" width="20" height="20" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('noimg');this.remove()">`:''}${esc(n)}</span>`).join('');
  const row=(k,a)=>`<div class="provrow"><span class="pk">${k}</span>${chips(a)}</div>`;
  const free=[w.s.length?row('Stream',w.s):'',w.f.length?row('Free',w.f):''].join('');
  const pay=[w.r.length?row('Rent',w.r):'',w.b.length?row('Buy',w.b):''].join('');
  let h=`<div class="watch"><span class="label">Where to watch \u00b7 ${esc(w.c||'US')}</span>`;
  if(!free&&!pay)h+=`<p class="note">Not streaming, for rent or for sale anywhere in the ${esc(w.c||'US')} right now.</p>`;
  else if(free)h+=free+(pay?`<details><summary>Rent or buy</summary>${pay}</details>`:'');
  else h+=`<p class="note">Not on any streaming service right now. You can rent or buy it:</p>`+pay;
  h+=`<p class="note tmcredit">Streaming data from JustWatch, via TMDB \u00b7 checked ${esc(new Date(w.at).toLocaleDateString([],{month:'short',day:'numeric'}))}${w.link?` \u00b7 <a href="${esc(w.link)}" target="_blank" rel="noopener">See the links</a>`:''}</p></div>`;
  return h;
}
/* the short facts about a title: small, so they live on the entry and sync */
function tmInfo(j){
  return{overview:j.overview||'',genres:(j.genres||[]).map(g=>g.name).slice(0,4),
    network:((j.networks||[])[0]||{}).name||'',creators:(j.created_by||[]).map(c=>c.name).slice(0,3)};
}

/* Episode names, descriptions, air dates and runtimes. A long show is a lot of text,
   so this does NOT go in the synced log: each device keeps its own copy in
   localStorage and fetches it from TMDB (up to 20 seasons per request) the first
   time a show is opened, and again after the show is checked for new episodes. */
const TMC_KEY=KEY+'_eps';
let TMC=(()=>{try{return JSON.parse(localStorage.getItem(TMC_KEY))||{}}catch(e){return{}}})();
const TME={busy:null,failed:{}};
function tmcSave(){try{localStorage.setItem(TMC_KEY,JSON.stringify(TMC))}catch(e){TMC={};try{localStorage.removeItem(TMC_KEY)}catch(_){}}}
function epInfo(s,n,e){const c=s.tmdb&&TMC[s.tmdb];const l=c&&c.s[n];return l&&l[e-1]||null}
function tmNeedsEps(s){
  if(!s.tmdb||!tmKey()||TME.busy||TME.failed[s.tmdb])return false;
  const c=TMC[s.tmdb];return !c||c.at<(s.tmAt||0)||(!s.hasInfo);
}
async function tmLoadEps(s){
  if(!tmNeedsEps(s))return;
  TME.busy=s.tmdb;
  try{
    const nums=s.seasons.map(x=>x.n),out={};let info=null;
    for(let i=0;i<Math.max(nums.length,1);i+=20){
      const chunk=nums.slice(i,i+20);
      const j=await tmGet('tv/'+s.tmdb,{language:'en-US',...(chunk.length?{append_to_response:chunk.map(n=>'season/'+n).join(',')}:{})});
      if(!info)info=tmInfo(j);
      for(const n of chunk){const se=j['season/'+n];if(!se)continue;
        out[n]=(se.episodes||[]).sort((a,b)=>a.episode_number-b.episode_number)
          .map(e=>({t:e.name||'',o:e.overview||'',d:e.air_date||'',rt:e.runtime||0}))}
    }
    TMC[s.tmdb]={at:Date.now(),s:out};tmcSave();
    if(info){Object.assign(s,info,{hasInfo:true});touch()}
  }catch(e){TME.failed[s.tmdb]=true}
  finally{TME.busy=null;render()}
}
const tmMarked=id=>{const m=S.marks[id];return !!(m&&(m.done||m.r))};
function tmMergeShow(tid,d){
  let s=tmExisting('show',tid,d.title,d.year),isNew=false;
  if(!s){let id=sid('show',d.title);if(S.screen.some(x=>x.id===id))id=sid('show',d.title,'tmdb',tid);
    s={id,type:'show',title:d.title,year:d.year,seasons:[]};S.screen.push(s);isNew=true}
  const before=epIds(s).length,old=new Map(s.seasons.map(x=>[x.n,x])),out=[];
  const lastMarked=(n,upto)=>{for(let e=upto;e>0;e--)if(tmMarked(sid(s.id,'s',n,'e',e)))return e;return 0};
  for(const t of d.seasons){const cur=old.get(t.n);old.delete(t.n);
    out.push({n:t.n,eps:Math.max(t.aired,cur?lastMarked(t.n,cur.eps):0),total:t.total})}
  for(const cur of old.values()){const k=lastMarked(cur.n,cur.eps);if(k)out.push({n:cur.n,eps:k})}   /* not on TMDB: kept only if you checked something */
  s.seasons=out.sort((a,b)=>a.n-b.n);
  Object.assign(s,{title:d.title,year:d.year||s.year||'',tmdb:tid,poster:d.poster,status:d.status,next:d.next,tmAt:Date.now(),overview:d.overview,genres:d.genres,network:d.network,creators:d.creators,hasInfo:true,...(d.watch?{watch:d.watch}:{})});
  delete TME.failed[tid];
  delete s.example;
  return{sid:s.id,isNew,added:epIds(s).length-before};
}
function tmMergeFilm(tid,d){
  let f=tmExisting('film',tid,d.title,d.year),isNew=false;
  if(!f){let id=sid('film',d.title,d.year||'');if(S.screen.some(x=>x.id===id))id=sid('film',d.title,'tmdb',tid);
    f={id,type:'film'};S.screen.push(f);isNew=true}
  Object.assign(f,{title:d.title,year:d.year||f.year||'',tmdb:tid,poster:d.poster,runtime:d.runtime,tmAt:Date.now(),overview:d.overview,genres:d.genres,...(d.watch?{watch:d.watch}:{})});
  delete f.example;
  return{sid:f.id,isNew};
}
function tmShowReport(r,d){
  const s=S.screen.find(x=>x.id===r.sid),n=epIds(s).length,seas=s.seasons.filter(x=>x.eps).length;
  let t=r.isNew?`Added ${d.title}: ${seas} season${seas===1?'':'s'}, ${n} episode${n===1?'':'s'} out so far.`
    :r.added>0?`${r.added} new episode${r.added===1?'':'s'} added to ${d.title}. Your checkmarks stayed put.`
    :`${d.title} is up to date. Your checkmarks stayed put.`;
  if(d.next)t+=` Next up: ${sxe(d.next.n,d.next.e)} on ${tmDay(d.next.d)}.`;
  return t;
}

async function tmSearch(q){
  if(TMX.searching||TMX.busy)return;
  Object.assign(TMX,{q,err:'',report:'',results:null,searching:true,errWhere:'side'});render();
  try{
    const j=await tmGet('search/multi',{query:q,include_adult:'false',language:'en-US',page:'1'});
    const list=(j.results||[]).filter(x=>x.media_type==='tv'||x.media_type==='movie').slice(0,8);
    if(!list.length)throw TMError('nomatch');
    TMX.results=list.map(x=>{const t=x.name||x.title||'Untitled',o=x.original_name||x.original_title||'';
      return{id:x.id,kind:x.media_type==='tv'?'show':'film',title:t,year:tmYear(x.first_air_date||x.release_date),poster:x.poster_path||'',orig:o&&o!==t?o:''}});
  }catch(e){TMX.err=tmMessage(e,q)}
  TMX.searching=false;render();
}
async function tmImport(pick,where){
  if(TMX.busy)return;
  Object.assign(TMX,{busy:true,err:'',report:'',errWhere:where,sid:pick.sid||null});render();
  try{
    let r,txt;
    if(pick.kind==='show'){const d=await tmFetchShow(pick.id);r=tmMergeShow(pick.id,d);txt=tmShowReport(r,d)}
    else{const d=await tmFetchFilm(pick.id);r=tmMergeFilm(pick.id,d);txt=`${r.isNew?'Added':'Updated'} ${d.title}${d.year?' ('+d.year+')':''}.`}
    touch();
    UI.tab='screen';UI.sel.screen=r.sid;try{localStorage.setItem(KEY+'_tab','screen')}catch(e){}
    Object.assign(TMX,{report:txt,results:null,q:'',errWhere:'sheet',sid:r.sid});
  }catch(e){TMX.err=tmMessage(e,pick.title)}
  finally{TMX.busy=false;render()}
  if(window.innerWidth<=760){const el=document.querySelector('.sheet .mbok,.sheet .mberr');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
}
/* once a day, quietly: shows that are still airing pick up new episodes */
async function tmAutoRefresh(){
  if(!tmKey()||TMX.busy||TMX.auto)return;
  const due=S.screen.filter(s=>s.type==='show'&&s.tmdb&&!/^(Ended|Canceled)$/.test(s.status||'')&&Date.now()-(s.tmAt||0)>20*3600e3);
  if(!due.length)return;
  TMX.auto=true;let changed=false;
  try{for(const s of due){
    if(TMX.busy)break;
    try{tmMergeShow(s.tmdb,await tmFetchShow(s.tmdb));changed=true}
    catch(e){if(e.code!=='gone'&&e.code!=='http')break}
  }}finally{TMX.auto=false}
  if(changed){touch();render()}
}
async function tmSaveKey(k){
  k=(k||'').trim();if(!k)return;
  TMX.keyBusy=true;TMX.keyErr='';render();
  try{await tmGet('configuration',{},k);S.cfg={...(S.cfg||{}),tmdb:k};TMX.keyOpen=false;touch()}
  catch(e){TMX.keyErr=tmMessage(e)}
  TMX.keyBusy=false;render();
  if(tmKey()===k)tmAutoRefresh();
}

function tmSide(){

        ${UI.addType==='show'?'<input id="new-seasons" name="seasons" placeholder="Episodes per season, e.g. 9, 10" required>':''}

      <div class="tools"><button class="btn primary" ${TMX.keyBusy?'disabled':''}>${TMX.keyBusy?'Checking…':'Save key'}</button>${key?'<button type="button" class="btn" data-act="tmkeycancel">Cancel</button><button type="button" class="btn danger" data-act="tmkeydel">Remove key</button>':''}</div>

      return `<button type="button" class="mbhit tmhit" role="listitem" data-act="tmpick" data-i="${k}" ${TMX.busy?'disabled':''}>${x.poster?`<img src="${TM_IMG}w92${esc(x.poster)}" alt="" width="34" height="51" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'">`:'<span></span>'}<span><b>${esc(x.title)}${k===0?'<span class="tag">Best match</span>':''}</b><span class="mbsub">${esc([x.kind==='show'?'TV show':'Film',x.year,x.orig].filter(Boolean).join(' · '))}${have?' · <i>already here, tap to update</i>':''}</span></span></button>`}).join('')}

/* ---------- sync (playback-sync Worker) ----------
   S.mtime = when you last changed something. SY.last = the mtime the server
   last confirmed. If the server copy is newer we adopt it; if this device has
   changes the server never saw AND the server is newer, we ask. */
const SYNC_KEY=KEY+'_sync';
let SY=(()=>{try{return Object.assign({url:'',key:'',last:0,at:0},JSON.parse(localStorage.getItem(SYNC_KEY)||'{}'))}catch(e){return{url:'',key:'',last:0,at:0}}})();
const saveSync=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}};
const SYS={status:SY.url?'idle':'off',msg:'',remote:null};
let pushTimer=null,inflight=false;
const syncOn=()=>!!(SY.url&&SY.key);
function syncLabel(){
  if(!syncOn())return 'Sync off';
  if(SYS.status==='busy')return 'Syncing…';
  if(SYS.status==='error')return 'Sync problem';
  if(SYS.status==='conflict')return 'Needs a choice';
  if(SY.at)return 'Synced '+new Date(SY.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  return 'Sync ready';
}
function touch(){S.mtime=Date.now();save();if(syncOn()){clearTimeout(pushTimer);pushTimer=setTimeout(()=>push(false),1500)}}
/* Compressed sync: a Worker from 2026.11.03 on answers with x-pb-worker: 2 and
   takes the log gzipped (about 5x smaller, up to 20 MB after compression).
   Until the Worker is updated, plain JSON still works under its old 1 MB cap. */
const GZ_OK=typeof CompressionStream==='function'&&typeof DecompressionStream==='function';
const gzip=txt=>new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
const gunzip=buf=>new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
async function api(method,body,force){
  const q=[];if(force)q.push('force=1');if(GZ_OK)q.push('gz=1');
  const headers={'x-sync-key':SY.key};let payload;
  if(body){
    const txt=JSON.stringify(body);
    if(GZ_OK&&SY.gz){payload=await gzip(txt);headers['content-type']='application/gzip';q.push('mtime='+(body.mtime||0))}
    else{payload=txt;headers['content-type']='application/json'}
  }
  const u=SY.url.replace(/\/+$/,'')+'/'+(q.length?'?'+q.join('&'):'');
  const r=await fetch(u,{method,cache:'no-store',headers,body:payload});
  const wv=+(r.headers.get('x-pb-worker')||0),gz=wv>=2,sentGz=headers['content-type']==='application/gzip';if(gz!==!!SY.gz||(r.ok&&wv!==(SY.wv||0))){SY.gz=gz;if(r.ok)SY.wv=wv;saveSync()}
  if(r.status===413&&gz&&GZ_OK&&!sentGz)return api(method,body,force);   /* just learned the Worker takes gzip */
  let j=null;
  try{j=/gzip/.test(r.headers.get('content-type')||'')?JSON.parse(await gunzip(await r.arrayBuffer())):await r.json()}catch(e){}
  return{status:r.status,j};
}
function fail(status,j){
  SYS.status='error';
  SYS.msg=status===401?'The sync key does not match the SECRET on your Worker. Re-enter it and save.'
    :status===500&&j&&j.error?'The Worker is not set up yet: '+j.error+'.'
    :status===413?'Your log ('+mb(SV.bytes)+') is too big for this version of the sync Worker. Paste the new worker/playback-sync.js from GitHub into your Worker and deploy; the newer one takes the log compressed, so it fits logs many times larger.'
    :'Sync failed ('+status+'). Try again in a moment.';
}
function ok(){SYS.status='ok';SYS.msg='';SY.at=Date.now();saveSync()}
function adopt(j){S=j;S.flags=S.flags||{};S.marks=S.marks||{};S.music=S.music||[];S.screen=S.screen||[];seedAll();SY.last=S.mtime||0;save();ok();render()}
async function pull(){
  if(!READY||!syncOn()||inflight)return;inflight=true;SYS.status='busy';render();
  try{
    const{status,j}=await api('GET');
    if(status!==200){fail(status,j);return}
    if(j&&j.v===1&&Array.isArray(j.music)){
      const remote=j.mtime||0,local=S.mtime||0;
      if(!SY.last&&remote){adopt(j);return}            /* first sync on this device: take the saved log */
      if(remote>local){ if(local>SY.last){SYS.status='conflict';SYS.remote=j;return} adopt(j);return }
      if(local>remote){inflight=false;await push(false);return}
      SY.last=local;ok();
    }else{inflight=false;await push(false);return}       /* nothing saved yet: upload this device */
  }catch(e){SYS.status='error';SYS.msg='Could not reach your Worker. Check the URL and your connection.'}
  finally{inflight=false;render()}
}
async function push(force){
  if(!READY||!syncOn()||inflight)return;inflight=true;SYS.status='busy';render();
  try{
    const{status,j}=await api('PUT',S,force);
    if(status===200){SY.last=S.mtime||0;ok()}
    else if(status===409&&j){ if((S.mtime||0)>SY.last){SYS.status='conflict';SYS.remote=j} else adopt(j) }
    else fail(status,j);
  }catch(e){SYS.status='error';SYS.msg='Could not reach your Worker. Your changes are saved here and will upload next time.'}
  finally{inflight=false;render()}
}
