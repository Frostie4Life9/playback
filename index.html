function mbReportText(r){
  const names={'Studio album':['studio album','studio albums'],'EP':['EP','EPs'],'Single':['single','singles'],'Compilation':['compilation','compilations'],'Live':['live release','live releases'],'Other':['other release','other releases']};
  const parts=MB_KIND_ORDER.filter(k=>r.kinds[k]).map(k=>r.kinds[k]+' '+names[k][r.kinds[k]===1?0:1]);
  let s=r.name+': '+parts.join(', ')+' · '+r.songs+' songs'+(r.added===r.songs?'.':'. '+r.added+' new, '+(r.songs-r.added)+' were already in your log with their checkmarks and ratings.');
  const where='on '+SRC_NAME[r.src||'mb'];
  if(r.src==='sp'||r.src==='am')s=r.name+' (tracklists from '+SRC_NAME[r.src]+'): '+s.slice(r.name.length+2);
  if(r.kept)s+=' '+r.kept+' song'+(r.kept===1?'':'s')+' you had marked '+(r.kept===1?"isn't":"aren't")+' '+where+', so '+(r.kept===1?'it stays':'they stay')+' in “Kept from your earlier list”.';
  if(r.folded)s+=' '+r.folded+' song'+(r.folded===1?'':'s')+' you had marked '+(r.folded===1?'was':'were')+' listed under a slightly different title, so '+(r.folded===1?'it moved':'they moved')+' onto the matching song with '+(r.folded===1?'its':'their')+' checkmark and rating.';
  if(r.dropped)s+=' '+r.dropped+' unmarked song'+(r.dropped===1?' from the old list was':'s from the old list were')+' not '+(r.src==='sp'||r.src==='am'?where:'found')+' and removed.';

/* ---- the flow ---- */
async function mbSearch(q){
  if(MBX.busy||MBX.searching)return;
  Object.assign(MBX,{q,err:'',report:'',results:null,pick:null,searching:true,errWhere:'side'});render();
  try{
    const lq=q.replace(/([+\-&|!(){}\[\]^"~*?:\\\/])/g,'\\$1');
    const j=await mbGet('artist',{query:lq,limit:8});
    const list=j.artists||[];if(!list.length)throw MBError('nomatch');
    MBX.results=list.map(x=>({id:x.id,name:x.name,dis:x.disambiguation||'',country:x.country||(x.area&&x.area.name)||'',type:x.type||'',aka:mbAkas(x),begin:String((x['life-span']&&x['life-span'].begin)||'').slice(0,4)}));
  }catch(e){MBX.err=mbMessage(e,q)}
  MBX.searching=false;MBX.cancel=false;render();
}
async function mbImport(art,where,forceMb,forceSrc){

    akaRemember(art);existing=findExisting();

      phase='sp';

        groups=spBuild(c.albums,c.artist.id,MBX.versions);sp=c.artist;
        if(c.cached)hint+=' '+c.cached+' of '+c.albums.length+' tracklists came from copies saved on this device, so Spotify was only asked for '+(c.albums.length-c.cached)+'.';
        if(!groups.length){groups=null;sp=null;hint=' Spotify had no releases for this artist, so this came from MusicBrainz.'}}

      phase='am';
      try{const c=await amFetchCatalog(art,existing);
        MBX.step='Sorting out duplicates';mbProgress();
        groups=spBuild(c.albums,c.artist.id,MBX.versions);sp=c.artist;
        if(c.cached)hint+=' '+c.cached+' of '+c.albums.length+' tracklists came from copies saved on this device, so Apple Music was only asked for '+(c.albums.length-c.cached)+'.';
        if(!groups.length){groups=null;sp=null;hint=' Apple Music had no releases for this artist, so this came from MusicBrainz.'}}
      catch(e){if(e.code!=='nomatch')throw e;hint=' Could not find '+art.name+' on Apple Music, so this came from MusicBrainz.'}
      phase='mb';
      if(spCid()&&syncOn()&&(SY.wv||0)===3&&!(S.cfg&&S.cfg.importSrc))hint+=' Paste the updated sync Worker into Cloudflare to get tracklists straight from Spotify.';

}

function rtImport(){
  const rp={albums:0,filled:0,same:0,kept:[],missing:[],songs:[],made:0,loose:[]},done=[];
  for(const e of RTX.queue){
    const a=rtArtist(e.artists),g=a&&rtGroup(a,e.title);
    if(!g){rp.missing.push(e.artists[0]+' – '+e.title+(a?' (album not found under '+a.name+')':' (artist not here yet)'));continue}
    /* an album that came in from the CSV has no songs yet: give it RYM's tracklist,
       with the same song IDs a later MusicBrainz import uses, so nothing doubles */
    if(!g.items.length){
      const seen=new Map();a.groups.forEach(x=>x.items.forEach(i=>seen.set(mbItemKey(i),i.id)));
      for(const t of (e.tracklist.length?e.tracklist:e.tracks.map(x=>x.t))){const k=mbKeyOf(t);if(!k||seen.has(k))continue;
        const id=sid(a.id,'song',k);seen.set(k,id);g.items.push({id,title:t,k});rp.made++}
    }
    const byKey=new Map();g.items.forEach(i=>byKey.set(mbItemKey(i),i));
    const other=new Map();a.groups.forEach(x=>x.items.forEach(i=>{const k=mbItemKey(i);if(!other.has(k))other.set(k,i)}));
    for(const t of e.tracks){
      let i=byKey.get(mbKeyOf(t.t))||other.get(mbKeyOf(t.t));
      if(!i){   /* no exact match: the one song on this album (or else this artist) with the same title minus a bracketed subtitle */
        i=mbLooseFind(g.items,t.t)||mbLooseFind(artistItems(a),t.t);
        if(i)rp.loose.push(t.t+' → '+i.title)}
      if(!i){rp.songs.push(e.artists[0]+' – '+e.title+': '+t.t);continue}
      const cur=rating(i.id);rymNote(i.id,t.r);
      if(!cur){S.marks[i.id]={...(S.marks[i.id]||{}),r:t.r};rp.filled++}
      else if(cur===t.r)rp.same++;
      else rp.kept.push(i.title+': you have '+fmt(cur)+' here, RYM says '+fmt(t.r));
    }
    rp.albums++;done.push(e.url);
  }
  RTX.report=rp;
  if(done.length){RTX.queue=RTX.queue.filter(e=>!done.includes(e.url));window.postMessage({src:'playback',type:'done',urls:done},location.origin);touch()}
}
function rtSide(){
  const cnt=(n,w)=>n+' '+w+(n===1?'':'s');
  let h=`<div class="add"><span class="label">Song ratings from Rate Your Music</span>`;
  if(!RTX.bridge)h+=`<p class="note">RYM's file has no song ratings. On a computer, install the Playback RYM helper in Tampermonkey, then open your album pages on RYM; each one you open is saved for here. It never loads pages on its own.</p>
    <div><a class="btn" href="${HELPER_URL}" target="_blank" rel="noopener">Install the helper</a></div>`;
  else if(!RTX.queue.length)h+=`<p class="note">The helper is on. Open your album pages on RYM, 10 to 15 tabs at a time, and they will wait here.</p>`;
  else{const n=RTX.queue.reduce((x,e)=>x+e.tracks.length,0);
    h+=`<p class="note">${cnt(RTX.queue.length,'album')} waiting, ${cnt(n,'song rating')}.</p><div><button class="btn primary" data-act="rtimport">Import song ratings</button></div>`}
  const r=RTX.report;
  if(r){h+=`<div class="mbok rymrep" role="status"><span><b>${r.filled} song rating${r.filled===1?'':'s'}</b> filled in across ${cnt(r.albums,'album')}${r.same?', '+r.same+' already matched':''}.</span>`;
    if(r.made)h+=`<span>${cnt(r.made,'song')} added from RYM's tracklists to albums that had none yet.</span>`;
    if(r.kept.length)h+=`<details><summary>${cnt(r.kept.length,'rating')} differed, so I kept yours</summary><ul>${r.kept.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`;
    if(r.loose&&r.loose.length)h+=`<details><summary>${cnt(r.loose.length,'song')} matched on a slightly different title</summary><ul>${r.loose.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="note">RYM's title is on the left, the song here on the right.</p></details>`;
    if(r.songs.length)h+=`<details><summary>${cnt(r.songs.length,'song')} not found on the album here</summary><ul>${r.songs.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`;
    if(r.missing.length)h+=`<details><summary>${cnt(r.missing.length,'album')} still waiting</summary><ul>${r.missing.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="note">Import that artist (or the RYM file) and tap Import again.</p></details>`;
    h+='</div>'}
  return h+'</div>';
}

/* ---------- Export your ratings ----------
   Spreadsheets (CSV) of everything you rated, plus a "Not yet in Rate Your Music"
   list, since RYM has no import and those are the ones you type in by hand.
   S.rymSeen remembers the rating RYM had for each album and song the last time it
   came from RYM (the RYM file or the song-ratings helper). Anything rated here that
   was never there, or differs from it, is "not yet in RYM". S.flags.rymBase is set
   once you tell Playback the ratings it already has are on RYM. */
const EXP={open:false};
function rymNote(id,r){(S.rymSeen=S.rymSeen||{})[canonK(id)]=r}
const csvCell=(v,text)=>{let s=v==null?'':String(v);if(text&&/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const csvText=(head,rows)=>'﻿'+[head,...rows].map(r=>r.map(c=>csvCell(c,typeof c==='string')).join(',')).join('\r\n')+'\r\n';
function dlCSV(name,text){
  const day=new Date().toISOString().slice(0,10),url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name.replace('.csv','-'+day+'.csv');
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
const xYear=g=>/^\d{4}/.test(g.year||'')?String(g.year).slice(0,4):'';
const xArtists=()=>[...S.music].sort((x,y)=>x.name.localeCompare(y.name));
const xGroups=a=>[...a.groups].sort((x,y)=>(xYear(x)||'9999').localeCompare(xYear(y)||'9999')||x.title.localeCompare(y.title));
const r2=v=>Math.round(v*100)/100;
function csvAlbums(){
  const rows=[],once=new Set();
  for(const a of xArtists())for(const g of xGroups(a)){
    if(!RATEABLE.includes(g.kind)||once.has(canonK(g.id)))continue;once.add(canonK(g.id));
    const its=stdItems(g),r=rating(g.id),rs=its.map(i=>rating(i.id)).filter(Boolean);
    if(r||rs.length)rows.push([a.name,g.title,xYear(g),g.kind,r||'',rs.length?r2(rs.reduce((x,y)=>x+y,0)/rs.length):'',rs.length,its.length]);
    if(hasDx(g)){const dr=rating(dxId(g)),drs=g.items.map(i=>rating(i.id)).filter(Boolean);   /* the deluxe edition, rated on its own */
      if(dr)rows.push([a.name,dxName(g),xYear(g),g.kind,dr,drs.length?r2(drs.reduce((x,y)=>x+y,0)/drs.length):'',drs.length,g.items.length])}
  }
  return csvText(['Artist','Release','Year','Type','Album rating','Song average','Songs rated','Songs in list'],rows);
}
function csvSongs(){
  const rows=[],seen=new Set();
  for(const a of xArtists())for(const g of xGroups(a))for(const i of g.items){
    const r=rating(i.id);if(!r||seen.has(canonK(i.id)))continue;seen.add(canonK(i.id));
    rows.push([a.name,g.title,xYear(g),g.kind,i.title,r]);
  }
  return csvText(['Artist','Release','Year','Type','Song','Rating'],rows);
}
function csvScreen(){
  const rows=[];
  for(const s of [...S.screen].sort((x,y)=>x.title.localeCompare(y.title))){
    const y=/^\d{4}/.test(s.year||'')?String(s.year).slice(0,4):'';
    if(s.type==='film'){if(rating(s.id))rows.push(['Film',s.title,y,'','',rating(s.id)]);continue}
    if(rating(s.id))rows.push(['Show',s.title,y,'','',rating(s.id)]);
    for(const se of s.seasons){
      const sr=rating(sid(s.id,'s',se.n));if(sr)rows.push(['Season',s.title,y,se.n,'',sr]);
      for(let e=1;e<=se.eps;e++){const er=rating(sid(s.id,'s',se.n,'e',e));if(er)rows.push(['Episode',s.title,y,se.n,e,er])}
    }
  }
  return csvText(['Type','Title','Year','Season','Episode','Rating'],rows);
}
function rymTodo(){
  const seen=S.rymSeen||{},out=[],done=new Set();
  const add=(a,g,i)=>{const id=canonK(i?i.id:g.id),r=rating(id);if(!r||seen[id]===r||done.has(id))return;done.add(id);
    out.push({a:a.name,rel:g.title,song:i?i.title:'',r,was:seen[id]||0})};
  for(const a of xArtists())for(const g of xGroups(a)){if(RATEABLE.includes(g.kind)){add(a,g,null);if(hasDx(g))add(a,{id:dxId(g),title:dxName(g)},null)}g.items.forEach(i=>add(a,g,i))}
  return out;
}
function rymMark(){
  S.rymSeen=S.rymSeen||{};
  for(const a of S.music)for(const g of a.groups){
    if(RATEABLE.includes(g.kind)&&rating(g.id))S.rymSeen[canonK(g.id)]=rating(g.id);
    if(RATEABLE.includes(g.kind)&&hasDx(g)&&rating(dxId(g)))S.rymSeen[canonK(dxId(g))]=rating(dxId(g));
    for(const i of g.items)if(rating(i.id))S.rymSeen[canonK(i.id)]=rating(i.id);
  }
  S.flags=S.flags||{};S.flags.rymBase=true;
}
const csvTodo=()=>csvText(['Artist','Release','Song','What','Your rating','On RYM now','Status'],
  rymTodo().map(x=>[x.a,x.rel,x.song,x.song?'Song rating':'Album rating',x.r,x.was||'',x.was?'Changed here':'New here']));
function expSide(){
  const head=`<summary class="label" style="cursor:pointer">Export ratings</summary>`;
  if(!EXP.open)return `<details id="export">${head}</details>`;
  const cnt=(n,w)=>n+' '+w+(n===1?'':'s');
  let h=`<details id="export" open>${head}
    <p class="note">Download your ratings as spreadsheets (CSV). They double as a backup, since Rate Your Music has no import.</p>
    <div class="tools"><button type="button" class="btn" data-act="expalbums">Albums</button><button type="button" class="btn" data-act="expsongs">Songs</button><button type="button" class="btn" data-act="expscreen">Shows &amp; films</button></div>
    <div class="add"><span class="label">Not yet in Rate Your Music</span>`;
  if(!(S.flags&&S.flags.rymBase)){
    h+=`<p class="note">Playback does not know yet which of your ratings are already on RYM. If they all are, tap below and it will list what you add or change from now on. Importing your RYM file or song ratings again also updates what it knows.</p>
      <div><button type="button" class="btn primary" data-act="rymbase">Everything is on RYM now</button></div>`;
  }else{
    const t=rymTodo();
    if(!t.length)h+=`<p class="note">Nothing waiting. Every rating here matches RYM.</p>`;
    else{
      const nw=t.filter(x=>!x.was).length,ch=t.length-nw;
      h+=`<div class="rymrep"><span><b>${cnt(t.length,'rating')}</b> to enter on RYM: ${nw} new${ch?', '+ch+' changed':''}.</span>
        <details><summary>Show them</summary><ul>${t.slice(0,150).map(x=>'<li>'+esc(x.a+' – '+x.rel+(x.song?': '+x.song:'')+' – '+fmt(x.r)+(x.was?' (RYM has '+fmt(x.was)+')':''))+'</li>').join('')}</ul>${t.length>150?'<p class="note">Showing the first 150. The CSV has all of them.</p>':''}</details></div>
        <div class="tools"><button type="button" class="btn" data-act="exptodo">Download this list</button><button type="button" class="btn" data-act="rymbase">I entered these on RYM</button></div>`;
    }
  }
  return h+'</div></details>';
}
document.addEventListener('toggle',ev=>{const t=ev.target;if(t&&t.id==='export'&&t.open!==EXP.open){EXP.open=t.open;render()}},true);

/* ---------- Your numbers ----------
   Read-only summary of your ratings, worked out from the log each time the panel
   is open (nothing is stored). Album numbers use each release's standard tracklist;
   a deluxe edition's own rating counts as its own album, like the export does. */
const STAT={open:false};
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const median=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function statData(){
  const alb=[],songs=[],seen=new Set();let heard=0,total=0;
  for(const a of S.music){
    for(const g of a.groups){
      if(RATEABLE.includes(g.kind)){
        const rs=stdItems(g).map(i=>rating(i.id)).filter(Boolean),r=rating(g.id);
        if(r)alb.push({a,g,title:g.title,r,n:rs.length,avg:rs.length?mean(rs):0});
        if(hasDx(g)){const dr=rating(dxId(g)),drs=g.items.map(i=>rating(i.id)).filter(Boolean);
          if(dr)alb.push({a,g,title:dxName(g),r:dr,n:drs.length,avg:drs.length?mean(drs):0,dx:true})}
      }
      for(const i of g.items){if(seen.has(i.id))continue;seen.add(i.id);total++;if(isDone(i.id))heard++;const r=rating(i.id);if(r)songs.push(r)}
    }
  }
  const scr=[];let eps=0;
  for(const s of S.screen){
    const r=rating(s.id);if(r)scr.push({s,r});
    if(s.type!=='film')for(const se of s.seasons)for(let e=1;e<=se.eps;e++)if(rating(sid(s.id,'s',se.n,'e',e)))eps++;
  }
  return{alb,songs,heard,total,scr,eps};
}
function histHtml(vals){
  const bins=Array(20).fill(0);vals.forEach(v=>{const k=Math.min(19,Math.max(0,Math.round(v*2)-1));bins[k]++});
  const mx=Math.max(1,...bins);
  return `<div class="hist" role="img" aria-label="Ratings from 0.5 to 10: ${bins.map((c,k)=>c?c+' at '+fmt((k+1)/2):'').filter(Boolean).join(', ')}">${bins.map((c,k)=>`<i class="${c?'':'z'}" ${c?`style="height:${Math.max(6,Math.round(c/mx*100))}%"`:''} title="${fmt((k+1)/2)}: ${c}"></i>`).join('')}</div>
    <div class="hax"><span>1</span><span>5</span><span>10</span></div>`;
}
function statRows(list){
  return `<ol>${list.map(x=>`<li><button class="srow" data-act="statgo" data-tab="${x.tab||'music'}" data-id="${x.id}"><span class="n">${esc(x.t)}${x.sub?' <small>'+esc(x.sub)+'</small>':''}</span><span class="v">${esc(x.v)}</span></button></li>`).join('')}</ol>`;
}
function statSide(){
  const head=`<summary class="label" style="cursor:pointer">Your numbers</summary>`;
  if(!STAT.open)return `<details id="stats">${head}</details>`;
  const D=statData(),f1=v=>v.toFixed(1);
  const albR=D.alb.map(x=>x.r),sg=D.songs;
  let h=`<details id="stats" open>${head}<div class="stat">`;
  if(!albR.length&&!sg.length&&!D.scr.length&&!D.eps)return h+`<p class="nb">Rate some albums, songs or shows and this fills in.</p></div></details>`;
  h+=`<div class="kpis">
    <div class="kpi"><b>${albR.length}</b><span>Albums rated</span></div>
    <div class="kpi"><b>${albR.length?f1(mean(albR)):'–'}</b><span>Album average</span></div>
    <div class="kpi"><b>${sg.length}</b><span>Songs rated</span></div>
    <div class="kpi"><b>${sg.length?f1(mean(sg)):'–'}</b><span>Song average</span></div>
    <div class="kpi"><b>${D.total?Math.round(D.heard/D.total*100)+'%':'–'}</b><span>${D.heard.toLocaleString()} of ${D.total.toLocaleString()} songs heard</span></div>
  </div>`;
  if(albR.length||sg.length){
    h+=`<div class="cols">`;
    if(albR.length)h+=`<div><h4>How you rate albums <span class="avg">median ${fmt(median(albR))}</span></h4>${histHtml(albR)}</div>`;
    if(sg.length)h+=`<div><h4>How you rate songs <span class="avg">median ${fmt(median(sg))} · ${sg.filter(v=>v>=9).length} at 9 or higher</span></h4>${histHtml(sg)}</div>`;
    h+=`</div>`;
  }
  if(D.alb.length){
    const top=[...D.alb].sort((x,y)=>y.r-x.r||y.avg-x.avg||x.title.localeCompare(y.title)).slice(0,10)
      .map(x=>({id:x.a.id,t:x.title,sub:x.a.name,v:fmt(x.r)}));
    const gap=D.alb.filter(x=>x.n>=3).map(x=>({...x,d:x.r-x.avg}));
    const up=gap.filter(x=>x.d>=.5).sort((x,y)=>y.d-x.d).slice(0,3).map(x=>({id:x.a.id,t:x.title,sub:x.a.name,v:'+'+f1(x.d)}));
    const dn=gap.filter(x=>x.d<=-.5).sort((x,y)=>x.d-y.d).slice(0,3).map(x=>({id:x.a.id,t:x.title,sub:x.a.name,v:'−'+f1(Math.abs(x.d))}));
    const byA={};D.alb.filter(x=>!x.dx).forEach(x=>{(byA[x.a.id]=byA[x.a.id]||{a:x.a,rs:[]}).rs.push(x.r)});
    const arts=Object.values(byA).filter(o=>o.rs.length>=2).map(o=>({id:o.a.id,t:o.a.name,sub:o.rs.length+' albums',v:f1(mean(o.rs)),m:mean(o.rs)}))
      .sort((x,y)=>y.m-x.m||y.sub.localeCompare(x.sub)).slice(0,5);
    h+=`<div class="cols"><div><h4>Top albums</h4>${statRows(top)}</div>`;
    if(arts.length)h+=`<div><h4>Artists you rate highest <span class="avg">2+ albums rated</span></h4>${statRows(arts)}</div>`;
    h+=`</div>`;
    if(up.length||dn.length){
      h+=`<div class="cols">`;
      if(up.length)h+=`<div><h4>Better than their songs <span class="avg">album rating vs song average</span></h4>${statRows(up)}</div>`;
      if(dn.length)h+=`<div><h4>Worse than their songs <span class="avg">album rating vs song average</span></h4>${statRows(dn)}</div>`;
      h+=`</div><p class="nb">Only albums with at least 3 rated songs and a gap of half a point or more.</p>`;
    }
  }
  if(D.scr.length||D.eps){
    const sr=D.scr.map(x=>x.r),topS=[...D.scr].sort((x,y)=>y.r-x.r||x.s.title.localeCompare(y.s.title)).slice(0,5)
      .map(x=>({tab:'screen',id:x.s.id,t:x.s.title,sub:x.s.type==='film'?'Film':'Show',v:fmt(x.r)}));
    h+=`<div><h4>Screen <span class="avg">${D.scr.length} show${D.scr.length===1?'':'s'} and films rated${sr.length?' · average '+f1(mean(sr)):''} · ${D.eps} episode${D.eps===1?'':'s'} rated</span></h4>${topS.length?statRows(topS):''}</div>`;
  }
  return h+'</div></details>';
}
document.addEventListener('toggle',ev=>{const t=ev.target;if(t&&t.id==='stats'&&t.open!==STAT.open){STAT.open=t.open;render()}},true);

/* ---------- Spotify: songs you play get checked off ----------
   Your own Spotify app (Client ID in S.cfg.spotify, which syncs; it is not a secret)
   signs in with PKCE, so there is no client secret anywhere. Scope:
   user-read-recently-played only. Spotify keeps just your last 50 plays, so:
   - with sync Worker v3 the sign-in is handed to the Worker, which checks every hour
     on its own (Cron Trigger) and keeps the plays; the app reads them from there.
   - otherwise this device keeps the sign-in (localStorage, never synced) and checks
     when the app opens.
   S.sp.after (synced) is the newest play already applied, so a play is used once:
   un-checking a song by hand sticks, and two devices never double up.
   A play checks off the matching song for that artist (same title key as the
   MusicBrainz import, so remasters and edits count). Live, demo, acoustic and other
   versions only check off that version if it is in your list. Ratings are never
   touched. Plays that match nothing are listed so you can see what to add. */
const SP_AUTH='https://accounts.spotify.com/authorize',SP_TOKEN='https://accounts.spotify.com/api/token',SP_API='https://api.spotify.com/v1/';
const SP_REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');
const SPL_KEY=KEY+'_spotify';
let SPL=(()=>{try{return JSON.parse(localStorage.getItem(SPL_KEY))||{}}catch(e){return{}}})();
const splSave=()=>{try{localStorage.setItem(SPL_KEY,JSON.stringify(SPL))}catch(e){}};
const SPX={busy:false,err:'',wk:null,last:0,cidOpen:false,checked:0,copied:false,started:false};
const spCid=()=>(S.cfg&&S.cfg.spotify)||'';
const spViaWorker=()=>syncOn()&&(SY.wv||0)>=3;
/* the sign-in coming back from Spotify: read it and clean the address bar right away */
const SP_CB=(()=>{try{const q=new URLSearchParams(location.search);if(!q.has('state')||!(q.has('code')||q.has('error')))return null;
  const o={code:q.get('code'),error:q.get('error'),state:q.get('state')};history.replaceState(null,'',SP_REDIRECT+location.hash);return o}catch(e){return null}})();
function SPError(code,status){const e=new Error(code);e.code=code;e.status=status;return e}
function spWaitText(sec){const m=Math.ceil((sec||0)/60);
  return !sec?'':sec<=90?' and to wait about a minute':m>=120?' and to wait about '+Math.round(m/60)+' hours':m>=60?' and to wait about an hour':' and to wait about '+Math.max(m,2)+' minutes'}
function spMessage(e){
  switch(e.code){
    case 'network':return 'Could not reach Spotify. It will try again next time you open the app.';
    case 'reconnect':return 'Spotify signed Playback out (that happens if you remove access or change your Spotify password). Tap Connect Spotify to sign in again.';
    case 'badcid':return 'Spotify did not recognize that Client ID. Copy it again from your app’s Settings on developer.spotify.com.';
    case 'forbidden':return 'Spotify refused (403). On developer.spotify.com, open your app › User Management and add the email of your Spotify account, and check that Premium is active.';
    case 'busy':return 'Spotify is asking for a short break. It will try again in a few minutes.';
    case 'limited':return 'Spotify has limited how often Playback can look things up'+spWaitText(e.wait)+'. Nothing is wrong on your end.';
    case 'quota':return 'Spotify says Playback has used up its quota for now'+spWaitText(e.wait)+'. Spotify counts every app on your developer account together, so rebuilding a lot of artists uses it up.';

  const when=p=>new Date(p).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  const dl=d=>{const r=SPU.d[d];const kinds=Object.keys(names).filter(k=>r[k]).map(k=>r[k]+' '+names[k]);return '<li>'+esc(new Date(d+'T12:00').toLocaleDateString([],{month:'short',day:'numeric'}))+': '+(r.total||0)+' sent to Spotify'+(kinds.length?' ('+esc(kinds.join(', '))+')':'')+(r.cached?', '+r.cached+' served free from the Worker':'')+(r.quota?', quota hit '+r.quota+'\u00d7':'')+(r.rl?', slow-down '+r.rl+'\u00d7':'')+'</li>'};
  return `<details class="spmiss"><summary class="note">Spotify calls from this device: ${today.total||0} today, ${h24} in the last 24 hours</summary>
    <p class="note">${parts.length?'Today: '+esc(parts.join(', '))+'. ':''}${today.cached?today.cached+' more were answered free from your Worker\u2019s saved copy. ':''}Spotify does not publish its limit, so this counts what Playback sends. It cannot see your other devices, or the Worker\u2019s hourly check (about 24 a day).</p>
    ${SPU.q.length?`<p class="note"><b>When Spotify said the quota was used up</b> (calls from this device in the hour and in the 24 hours before):</p><ul>${SPU.q.map(e=>'<li>'+esc(when(e.at))+': '+e.h1+' in the last hour, '+e.h24+' in the last 24 hours</li>').join('')}</ul>`:''}
    <ul>${days.slice(0,7).map(dl).join('')}</ul>
    <div><button type="button" class="link" data-act="spuclear">Reset these counts</button></div></details>`;
}

/* ---------- TMDB for the Screen tab ----------
   Search shows and films on The Movie Database and bring in the poster, year,
   seasons and episode counts. The TMDB key lives in the log (S.cfg.tmdb), so it
   reaches the other devices through the playback-sync Worker and never sits in
   this public repo.
   Episode IDs come from show ID + season + episode number, exactly like shows
   added by hand, so importing over a hand-added show keeps every checkmark.
   Only aired episodes are counted (an airing season would otherwise sit below
   100% for episodes that don't exist yet). "Check for new episodes", plus a
   quiet once-a-day check of shows still airing, adds them as they come out.
   Specials (season 0) stay out. An episode that is checked or rated is never
   dropped, even if TMDB's count goes down. */
const TM_API='https://api.themoviedb.org/3/',TM_IMG='https://image.tmdb.org/t/p/';
const TMX={q:'',results:null,searching:false,busy:false,err:'',errWhere:'side',report:'',sid:null,keyOpen:false,keyErr:'',keyBusy:false,auto:false};
const tmKey=()=>(S.cfg&&S.cfg.tmdb)||'';
function TMError(code,status){const e=new Error(code);e.code=code;e.status=status;return e}
async function tmGet(path,params,key){
  key=key||tmKey();if(!key)throw TMError('nokey');
  const u=new URL(TM_API+path);Object.entries(params||{}).forEach(([k,v])=>u.searchParams.set(k,v));
  const h={accept:'application/json'};
  if(/^eyJ/.test(key))h.authorization='Bearer '+key;else u.searchParams.set('api_key',key);   /* read access token or v3 key */
  let r;try{r=await fetch(u,{headers:h})}catch(e){throw TMError(navigator.onLine===false?'offline':'network')}
  if(r.status===401)throw TMError('badkey',401);
  if(r.status===404)throw TMError('gone',404);
  if(r.status===429)throw TMError('busy',429);
  if(!r.ok)throw TMError('http',r.status);
  return r.json();
}
function tmMessage(e,q){
  switch(e.code){
    case 'nokey':return 'Add your TMDB key first.';
    case 'badkey':return 'TMDB did not accept that key. Copy it again from themoviedb.org under Settings › API.';
    case 'offline':return 'You look offline. Try again once you are connected.';
    case 'network':return 'Could not reach TMDB. Check your connection and try again.';
    case 'busy':return 'TMDB is asking for a short break. Try again in a few seconds.';
    case 'nomatch':return 'Nothing on TMDB matches “'+q+'”. Try the original title or fewer words.';
    case 'gone':return 'TMDB no longer has that title.';
    default:return 'TMDB had a problem ('+(e.status||e.message)+'). Try again in a moment.';
  }
}
const tmYear=d=>String(d||'').slice(0,4);
const tmDay=d=>{const t=new Date(d+'T12:00:00');return isNaN(t)?'':t.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})};

/* the entry a TMDB title belongs to: already linked, or added by hand under the same title */
function tmExisting(kind,tid,title,year){
  return S.screen.find(x=>x.type===kind&&x.tmdb===tid)
    ||S.screen.find(x=>x.type===kind&&!x.tmdb&&x.id===(kind==='show'?sid('show',title):sid('film',title,year||'')))
    ||S.screen.find(x=>x.type===kind&&!x.tmdb&&nrm(x.title)===nrm(title)&&(!x.year||!year||x.year===year));
}

async function tmFetchShow(tid){
  const j=await tmGet('tv/'+tid,{language:'en-US',append_to_response:'watch/providers'});
  const last=j.last_episode_to_air,nxt=j.next_episode_to_air,seasons=[];
  for(const se of (j.seasons||[])){
    const n=se.season_number;if(!(n>0))continue;
    const total=se.episode_count||0;
    const aired=!last?0:n<last.season_number?total:n===last.season_number?last.episode_number:0;
    seasons.push({n,aired,total:Math.max(total,aired)});
  }
  return{title:j.name||j.original_name||'Untitled',year:tmYear(j.first_air_date),poster:j.poster_path||'',status:j.status||'',seasons,...tmInfo(j),watch:tmWatch(j['watch/providers']),
    next:nxt&&nxt.air_date?{n:nxt.season_number,e:nxt.episode_number,d:nxt.air_date}:null};
}
async function tmFetchFilm(tid){
  const j=await tmGet('movie/'+tid,{language:'en-US',append_to_response:'watch/providers'});
  return{title:j.title||j.original_title||'Untitled',year:tmYear(j.release_date),poster:j.poster_path||'',runtime:j.runtime||0,...tmInfo(j),watch:tmWatch(j['watch/providers'])};
}
/* Where to watch. TMDB passes on JustWatch's list per country: stream (subscription),
   free or with ads, rent, buy. It is a handful of names, so it lives on the entry and
   syncs. Shows still airing refresh it with their daily check; anything else picks it
   up again when you open it and it is over a week old. */
const tmRegion=()=>(S.cfg&&S.cfg.region)||'US';
function tmWatch(wp){
  const w=wp&&wp.results&&wp.results[tmRegion()]||{},seen=new Set();
  const pick=(...lists)=>lists.flatMap(a=>a||[]).sort((x,y)=>(x.display_priority??99)-(y.display_priority??99))
    .filter(p=>p&&p.provider_name&&!seen.has(p.provider_name)&&seen.add(p.provider_name)).slice(0,8).map(p=>[p.provider_name,p.logo_path||'']);
  const s=pick(w.flatrate),f=pick(w.free,w.ads);
  seen.clear();const r=pick(w.rent);seen.clear();const b=pick(w.buy);
  return{at:Date.now(),c:tmRegion(),link:w.link||'',s,f,r,b};
}
const TMW={busy:null,failed:{}};
const tmwKey=x=>x.type+':'+x.tmdb;
function tmNeedsWatch(x){
  if(!x.tmdb||!tmKey()||TMW.busy||TMW.failed[tmwKey(x)])return false;
  return !x.watch||x.watch.c!==tmRegion()||Date.now()-(x.watch.at||0)>7*864e5;
}
async function tmLoadWatch(x){
  if(!tmNeedsWatch(x))return;
  TMW.busy=x.id;render();
  try{x.watch=tmWatch(await tmGet((x.type==='film'?'movie/':'tv/')+x.tmdb+'/watch/providers'));touch()}
  catch(e){TMW.failed[tmwKey(x)]=true}
  finally{TMW.busy=null;render()}
}
function watchBlock(x){
  if(!x.tmdb)return '';
  const w=x.watch;
  if(!w)return TMW.busy===x.id?'<p class="note">Checking where it\u2019s streaming\u2026</p>':'';
  const chips=a=>a.map(([n,l])=>`<span class="prov${l?'':' noimg'}">${l?`<img src="${TM_IMG}w45${esc(l)}" alt="" width="20" height="20" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('noimg');this.remove()">`:''}${esc(n)}</span>`).join('');
  const row=(k,a)=>`<div class="provrow"><span class="pk">${k}</span>${chips(a)}</div>`;
  const free=[w.s.length?row('Stream',w.s):'',w.f.length?row('Free',w.f):''].join('');
  const pay=[w.r.length?row('Rent',w.r):'',w.b.length?row('Buy',w.b):''].join('');
  let h=`<div class="watch"><span class="label">Where to watch \u00b7 ${esc(w.c||'US')}</span>`;
  if(!free&&!pay)h+=`<p class="note">Not streaming, for rent or for sale anywhere in the ${esc(w.c||'US')} right now.</p>`;
  else if(free)h+=free+(pay?`<details><summary>Rent or buy</summary>${pay}</details>`:'');
  else h+=`<p class="note">Not on any streaming service right now. You can rent or buy it:</p>`+pay;
  h+=`<p class="note tmcredit">Streaming data from JustWatch, via TMDB \u00b7 checked ${esc(new Date(w.at).toLocaleDateString([],{month:'short',day:'numeric'}))}${w.link?` \u00b7 <a href="${esc(w.link)}" target="_blank" rel="noopener">See the links</a>`:''}</p></div>`;
  return h;
}
/* the short facts about a title: small, so they live on the entry and sync */
function tmInfo(j){
  return{overview:j.overview||'',genres:(j.genres||[]).map(g=>g.name).slice(0,4),
    network:((j.networks||[])[0]||{}).name||'',creators:(j.created_by||[]).map(c=>c.name).slice(0,3)};
}

/* Episode names, descriptions, air dates and runtimes. A long show is a lot of text,
   so this does NOT go in the synced log: each device keeps its own copy in
   localStorage and fetches it from TMDB (up to 20 seasons per request) the first
   time a show is opened, and again after the show is checked for new episodes. */
const TMC_KEY=KEY+'_eps';
let TMC=(()=>{try{return JSON.parse(localStorage.getItem(TMC_KEY))||{}}catch(e){return{}}})();
const TME={busy:null,failed:{}};
function tmcSave(){try{localStorage.setItem(TMC_KEY,JSON.stringify(TMC))}catch(e){TMC={};try{localStorage.removeItem(TMC_KEY)}catch(_){}}}
function epInfo(s,n,e){const c=s.tmdb&&TMC[s.tmdb];const l=c&&c.s[n];return l&&l[e-1]||null}
function tmNeedsEps(s){
  if(!s.tmdb||!tmKey()||TME.busy||TME.failed[s.tmdb])return false;
  const c=TMC[s.tmdb];return !c||c.at<(s.tmAt||0)||(!s.hasInfo);
}
async function tmLoadEps(s){
  if(!tmNeedsEps(s))return;
  TME.busy=s.tmdb;
  try{
    const nums=s.seasons.map(x=>x.n),out={};let info=null;
    for(let i=0;i<Math.max(nums.length,1);i+=20){
      const chunk=nums.slice(i,i+20);
      const j=await tmGet('tv/'+s.tmdb,{language:'en-US',...(chunk.length?{append_to_response:chunk.map(n=>'season/'+n).join(',')}:{})});
      if(!info)info=tmInfo(j);
      for(const n of chunk){const se=j['season/'+n];if(!se)continue;
        out[n]=(se.episodes||[]).sort((a,b)=>a.episode_number-b.episode_number)
          .map(e=>({t:e.name||'',o:e.overview||'',d:e.air_date||'',rt:e.runtime||0}))}
    }
    TMC[s.tmdb]={at:Date.now(),s:out};tmcSave();
    if(info){Object.assign(s,info,{hasInfo:true});touch()}
  }catch(e){TME.failed[s.tmdb]=true}
  finally{TME.busy=null;render()}
}
const tmMarked=id=>{const m=S.marks[id];return !!(m&&(m.done||m.r))};
function tmMergeShow(tid,d){
  let s=tmExisting('show',tid,d.title,d.year),isNew=false;
  if(!s){let id=sid('show',d.title);if(S.screen.some(x=>x.id===id))id=sid('show',d.title,'tmdb',tid);
    s={id,type:'show',title:d.title,year:d.year,seasons:[]};S.screen.push(s);isNew=true}
  const before=epIds(s).length,old=new Map(s.seasons.map(x=>[x.n,x])),out=[];
  const lastMarked=(n,upto)=>{for(let e=upto;e>0;e--)if(tmMarked(sid(s.id,'s',n,'e',e)))return e;return 0};
  for(const t of d.seasons){const cur=old.get(t.n);old.delete(t.n);
    out.push({n:t.n,eps:Math.max(t.aired,cur?lastMarked(t.n,cur.eps):0),total:t.total})}
  for(const cur of old.values()){const k=lastMarked(cur.n,cur.eps);if(k)out.push({n:cur.n,eps:k})}   /* not on TMDB: kept only if you checked something */
  s.seasons=out.sort((a,b)=>a.n-b.n);
  Object.assign(s,{title:d.title,year:d.year||s.year||'',tmdb:tid,poster:d.poster,status:d.status,next:d.next,tmAt:Date.now(),overview:d.overview,genres:d.genres,network:d.network,creators:d.creators,hasInfo:true,...(d.watch?{watch:d.watch}:{})});
  delete TME.failed[tid];
  delete s.example;
  return{sid:s.id,isNew,added:epIds(s).length-before};
}
function tmMergeFilm(tid,d){
  let f=tmExisting('film',tid,d.title,d.year),isNew=false;
  if(!f){let id=sid('film',d.title,d.year||'');if(S.screen.some(x=>x.id===id))id=sid('film',d.title,'tmdb',tid);
    f={id,type:'film'};S.screen.push(f);isNew=true}
  Object.assign(f,{title:d.title,year:d.year||f.year||'',tmdb:tid,poster:d.poster,runtime:d.runtime,tmAt:Date.now(),overview:d.overview,genres:d.genres,...(d.watch?{watch:d.watch}:{})});
  delete f.example;
  return{sid:f.id,isNew};
}
function tmShowReport(r,d){
  const s=S.screen.find(x=>x.id===r.sid),n=epIds(s).length,seas=s.seasons.filter(x=>x.eps).length;
  let t=r.isNew?`Added ${d.title}: ${seas} season${seas===1?'':'s'}, ${n} episode${n===1?'':'s'} out so far.`
    :r.added>0?`${r.added} new episode${r.added===1?'':'s'} added to ${d.title}. Your checkmarks stayed put.`
    :`${d.title} is up to date. Your checkmarks stayed put.`;
  if(d.next)t+=` Next up: ${sxe(d.next.n,d.next.e)} on ${tmDay(d.next.d)}.`;
  return t;
}

async function tmSearch(q){
  if(TMX.searching||TMX.busy)return;
  Object.assign(TMX,{q,err:'',report:'',results:null,searching:true,errWhere:'side'});render();
  try{
    const j=await tmGet('search/multi',{query:q,include_adult:'false',language:'en-US',page:'1'});
    const list=(j.results||[]).filter(x=>x.media_type==='tv'||x.media_type==='movie').slice(0,8);
    if(!list.length)throw TMError('nomatch');
    TMX.results=list.map(x=>{const t=x.name||x.title||'Untitled',o=x.original_name||x.original_title||'';
      return{id:x.id,kind:x.media_type==='tv'?'show':'film',title:t,year:tmYear(x.first_air_date||x.release_date),poster:x.poster_path||'',orig:o&&o!==t?o:''}});
  }catch(e){TMX.err=tmMessage(e,q)}
  TMX.searching=false;render();
}
async function tmImport(pick,where){
  if(TMX.busy)return;
  Object.assign(TMX,{busy:true,err:'',report:'',errWhere:where,sid:pick.sid||null});render();
  try{
    let r,txt;
    if(pick.kind==='show'){const d=await tmFetchShow(pick.id);r=tmMergeShow(pick.id,d);txt=tmShowReport(r,d)}
    else{const d=await tmFetchFilm(pick.id);r=tmMergeFilm(pick.id,d);txt=`${r.isNew?'Added':'Updated'} ${d.title}${d.year?' ('+d.year+')':''}.`}
    touch();
    UI.tab='screen';UI.sel.screen=r.sid;try{localStorage.setItem(KEY+'_tab','screen')}catch(e){}
    Object.assign(TMX,{report:txt,results:null,q:'',errWhere:'sheet',sid:r.sid});
  }catch(e){TMX.err=tmMessage(e,pick.title)}
  finally{TMX.busy=false;render()}
  if(window.innerWidth<=760){const el=document.querySelector('.sheet .mbok,.sheet .mberr');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
}
/* once a day, quietly: shows that are still airing pick up new episodes */
async function tmAutoRefresh(){
  if(!tmKey()||TMX.busy||TMX.auto)return;
  const due=S.screen.filter(s=>s.type==='show'&&s.tmdb&&!/^(Ended|Canceled)$/.test(s.status||'')&&Date.now()-(s.tmAt||0)>20*3600e3);
  if(!due.length)return;
  TMX.auto=true;let changed=false;
  try{for(const s of due){
    if(TMX.busy)break;
    try{tmMergeShow(s.tmdb,await tmFetchShow(s.tmdb));changed=true}
    catch(e){if(e.code!=='gone'&&e.code!=='http')break}
  }}finally{TMX.auto=false}
  if(changed){touch();render()}
}
async function tmSaveKey(k){
  k=(k||'').trim();if(!k)return;
  TMX.keyBusy=true;TMX.keyErr='';render();
  try{await tmGet('configuration',{},k);S.cfg={...(S.cfg||{}),tmdb:k};TMX.keyOpen=false;touch()}
  catch(e){TMX.keyErr=tmMessage(e)}
  TMX.keyBusy=false;render();
  if(tmKey()===k)tmAutoRefresh();
}

      return `<button type="button" class="mbhit tmhit" role="listitem" data-act="tmpick" data-i="${k}" ${TMX.busy?'disabled':''}>${x.poster?`<img src="${TM_IMG}w92${esc(x.poster)}" alt="" width="34" height="51" loading="lazy" decoding="async" onerror="this.style.visibility='hidden'">`:'<span></span>'}<span><b>${esc(x.title)}${k===0?'<span class="tag">Best match</span>':''}</b><span class="mbsub">${esc([x.kind==='show'?'TV show':'Film',x.year,x.orig].filter(Boolean).join(' · '))}${have?' · <i>already here, tap to update</i>':''}</span></span></button>`}).join('')}

/* where a show or film came from, and the button to refresh it */
function tmBar(x){
  let h='';

  if(TMX.sid===x.id&&TMX.errWhere==='sheet'){
    if(TMX.err)h+=`<p class="mberr" role="alert">${esc(TMX.err)}</p>`;
    if(TMX.report)h+=`<p class="mbok" role="status">${esc(TMX.report)}<button class="link" data-act="tmdismiss">Got it</button></p>`;

function ringColor(c){
  const W=c.width,d=c.getContext('2d').getImageData(0,0,W,W).data,R=[],G=[],B=[];
  for(let i=0;i<1400;i++){const a=i*2.399963,rr=W*(.31+.15*((i*7919)%997)/997),px=Math.round(W/2+Math.cos(a)*rr),py=Math.round(W/2+Math.sin(a)*rr);

/* ---------- backups: file download and restore, plus a reminder for logs that are not synced ----------
   The reminder state is per device (localStorage, never synced): when this log was last backed up, when the app was
   first opened, and when "Later" was tapped. It shows only while sync is off, once something is worth keeping. */
const BK_KEY='playback_backup',BK_DAY=864e5,BK_EVERY=21;
const BKX={pending:null,msg:'',ok:false};
const bkGet=()=>{try{return JSON.parse(localStorage.getItem(BK_KEY)||'{}')||{}}catch(e){return{}}};
const bkSet=o=>{try{localStorage.setItem(BK_KEY,JSON.stringify({...bkGet(),...o}))}catch(e){}};
const bkMark=()=>bkSet({last:Date.now()});
function bkNudge(){
  if(syncOn())return '';
  const b=bkGet(),now=Date.now(),base=b.last||b.first||0;
  if(!base||now-base<BK_EVERY*BK_DAY||now<(b.snooze||0))return '';
  if(Object.keys((S&&S.marks)||{}).length<5)return '';   /* nothing worth losing yet */
  const wk=Math.max(1,Math.round((now-base)/(7*BK_DAY)));
  return `<div class="banner bk" role="status"><p>${b.last?`You last backed up your log ${wk} weeks ago.`:'You have not backed up your log yet.'} A backup file is your only copy if this browser ever clears its saved data.</p><button class="btn primary" data-act="bkfile">Download backup</button><button class="btn" data-act="bksnooze">Later</button></div>`;
}
function bkDownload(){
  const txt=JSON.stringify(S),d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');
  a.href=u;a.download='playback-backup-'+ds+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);
  bkMark();BKX.ok=true;BKX.msg='Backup file saved ('+mb(txt.length)+'). Keep it somewhere safe, like your email or a cloud drive.';UI.bkOpen=true;render();
}
function bkPick(txt){
  let o;try{o=JSON.parse(txt)}catch(e){o=null}
  if(!o||o.v!==1||!Array.isArray(o.music)){BKX.pending=null;BKX.ok=false;BKX.msg='That file is not a Playback backup. Nothing was changed.';UI.bkOpen=true;render();return}
  BKX.pending=o;BKX.ok=true;UI.bkOpen=true;
  BKX.msg='This backup has '+o.music.length+' artist'+(o.music.length===1?'':'s')+' and '+((o.screen||[]).length)+' show'+((o.screen||[]).length===1?'':'s')+' or film'+((o.screen||[]).length===1?'':'s')+'. Restoring replaces everything in Playback on this device.';
  render();
}
function bkApply(){
  const o=BKX.pending;if(!o)return;BKX.pending=null;

/* how alike two people's ratings are, over what both rated: 100 means identical, about 0 means opposite ends of the scale */
function accMatch(theirs,mine){

        ${UI.rOpen===i.id?rateMeter(i.id,s.t):''}`}).join('');
    return `<div class="group sleeve${lsCls(g)} ${dx?'dxon':''} ${UI.dxAnim===g.id?'dxanim':''} ${SLIN.has(String(g.id))?'in':''}" data-acol="${g.id}" style="--acs:${col};--acd:${colD}">
      <div class="sl-hero">

      </div>

      <div class="tlist">${trackRows}</div>
      <div class="sl-foot">${shareBtn(g,a)}<details class="gmore"${UI.armed===g.id?' open':''}><summary aria-label="More for this album">\u22ef</summary>${moreBtns(g,dx)}${delGBtn(g,a)}</details></div>
    </div>`})).join('');
  UI.dxAnim=null;                                    /* the switch animation plays once, on the draw it was asked for */
  return `<div class="head hero${hClear()?' hclear':''}" data-aid="${esc(a.id)}" style="${esc(heroStyle(a))}"><i class="hg" aria-hidden="true"></i><div class="hmesh" aria-hidden="true"><i class="hbase"></i><i class="fl fl0"><i class="fb"></i></i><i class="fl fl1"><i class="fb"></i></i><i class="fl fl2"><i class="fb"></i></i><i class="fl fl3"><i class="fb"></i></i><i class="fl fl4"><i class="fb"></i></i><i class="fl fl5"><i class="fb"></i></i></div>

/* where this artist's list came from, and the button to (re)import it */
function mbArtistBar(a){
  const isRH=a.id===sid('artist','radiohead');
  let h='';
  if(MBX.busy&&MBX.where==='sheet'&&MBX.aid===a.id)h+=mbProgHtml();
  else if(a.mbid)h+=`<div class="mbsrc"><span class="label">From ${SRC_NAME[a.src||'mb']} · ${a.mbAt?'updated '+esc(new Date(a.mbAt).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})):'imported'}${a.mbVersions?' · with other versions':''}</span>
      <button class="link" data-act="mbrefresh" data-a="${a.id}" ${MBX.busy?'disabled':''}>${importSource()!=='mb'&&(a.src||'mb')!==importSource()?'Rebuild from '+SRC_NAME[importSource()]:'Check for new releases'}</button></div>`;
  else if(isRH)h+=`<div class="mbsrc warn"><p class="note">The non-album lists here were typed by hand and aren't verified. Replacing them with MusicBrainz's list keeps every checkmark and rating you have.</p>
      <div><button class="btn primary" data-act="mbrefresh" data-a="${a.id}" ${MBX.busy?'disabled':''}>Replace with the verified MusicBrainz list</button></div></div>`;
  else h+=`<div class="mbsrc"><span class="label">Added by hand</span><button class="link" data-act="mbprefill" data-a="${a.id}" ${MBX.busy?'disabled':''}>Find on MusicBrainz</button></div>`;
  if(undoAvail(a))h+=`<div class="mbsrc"><span class="label">Before the last import \u00b7 ${esc(new Date(UNDO[a.id].at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</span><button class="link" data-act="mbundo" data-a="${a.id}">${UI.undoArm===a.id?'Tap again to restore it':'Undo last import'}</button></div>`;
  if(MBX.aid===a.id&&MBX.errWhere==='sheet'){
    if(MBX.err)h+=`<p class="mberr" role="alert">${esc(MBX.err)}</p>${mbFallbackBtn()}`;
    if(MBX.report)h+=`<p class="mbok" role="status">${esc(MBX.report)}<button class="link" data-act="mbdismiss">Got it</button></p>`;
  }
  return h;
}

/* Each episode gets its own 1\u201310 rating, like songs. The season keeps its own
   overall rating too, shown beside the average of the episodes you rated, the same
   way albums sit beside their song average. Episode ratings live in marks under the
   episode ID, so they sync and survive a TMDB refresh. */
/* the whole show: your own overall rating, shown beside the average of your season
   ratings and of your episode ratings */
function showRate(s){
  const avgOf=ids=>{const rs=ids.map(rating).filter(Boolean);return{n:rs.length,of:ids.length,a:rs.length?rs.reduce((x,y)=>x+y,0)/rs.length:0}};
  const se=avgOf(s.seasons.filter(x=>x.eps).map(x=>sid(s.id,'s',x.n))),ep=avgOf(epIds(s)),r=rating(s.id),f1=v=>v.toFixed(1);
  const d=r&&ep.n?r-ep.a:null;
  return `<div class="arate srate"><span class="label">Your show rating</span>${rateDots(s.id)}
    <span class="avg">${se.n?'Season average '+f1(se.a)+' <span class="of">('+se.n+' of '+se.of+')</span>':'No seasons rated yet'}</span>
    <span class="avg">${ep.n?'Episode average '+f1(ep.a)+' <span class="of">('+ep.n+' of '+ep.of+')</span>':'No episodes rated yet'}</span>
    ${d===null?'':`<span class="diff ${Math.abs(d)<.05?'even':d>0?'up':'down'}">${Math.abs(d)<.05?'Same as the episodes':(d>0?'+':'\u2212')+f1(Math.abs(d))+' vs the episodes'}</span>`}</div>`}

function epRow(s,n,e){
  const id=sid(s.id,'s',n,'e',e),x=epInfo(s,n,e),open=!!UI.epOpen[id];
  const day=x&&x.d?new Date(x.d+'T12:00:00').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):'';
  const meta=[sxe(n,e),day,x&&x.rt?x.rt+'m':''].filter(Boolean).join(' · ');
  const title=x&&x.t?(x.o?`<button class="eptl" data-act="epx" data-id="${id}" aria-expanded="${open}">${esc(x.t)}</button>`:`<span class="eptl">${esc(x.t)}</span>`)+`<span class="epm">${esc(meta)}</span>`
    :`<span class="mono">${sxe(n,e)}</span>`;
  return `<div class="track ep ${isDone(id)?'done':''}"><span class="num">${e}</span>
    <button class="check" data-act="tog" data-id="${id}" aria-pressed="${isDone(id)}" aria-label="Watched ${sxe(n,e)}"></button>
    <div class="ttl">${title}${open&&x&&x.o?`<p class="epo">${esc(x.o)}</p>`:''}</div>${rateDots(id)}</div>`}

function seasonRate(sk,sids){
  const rs=sids.map(rating).filter(Boolean),n=rs.length,r=rating(sk);
  const avg=n?rs.reduce((x,y)=>x+y,0)/n:0,d=r&&n?r-avg:null,f1=v=>v.toFixed(1);
  return `<div class="arate"><span class="label">Your season rating</span>${rateDots(sk)}
    <span class="avg">${n?'Episode average '+f1(avg)+' <span class="of">('+n+' of '+sids.length+' rated)</span>':'No episodes rated yet'}</span>
    ${d===null?'':`<span class="diff ${Math.abs(d)<.05?'even':d>0?'up':'down'}">${Math.abs(d)<.05?'Same as the episodes':(d>0?'+':'\u2212')+f1(Math.abs(d))+' vs the episodes'}</span>`}</div>`}

function showView(s){
  if(tmNeedsEps(s))setTimeout(()=>tmLoadEps(s),0);
  else if(tmNeedsWatch(s))setTimeout(()=>tmLoadWatch(s),0);
  const ids=epIds(s),p=pct(ids),done=ids.filter(isDone).length;
  const out=s.seasons.filter(se=>se.eps).length,rated=ids.filter(i=>rating(i)).length,ss=showStatus(s),stopLine=stopText(s,ss);
  return `<div class="head">${tmPoster(s)}<div class="ring" style="--p:${p}"><span>${p}%</span></div>
    <div class="meta"><h2>${esc(s.title)}${s.example?'<span class="ex">Example</span>':''}</h2><span class="mono">${s.year?esc(s.year)+' · ':''}${done} of ${ids.length} episodes watched · ${rated} rated · ${out} season${out===1?'':'s'}</span>
      ${s.genres&&s.genres.length||s.network?`<span class="genres">${esc([(s.genres||[]).join(', '),s.network,s.creators&&s.creators.length?'Created by '+s.creators.join(', '):''].filter(Boolean).join(' · '))}</span>`:''}
      ${stopLine?`<span class="note">${esc(stopLine)}</span>`:''}
      ${s.next&&s.next.d?`<span class="note airs">Next: ${sxe(s.next.n,s.next.e)} on ${esc(tmDay(s.next.d))}</span>`:''}</div></div>
    ${s.overview?`<p class="overview">${esc(s.overview)}</p>`:''}
    ${watchBlock(s)}
    ${showRate(s)}
    ${screenStrip(s)}
    ${tmBar(s)}
    ${TME.busy===s.tmdb?'<p class="note">Getting episode names and descriptions from TMDB…</p>':''}
    ${s.seasons.map(se=>{const sids=Array.from({length:se.eps},(_,k)=>sid(s.id,'s',se.n,'e',k+1)),sd=sids.filter(isDone).length,sk=sid(s.id,'s',se.n),more=(se.total||0)-se.eps;
      if(!se.eps)return `<div class="group"><div class="ghead"><h3>Season ${se.n}</h3><span class="sp"></span><span class="label">Not out yet${se.total?' · '+se.total+' episode'+(se.total===1?'':'s')+' planned':''}</span></div></div>`;
      return `<div class="group"><div class="ghead"><h3>Season ${se.n}</h3>${seasonTag(ss,se.n)}<span class="sp"></span>${more>0?`<span class="label">${more} more coming</span>`:''}<span class="mono">${sd}/${se.eps}</span><span class="bar"><i style="width:${sd/se.eps*100}%"></i></span>
        <button class="link" data-act="seasonall" data-s="${s.id}" data-n="${se.n}">${sd===se.eps?'Clear':'Mark season watched'}</button></div>
        ${seasonRate(sk,sids)}
        ${sids.map((id,k)=>epRow(s,se.n,k+1)).join('')}</div>`}).join('')}
    ${s.tmdb?'':`<details class="more"><summary>Add a season</summary>
      <form data-form="season" data-s="${s.id}"><input id="season-eps" name="eps" type="number" min="1" max="200" placeholder="Number of episodes" required><button class="btn primary">Add season ${s.seasons.length+1}</button></form></details>`}
    <div>${delBtn(s.id,'Delete show')}</div>`;
}

function filmView(f){
  if(tmNeedsWatch(f))setTimeout(()=>tmLoadWatch(f),0);
  const d=isDone(f.id);
  return `<div class="head">${tmPoster(f)}<div class="ring" style="--p:${d?100:0}"><span>${d?'Seen':'—'}</span></div>
    <div class="meta"><h2>${esc(f.title)}</h2><span class="mono">Film${f.year?' · '+esc(f.year):''}${f.runtime?' · '+Math.floor(f.runtime/60)+'h '+(f.runtime%60)+'m':''}</span></div></div>
    ${tmBar(f)}
    ${f.genres&&f.genres.length?`<span class="genres">${esc(f.genres.join(', '))}</span>`:''}
    ${f.overview?`<p class="overview">${esc(f.overview)}</p>`:''}
    ${watchBlock(f)}
    <div class="tools"><button class="btn ${d?'':'primary'}" data-act="tog" data-id="${f.id}">${d?'Mark unwatched':'Mark watched'}</button><span class="label">Your rating</span>${rateDots(f.id)}</div>
    ${screenStrip(f)}
    <div>${delBtn(f.id,'Delete film')}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');
  if(!b){if(UI.mm&&!ev.target.closest('.mmenu')){UI.mm=false;UI.mmAnim=false;render()}return}
  const act=b.dataset.act,id=b.dataset.id;
  const mmWas=!!UI.mm;UI.mm=false;UI.mmAnim=false;   /* any tap closes the Music menu; tapping Music again below toggles it */
  if(['tog','ropen','rclear','dedit','grpall','lsnew','lltog'].includes(act)&&b.closest('.lsold'))return;   /* an earlier listen is view only */
  if(act!=='del'&&act!=='delg'&&act!=='lsrm')UI.armed=null;
  if(act!=='mbundo')UI.undoArm=null;
  if(act!=='sugclear')UI.sugArm=false;
  if(act!=='accdel'&&ACX.arm){ACX.arm=false}
  if(act!=='copy')UI.copied=false;
  if(act!=='coldel')UI.colDel=null;
  /* closing a rater: let it fold away first, then redraw */
  if((act==='rclose'||(act==='ropen'&&UI.rOpen===id))&&!UI.rClosing){
    const rt=document.querySelector('.rater');
    if(rt&&!matchMedia('(prefers-reduced-motion:reduce)').matches){UI.rClosing=true;const cid=UI.rOpen,fly=rtFlyPrep(cid);rt.classList.remove('rt-in');rt.classList.add('rt-out');
      setTimeout(()=>{UI.rClosing=false;UI.rOpen=null;if(fly)UI.rLand=cid;render()},230);rtFlyGo(fly);return}}
  if(act==='view'){UI.view=b.dataset.v;UI.rOpen=null;if(UI.view==='account'){UI.pAnim=true;UI.pKind='a';UI.pLim=60}if(UI.view==='history'){UI.hAnim=true;UI.hEdit=null}window.scrollTo({top:0})}
  else if(act==='lib'){UI.libOpen=!UI.libOpen;UI.libAnim=UI.libOpen}
  else if(act==='llopen'){UI.llOpen=true}
  else if(act==='llclose'){UI.llOpen=false}
  else if(act==='addart'){UI.libOpen=false;UI.addOpen=true;UI.toAdd=true}
  else if(act==='dcforget'){dcSetToken('');COL.tokMsg='Removed from this device.';UI.colTok=true}
  else if(act==='colf'){UI.colF=b.dataset.v}
  else if(act==='coladdp'){const p=(COL.res||[])[+b.dataset.i];if(!p)return;
    const c={id:colNewId(),artist:p.artist,title:p.title,year:p.year,country:p.country,label:p.label,catno:p.catno,barcode:p.barcode,fmt:p.fmt,color:p.color,discogs:p.discogs,thumb:p.thumb,cover:p.cover||'',edition:p.edition||'',media:'',sleeve:'',paid:'',bought:b.dataset.w?'':colToday(),where:'',notes:'',wish:!!b.dataset.w,added:Date.now()};
    S.collection=[c,...colAll()];COL.res=null;UI.colEdit=c.id;UI.colOpen=c.id;UI.colF='all';UI.colQ='';touch()}
  else if(act==='coledit'){UI.colEdit=UI.colEdit===id?null:id}
  else if(act==='vopen'){const x=colAll().find(c=>c.id===id);UI.vOpen=id;UI.vStep='front';document.documentElement.classList.add('vw-lock');
    if(x&&(!x.scan||(x.scan.none&&Date.now()-x.scan.at>2592e6)))setTimeout(()=>colFindScans(x),0)}
  else if(act==='vclose'){UI.vOpen=null;document.documentElement.classList.remove('vw-lock');viewRedraw();return}
  else if(act==='vstep'){UI.vStep=b.dataset.v;CROP.err='';const st=document.querySelector('.vw-stage');if(st){
    const pb=document.querySelector('.vw-photo'),x=colAll().find(c=>c.id===UI.vOpen);if(pb&&x)pb.outerHTML=photoBar(x,UI.vStep);st.dataset.step=UI.vStep;
    document.querySelectorAll('.vw-seg button').forEach(z=>z.setAttribute('aria-pressed',z.dataset.v===UI.vStep));
    const i=VSTEPS.findIndex(v=>v[0]===UI.vStep),nv=document.querySelectorAll('.vw-nav');
    if(nv[0]){nv[0].dataset.v=VSTEPS[Math.max(0,i-1)][0];nv[0].disabled=i<=0}if(nv[1]){nv[1].dataset.v=VSTEPS[Math.min(4,i+1)][0];nv[1].disabled=i>=4}}return}
  else if(act==='sugload'){sugLoad();return}
  else if(act==='sugdel'){sugChange('?id='+encodeURIComponent(id));return}
  else if(act==='friendopen'){UI.view='friend';UI.fid=b.dataset.u;UI.pKind='a';UI.pFilter='all';UI.pLim=60;UI.pAnim=true;UI.rOpen=null;window.scrollTo({top:0});if(ACX.prof[UI.fid])ACX.prof[UI.fid].at=0}
  else if(act==='pkind'){UI.pKind=b.dataset.v;UI.pLim=60}
  else if(act==='pfilter'){UI.pFilter=b.dataset.v;UI.pLim=60}
  else if(act==='pmore'){UI.pLim=(UI.pLim||60)+60}
  else if(act==='accout'){accOut('Signed out.');ACX.ok=true;render();return}
  else if(act==='accdel'){accDelete();return}
  else if(act==='accaccept'){accAccept(b.dataset.u);return}
  else if(act==='accremove'){accRemove(b.dataset.u);return}
  else if(act==='acccopy'){const t=ACC.me&&ACC.me.code||'';(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{ACX.copied=true;render();setTimeout(()=>{ACX.copied=false;render()},1600)}).catch(()=>{ACX.ok=false;ACX.msg='This browser would not copy it. Select the code and copy it by hand.';render()});return}
  else if(act==='sugclear'){if(UI.sugArm){UI.sugArm=false;sugChange('?all=1')}else{UI.sugArm=true;SUGX.ok=false;SUGX.msg='Tap Clear all again to remove every suggestion.';render()}return}
  else if(act==='sugcopy'){const t=(SUGX.list||[]).map(x=>'- '+(x.name?x.name+': ':'')+x.text).join('\n');
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{SUGX.copied=true;render();setTimeout(()=>{SUGX.copied=false;render()},1600)}).catch(()=>{SUGX.ok=false;SUGX.msg='This browser would not copy.';render()});return}
  else if(act==='bkfile'){bkDownload();return}
  else if(act==='bksnooze'){bkSet({snooze:Date.now()+7*BK_DAY});render();return}
  else if(act==='bkgo'){bkApply();return}

    if(!/^[A-Za-z0-9]{30,64}$/.test(t))COL.tokMsg='That does not look like a Discogs token (about 40 letters and numbers).';
    else{COL.tokMsg=dcSetToken(t)?'Saved on this device.':'This browser would not save it.';if(COL.tokMsg==='Saved on this device.'){COL.err=''}}
    UI.colTok=true;render();return}
  if(kind==='colhand'){const ar=(d.artist||'').trim(),t=(d.title||'').trim();if(!ar||!t)return;
    const c={id:colNewId(),artist:ar,title:t,year:(d.year||'').trim(),country:'',label:(d.label||'').trim(),catno:(d.catno||'').trim(),barcode:'',fmt:'',color:(d.color||'').trim(),discogs:0,thumb:'',edition:'',media:'',sleeve:'',paid:'',bought:colToday(),where:'',notes:'',wish:false,added:Date.now()};
    S.collection=[c,...colAll()];UI.colEdit=c.id;UI.colOpen=c.id;UI.colF='all';UI.colQ='';UI.colHand=false;touch();render();return}
  if(kind==='coledit'){const x=colAll().find(c=>c.id===f.dataset.id);if(!x||!(d.artist||'').trim()||!(d.title||'').trim())return;
    for(const k of ['artist','title','year','country','label','catno','barcode','fmt','color','edition','media','sleeve','where','notes'])x[k]=(d[k]||'').trim();
    x.vc=d.vcauto?'':String(d.vc||'');
    x.paid=String(d.paid||'').replace(/[^0-9.]/g,'');x.bought=d.bought||'';x.wish=d.status==='wish';UI.colEdit=null;touch();render();return}
  if(kind==='gwith'){const a=S.music.find(x=>x.id===f.dataset.a),g=a&&a.groups.find(x=>x.id===f.dataset.g);
    if(g){const w=[...new Set(String(d.w||'').split(/\s*(?:&|,|\band\b|\u00d7)\s*/i).map(x=>x.trim()).filter(Boolean))];if(w.length)g.w=w;else delete g.w;linkTwins();touch()}
    UI.wEdit=null;render();return}
  if(kind==='grd'){const g=S.music.flatMap(x=>x.groups).find(x=>x.id===f.dataset.g);
    if(g){const id=dxOn(g)?dxId(g):g.id,v=String(d.rd||'').trim();
      if(rating(id)&&/^\d{4}-\d\d-\d\d$/.test(v)&&v<=todayISO())S.marks[id]={...S.marks[id],rd:v};
      else if(rating(id)&&!v){const m0={...S.marks[id]};delete m0.rd;S.marks[id]=m0}lsFromMark(id);
      touch()}
    UI.dEdit=null;render();return}
  if(kind==='hrd'){const id=f.dataset.id,v=String(d.rd||'').trim();
    if(rating(id)&&/^\d{4}-\d\d-\d\d$/.test(v)&&v<=todayISO())S.marks[id]={...S.marks[id],rd:v};
    else if(rating(id)&&!v){const m0={...S.marks[id]};delete m0.rd;S.marks[id]=m0}lsFromMark(id);
    UI.hEdit=null;touch();render();return}
  if(kind==='listen'){if(llAdd(d.artist,d.title))touch();UI.llOpen=true;render();const el=document.getElementById('wl-artist');if(el)el.focus();return}
  if(kind==='spcid'){const c=(d.cid||'').trim();
    if(!/^[0-9a-f]{32}$/i.test(c)){SPX.err='That does not look like a Client ID. It is 32 letters and numbers, under Settings on your Spotify app\u2019s page.';render();return}
    S.cfg={...(S.cfg||{}),spotify:c};SPX.cidOpen=false;SPX.err='';touch();render();return}
  if(kind==='artist'){const name=d.name.trim();if(!name)return;const id=sid('artist',name);
    if(!S.music.some(x=>x.id===id))S.music.push({id,name,groups:[]});UI.sel.music=id}
  else if(kind==='screen'){const title=d.title.trim();if(!title)return;
    if(UI.addType==='film'){const id=sid('film',title,d.year||'');if(!S.screen.some(x=>x.id===id))S.screen.push({id,type:'film',title,year:d.year.trim()});UI.sel.screen=id}
    else{const eps=(d.seasons||'').split(/[,\s]+/).map(Number).filter(n=>n>0&&n<=200);if(!eps.length)return;
      const id=sid('show',title);if(!S.screen.some(x=>x.id===id))S.screen.push({id,type:'show',title,year:d.year.trim(),seasons:eps.map((n,k)=>({n:k+1,eps:n}))});UI.sel.screen=id}}
  else if(kind==='group'){const a=S.music.find(x=>x.id===f.dataset.a),title=d.title.trim();if(!a||!title)return;
    const gid=sid(a.id,title);let g=a.groups.find(x=>x.id===gid);if(!g){g={id:gid,title,year:d.year.trim()||'—',kind:d.kind,items:[]};a.groups.push(g)}
    const have=new Set(artistItems(a).map(mbItemKey));
    d.tracks.split('\n').map(t=>t.trim()).filter(Boolean).forEach(t=>{const k=mbKeyOf(t);if(have.has(k))return;have.add(k);g.items.push({id:sid(a.id,title,t),title:t})});
    if(!g.items.length)a.groups=a.groups.filter(x=>x!==g)}
  else if(kind==='sync'){
    const url=(d.url||'').trim(),key=(d.key||'').trim();
    if(!/^https:\/\//.test(url)||!key){SYS.status='error';SYS.msg='Enter your Worker URL (starting with https://) and the sync key.';render();return}
    const changed=url!==SY.url;SY.url=url;SY.key=key;if(changed){SY.last=0;SY.at=0}saveSync();SYS.status='idle';SYS.msg='';render();pull();return}
  else if(kind==='season'){const s=S.screen.find(x=>x.id===f.dataset.s),n=+d.eps;if(!s||!(n>0))return;s.seasons.push({n:s.seasons.length+1,eps:n})}
  touch();render();
});

function start(){render();accBoot();pull().finally(()=>{spBoot();tmAutoRefresh()})}
if(READY){start();save()}   /* save() also copies a localStorage-only log into IndexedDB */
else{render();IDB.get(KEY).then(t=>{const o=t?JSON.parse(t):null;if(o&&o.v===1){S=o;SV.idb=true;SV.bytes=t.length}},()=>{}).finally(()=>{boot();start()})}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){setTimeout(tmAutoRefresh,3000);setTimeout(()=>spPoll(false),4000)}});

/* ---------- is there a newer copy? ---------- */
/* 2026.10.21-a -> sortable; a two-letter suffix (after z) still sorts after one */
function buildKey(v){const m=/^(\d{4})\.(\d\d)\.(\d\d)-([a-z]+)$/.exec(v||'');return m?m[1]+m[2]+m[3]+String(m[4].length)+m[4]:''}
const UPD={last:0,dismissed:null,shown:null};
async function checkUpdate(force){
  if(!/^https?:$/.test(location.protocol)||!window.fetch)return;
  if(!force&&Date.now()-UPD.last<20e3)return;
  UPD.last=Date.now();
  try{
    /* cheap look first: sw.js is ~2 KB and carries the same build id as the page, so polling it every
       30 seconds costs almost nothing. Only when it shows something newer (or can't be read) is the
       whole page fetched to confirm. The check at load always reads the page itself. */
    if(!force){try{const q=await fetch('sw.js?_='+Date.now(),{cache:'no-store'});
      if(q.ok){const sm=(await q.text()).match(/playback-(\d{4}\.\d\d\.\d\d-[a-z]+)/);if(sm&&!(buildKey(sm[1])>buildKey(BUILD)))return}}catch(e){}}
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const html=await r.text();
    const m=html.match(/v:'(\d{4}\.\d\d\.\d\d-[a-z]+)'/);if(!m)return;
    const live=m[1];
    if(!(buildKey(live)>buildKey(BUILD))||live===UPD.dismissed)return;
    /* just reloaded for this build and still got the old copy: GitHub hasn't caught up, try again quietly */
    let tried=null;try{tried=sessionStorage.getItem('playback_upd_tried')}catch(e){}
    if(tried===live&&!force){if(!UPD.retry){UPD.retry=true;setTimeout(()=>{UPD.retry=false;checkUpdate(true)},60e3)}return}
    showUpdate(live);
  }catch(e){}
}
function showUpdate(ver){
  UPD.shown=ver;
  document.getElementById('updtxt').textContent='Build '+ver+' is ready';
  const b=document.getElementById('updbar');b.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('up')));
}
document.getElementById('updgo').addEventListener('click',()=>{
  try{sessionStorage.setItem('playback_upd_tried',UPD.shown||'')}catch(e){}
  save();
  location.replace(location.pathname+'?v='+Date.now()+location.hash);
});
document.getElementById('updx').addEventListener('click',()=>{
  UPD.dismissed=UPD.shown;
  const b=document.getElementById('updbar');b.classList.remove('up');setTimeout(()=>{b.hidden=true},320);
});
if(/[?&]v=\d+/.test(location.search))try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
setTimeout(()=>checkUpdate(true),2500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});
/* and keep looking while the app is simply left open on screen */
setInterval(()=>{if(document.visibilityState==='visible')checkUpdate(false)},30e3);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
