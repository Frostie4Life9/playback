<script>
/* Newest first. BUILD is read from the top entry, so the version and the note
   describing it can't drift apart. THE DATE IS THE DAY THE BUILD WAS MADE, in
   Provo, and the letter counts builds within that day (a, b, c...). The update
   bar reads the first v:'...' in the live file, so this list must stay the
   first place that pattern appears. Keep sw.js CACHE in step. Keep about 25 entries here;
   older ones move to CHANGELOG.md (never shipped to the phone). */
/* A cover that fails to load (a phone's signal dipping, a slow image server) is asked for again twice before it is given up on, instead of vanishing the first time. */
window.coverErr=function(im){const n=+im.dataset.rt||0;
  if(n>=2||!im.isConnected){im.remove();return}
  im.dataset.rt=n+1;const u=im.currentSrc||im.src;
  setTimeout(()=>{if(im.isConnected){im.removeAttribute('src');im.src=u}},900*(n+1))};
const CHANGELOG=[
  {v:'2026.11.19-c', note:'NEW RELEASES NO LONGER LIST ALBUMS THAT ARE NOT OUT YET: an album Apple has announced for a later date (Justice\u2019s GTA VI score, out Dec 11) was showing under New from your artists. Now only albums and EPs that are actually out appear. Anything already listed with a future date is taken off when Playback opens, and an announced album shows up on its own once its release day has passed (and within the last two months). If Apple moves a date later, the entry is taken back off.'},
  {v:'2026.11.19-b', note:'DELUXES FOLLOW THE TRACKLIST: Justice\u2019s \u2020 (Anniversary Edition) stayed a separate album because its title shares no words with Justice. An edition now folds into the standard album when it carries at least 90% of that album\u2019s songs and adds some, came out no earlier, and fits only that one album, whatever its title says. The edition keeps its own name and cover on the Deluxe side of the switch. Re-recordings, live and remix sets, and box sets that hold two albums still stay apart. New releases use the same test: Apple lists an edition apart from the album, so a fresh release is now checked against the songs of albums you already have and skipped if it is just an edition of one. Tap Check for new releases on the artist to fold an existing one; the rating on the stand-alone edition moves to your deluxe rating.'},
  {v:'2026.11.19-a', note:'EASIER TO FIND YOUR WAY (from a friend\u2019s feedback on a phone): the bottom bar now has Music, Stats, History and Settings as real tabs, evenly spaced (Stats and History used to hide in a popup, and a friend\u2019s two tabs sat bunched on the left); the round buttons at the top have words under them on a phone (Listen list, Add artist, Friends, Account); the artist page has an All artists button; Listen list and Listen again on an album say what they do; a new log shows Start your log with a Search for an artist button; and a short spotlight tour runs once for friends (replay it from Settings, Show the tour).'},
  {v:'2026.11.18-v', note:'SCREEN AND COLLECTION ARE OWNER-ONLY FOR NOW: both are still work in progress, so their tabs, pages and the Screen block on Stats are hidden for everyone except you (the owner, same check as the suite bar and People card). A friend whose browser had Screen saved as the last tab lands on Music instead.'},
  {v:'2026.11.18-u', note:'FRIENDS AND LISTEN LIST ANIMATE AGAIN: the Friends sheet had lost its opening animation in the last build (a side effect of the faster artist switching), and it is back. The Listen list now opens with a fade and slide-up, with its rows rising in one after another, and both the Friends sheet and the Listen list slide away when you close them (close button, tapping outside, or Esc).'},
  {v:'2026.11.18-t', note:'FASTER ARTIST SWITCHING: opening another artist no longer rebuilds the whole page. When nothing else on the page has changed, the top bar and the wall of artists stay as they are and only the artist pane is redrawn, so clicks land sooner on slower laptops (about 40% less work per click in testing with 70 artists, more with bigger libraries). The record is also drawn once in its new look instead of twice. Everything looks and animates the same; any other change still redraws the full page.'},
  {v:'2026.11.18-s', note:'SMOOTHER ON LAPTOPS: the top bar and the floating dock no longer blur what scrolls behind them (they were already almost solid, so they look the same, but the blur was re-done every scroll frame). The artist page background colors now run on three moving layers instead of six, two colors each, with every album color still there and still sized by your ratings, and they stop drifting while the artist card is scrolled out of view. The spinning liquid vinyl is unchanged.'},
   {v:'2026.11.18-r', note:'SETTINGS SPOTIFY CARD FIXED: the Spotify card in Settings failed to load (\u201cCannot read properties of undefined\u201d) because two parts of the play counting shared a name, so the older Most played list broke once the Stats page was added. It works again. You can also still reach your counts on the Stats page.'},
   {v:'2026.11.18-q', note:'SETTINGS CAN NO LONGER GO BLANK: if one card in Settings fails to load, the page still opens and that card shows a short message saying what went wrong, instead of the Settings button doing nothing.'},
  {v:'2026.11.18-p', note:'SORT THE BIG RECORD: under the big record on an account page there is a row of orders: Highest (the usual, best at the outer edge), Lowest, Newest rated, Oldest rated and A–Z by artist. Pick one and the covers pop back onto the groove in the new order, with the caption telling you which end is the outer edge. It works on your page and on friends\' pages, and goes back to Highest when you leave.'},
  {v:'2026.11.18-o', note:'ALBUM PAGES FOLLOW THE ALBUM COLOR: the pop-up you get from a cover on the big record and the Song ratings sheet are redesigned like the Music page\'s sleeves. The whole top takes the album\'s own color (the same one the Music page uses, or read from the cover for albums not in your log), the cover sits with a record sliding out from behind it, the rating bar and buttons use the banner\'s ink, and the song ratings sit on a wash of the album color with white bars. The record slides out when the page opens.'},
  {v:'2026.11.18-n', note:'ALBUM COLORS ON THE BIG RECORD: on account pages, each cover on the big record now has a ring in that album\'s own color, the same color the Music page gives it, instead of the same teal on every cover. Albums not in your log get their color read from the cover. The ring is still thicker for higher ratings, and turns white when you hover or pick a cover.'},
  {v:'2026.11.18-m', note:'RECENTLY PLAYED AND ARTIST PHOTOS ON STATS: the Stats page now starts with a Recently played card: your latest plays, newest first, each with its cover, artist and album and how long ago you played it (3 min ago, 2 h ago, 5 days ago; hover for the exact time, and the times keep ticking while the page is open). Show 10 more reaches further back. Artists in Stats now show their Spotify photo instead of a letter: it was reading the wrong picture field before, so even artists in your log showed letters. For artists not in your log, Playback looks their photo up on Spotify a few at a time (12 per visit, saved on this device, and it stops quietly if Spotify says quota).'},
  {v:'2026.11.18-l', note:'PLAY COUNT COLOR: the ▶ play count on song rows now uses the album color, the same as the rating ring beside it, instead of white.'},
  {v:'2026.11.18-k', note:'TRACK ROW LAYOUT: on song rows the rating ring now sits at the far right, with the play count (▶ and number) right beside it on its left in the same color as the song title. Before, the play count wrapped onto its own line and pushed the rating down.'},
  {v:'2026.11.18-j', note:'APPLE MUSIC IMPORT: Stats now reads Apple Music history too. Request your data at privacy.apple.com (Apple Media Services information), then choose the zip, or Apple Music Play Activity.csv, in the Stats import box. Apple plays count next to Spotify ones, songs match across services, and re-importing never double counts. An Apple import only replaces older Apple plays, never Spotify ones. Apple does not offer a free way to read plays as they happen (it needs a $99 a year developer account), so Apple plays come from the export.'},
  {v:'2026.11.18-i', note:'SONG LENGTHS FOR LIVE PLAYS: plays Spotify reports as they happen now come with the song\'s length, so Stats hours for them use the real length instead of an estimate. Spotify does not say how much of a live play you heard, so each counts as played in full; a Spotify data export (which has the exact time) replaces them for the dates it covers. Plays saved before this update have no length and are still estimated. Your Worker needs the new playback-sync.js (it takes it from GitHub on its own).'},
  {v:'2026.11.18-h', note:'SIMILAR MUSIC: every artist page has a Similar artists section (tap to open, nothing loads until you do) and every song you open to rate has Similar songs, both from Last.fm listening data. Each match shows a match bar and where you stand with it: % heard, Rated, Heard, or Not in your log; Open jumps to that artist, Add starts the Add an artist search for them. Rows rise in one after another and the match bars fill. Answers are saved on the Worker for 30 days, so looking again is free, and fresh lookups are capped per person per day. Needs Worker 19 and the LASTFM_KEY secret (a free Last.fm API key).'},
  {v:'2026.11.18-g', note:'STATS PAGE AND A PLAY HISTORY FOR EVERY SONG: Music menu › Stats is a stats.fm-style page: your top songs, artists and albums for the last 4 weeks, 6 months, 12 months, this year, any year or all time, plus plays over time, busiest day, longest streak, songs new to you, time of day and day of the week. Every play Spotify reports is now kept in a separate play history on this device, including songs from artists you have not added to Playback; add the artist later and its old plays show up as counts on its songs. To fill in the past, request Extended streaming history from Spotify (spotify.com/account/privacy) and choose the zip on the Stats page, no unzipping; it counts plays of 30 seconds or more like Spotify does, and importing a newer export later replaces the dates it covers so nothing is counted twice. Preview with fake stats shows the page with made-up listening that is never saved. Songs you have played are not checked off as heard on their own: after an import there is an optional button for that, with Undo. The history is kept on the device it was imported on (not synced), so keep the Spotify zip.'},
  {v:'2026.11.18-f', note:'PLAY COUNTS: every Spotify play of a song in your log is now counted. Song rows show a small ▶ number (hover for the last play date), and Settings › Spotify has a Most played list of your top songs and albums. The first time it runs it counts everything your Worker has saved (up to its last 3,000 plays); after that it adds each new play. Plays of songs not in Playback are not counted, and Spotify leaves out private-session plays.'},
  {v:'2026.11.18-e', note:'NEW RELEASES FROM YOUR ARTISTS: once a day while Playback is open (and on Check now), it asks Apple Music, which needs no key and uses none of your Spotify allowance, for the albums and EPs of up to 25 of your artists at a time, the ones checked longest ago first. Anything out in the last two months, or already announced, that is not in your log lands at the top of the Listen list under New from your artists, with Add to list, Artist and Dismiss, and the bookmark badge counts them. They also go to your morning brief (Worker 18 adds newReleases to /brief). Daily checks can be turned off in that box. It only runs while the app is open, and Apple is sent artist names only.'},
  {v:'2026.11.18-d', note:'YEAR IN REVIEW: Overview on your own account page has a Year in review card. Make my 2026 card builds a picture from your rated-on dates: albums rated, your average, how many artists, your top album big with its score, albums rated each month (busiest month lit) and your next best covers. Share it, copy it or save it like the rating card; switch years when you have rated 3+ albums in more than one.'},
  {v:'2026.11.18-c', note:'FRIENDS ACTIVITY: the Friends sheet opens on a new Activity tab (Friends keeps the list, codes and requests) showing the newest ratings from friends who share their page: cover, who rated, the title, the day, their score and the start of their review. Tap one to open that friend\'s page with the album already open. Rows rise in one after another. Needs Worker 18 (GET /acct/feed).'},
  {v:'2026.11.18-b', note:'WRITTEN REVIEWS: any album or deluxe you have rated has a Write a review button under its rating (1,000 characters; Edit review and Delete once it exists). Friends see it when they open your album on your page, and next to your score on their own album card behind a Read review button. It rides on the rating, is included in Export ratings (new Review column) and in Download backup, and the privacy page and Account note now say reviews are shared with friends. Needs Worker 18 for friends to see it.'},
  {v:'2026.11.18-a', note:'TIDYING AND SAFETY: a Content-Security-Policy keeps remote scripts, plugins and off-site forms out (it is a seatbelt, not a wall: friend names, titles and messages were already escaped on the friend pages and the friends list, which I re-checked). A song row can now be opened with Enter or Space from the keyboard, and keeps focus afterwards. The 187 oldest changelog entries moved out of index.html into CHANGELOG.md, so the page is about 80 KB lighter on every open.'},
  {v:'2026.11.17-ay', note:'LISTEN LIST OPENS THE ALBUM: tapping Open on a Listen list entry now takes you to that album on the artist\u2019s page (scrolled into view with a little ripple) instead of just to the artist, and the Listen list closes behind you. If an entry is not in your log yet, Open still goes to the artist.'},
  {v:'2026.11.17-ax', note:'FRIENDS CAN SEE YOUR SONG RATINGS: opening one of your albums on your page (from the Albums wall, or the new Song ratings button when you tap an album on the big record) now shows its songs and their ratings to friends, the same list you see, with how many songs are rated and the song average. Each album now carries its song ratings when it is shared, so they show up after your next sync; a friend\u2019s page fills in as that friend updates Playback. Anyone you share your page with can see them, like the album rating itself.'},
  {v:'2026.11.17-aw', note:'FRIEND PAGES ANIMATE AGAIN: opening a friend\u2019s page the first time showed a \u201cLoading\u2026\u201d card, and that first draw used up the page\u2019s entrance animations, so when the friend\u2019s ratings arrived a moment later the hero, covers, record and cards just appeared. The animations are now saved until the page has really been drawn.'},
  {v:'2026.11.17-av', note:'FRIENDS CODE STAYS PUT: your friend code no longer pops in a second time when the Friends list finishes loading (it had its own entrance animation that replayed on every redraw); the sheet\u2019s slide-up is the only entrance now. The same goes for the code on the Account Settings tab.'},
  {v:'2026.11.17-au', note:'FIX: closing the month panel no longer makes the score hint above it flash; only the hint that belongs to the panel you closed fades in.'},
  {v:'2026.11.17-at', note:'SMOOTHER FOLD: when a score or month detail panel closes, it now shrinks to exactly the size of the \u201cTap a bar\u2026\u201d line that replaces it and that line fades in, so the cards below no longer rise too far and then snap back down.'},
  {v:'2026.11.17-as', note:'DETAIL PANEL CLOSES SMOOTHLY: tapping the selected bar again (a score under the tiles, or a month in Albums rated per month) now folds the detail panel away, shrinking and fading, with the cards below sliding up into the gap, instead of vanishing at once.'},
  {v:'2026.11.17-ar', note:'STEADY RECORD: tapping a bar under Overview (a score or a month) no longer makes the big rated-albums record jump. Every tap redrew the page, which started the record\u2019s slow spin over from its first angle; it now keeps turning from wherever it was.'},
  {v:'2026.11.17-aq', note:'PAGE TRANSITIONS AND A STEADIER FRIENDS SHEET: switching between Music, Screen, Collection, Settings and Account now slides the new page in from the side it sits on in the top bar while it fades up (going back toward Music slides the other way). Opening Friends no longer plays twice: the sheet used to slide up, then slide up again a moment later when the list finished loading; now it slides up once and the list fills in without moving.'},
  {v:'2026.11.17-ap', note:'ALBUMS WALL: EVERYTHING, GROUPED BY SCORE, TAP FOR DETAILS. The Albums tab no longer stops at 60 and has no Show more button: every album is on the wall and the covers grow to use the width of your screen. Sorted by Highest or Lowest, the wall is split into rows headed by the exact score (10, 9.5, 9 and so on) with how many albums got it. Tap any cover (or a row in the list view) and a pop-up opens with the big cover, the rating, the day it was rated, and on your own page every song with its rating bar, how many songs you rated and the song average next to the album rating. On a friend\u2019s page it shows their rating and date and, if you rated it too, yours; their song ratings stay private. Close with the X, by tapping outside, or Escape.'},
  {v:'2026.11.17-ao', note:'ACCOUNT SETTINGS TAB AND A TIDIER SETTINGS PAGE: your Account page has a fourth tab, Settings, that holds Friends (your code, add by code, requests) and Your account (photo, color, name, sharing, owner login, sync, sign out, delete), so they no longer sit under Overview, Albums and Shows & films. A friend\u2019s page does not show it. The regular Settings page is now grouped under three headings: Library & imports (import source, Spotify, Rate Your Music, rating dates), Account & community (the account shortcut, friend suggestions, people using Playback) and Your data (sync, numbers, export, backup). The groups sit side by side on a wide monitor, in two columns on a tablet and stacked on a phone. The Account card in Settings now has an Account settings button that opens straight to the new tab.'},
  {v:'2026.11.17-an', note:'OVERVIEW REARRANGES WITH THE WINDOW: the account Overview now lays its cards out by screen size instead of letting them fall wherever. On a phone everything stacks in one column (months, scoring habits, top artists, then the record). On a tablet the months card spans the top, scoring habits and top artists sit side by side, and the record is centered below. On a desktop the big record sits on the left, staying in view as you scroll, with the months, scoring habits and top artists stacked beside it so there are no empty gaps. On a very wide monitor the record takes the left, the months card spans the top and scoring habits and top artists sit side by side under it. Friends and Your account sit side by side on wide screens and stack on narrow ones.'},
  {v:'2026.11.17-am', note:'FIXES AND FULL-WIDTH PAGES: tapping a month bar used to replay the animation on the score covers above it (and the reverse); now only the panel you opened animates. Every page now uses the whole window instead of a centered column about 1100px wide: Settings flows into columns, your page lays its cards side by side, and everything folds back to one column as the window shrinks. The cover previews are fitted to the space they have, so they stay correct inside the narrower cards and refit on resize without redrawing.'},
  {v:'2026.11.17-al', note:'COVER PREVIEWS FILL THE PANEL: the score and month details on Overview used to show just the first eight covers. They now fill two rows on a phone and three on a wider screen, with more columns the wider the window (it refits when you resize), and when there are more albums than fit the last tile says how many more (+33 more) and opens them in the Albums tab. The covers also fade in at an even pace.'},
  {v:'2026.11.17-ak', note:'OVERVIEW: TAP THE BARS. Your stat tiles now also show Songs rated (with its average) and Albums rated in this year (with how it compares to last year); on a friend\u2019s page the songs tile appears once their copy has published it. Tap any score bar under the tiles to see how many ratings got that score, the albums and shows & films among them, and their covers, then See the albums takes you to the Albums tab filtered to exactly that score. Tap any bar in Albums rated per month to see that month: how many albums, their average, the best one and their covers, step to the previous or next month with the arrows, and See them in Albums opens the Albums tab on that month, newest first. The Albums tab\u2019s Filters panel has a new Exact score row (1 to 10, with counts). The Worker needs the new playback-sync.js (it takes it from GitHub on its own) to keep your song count for friends to see.'},
  {v:'2026.11.17-aj', note:'ONE ALBUM, ONE RATING: an album made by several artists (like An Evening With Silk Sonic on Bruno Mars and Silk Sonic) now counts once in your album total, averages, score bars, record and Albums wall, and lists every artist on it (Bruno Mars, Anderson .Paak, Silk Sonic) instead of showing up once per artist. It is published once now, and a friend whose copy still sends one row per artist is merged the same way, so the counts match either way. Taste match still lines up albums whichever of the artists you each have. EVEN FADE-IN: the cover wall, list and the big record used to fade in one by one and then the rest all at once after about the 15th to 70th; every cover now fades in at the same steady pace, whatever the count. POP-OUT COVERS: tap an album on the big record and it lifts off the groove and grows into the middle, showing a big cover, the title, every artist, the exact score as a bar and the day you rated it. Tap anywhere or press Escape to put it back. The Worker needs the new playback-sync.js (it takes it from GitHub on its own) so a list of several artists is not cut short.'},
  {v:'2026.11.17-ai', note:'ACCOUNT PAGE SECTIONS AND A BETTER ALBUMS VIEW: your Account page (and a friend\u2019s page) now has three tabs under the top card: Overview, Albums and Shows & films, so the page is no longer one very long list. OVERVIEW keeps the stat tiles, the score bars and the big rated-albums record and adds three cards: Scoring habits (your most common score, how many perfect 10s, and the share rated 8 or higher), Albums rated per month (a bar for every month since your first dated rating, with your busiest month and how many months you rated something) and Top artists (your five highest-averaging artists with two or more albums). ALBUMS is a wall of covers with the exact rating on each one (on a friend\u2019s page your own rating sits in the corner of the albums you both rated). Sort by Highest, Lowest, Newest rated, Oldest rated or A\u2013Z; the Filters button opens a score filter (10, 9+, 8+, 7+, Under 7) and a Year rated filter, and picking a year shows twelve month tiles you can tap to see just that month, with the albums grouped under month headings (the count and average for each month) whenever you sort by date. A switch beside Filters flips between the cover wall and the old list. Shows & films keeps the list with the same sorting and filters. The wall, the month tiles and the new cards all animate in. Nothing about what is published changed, so this works on friends\u2019 pages straight away.'},
  {v:'2026.11.17-ah', note:'RATED DATES ON ACCOUNT PAGES: every album, show and film on your Account page (and on a friend\u2019s page) now says the day it was rated, under the title (Rated Nov 14, 2026). The dates come from the days already on your ratings and are published with them, so a friend only sees them if you accept each other and sharing is on. Nobody can change them: only your own signed-in account can save your published ratings, and the private rating-dates list itself stays on your Worker, readable only with your sync key or owner login, with no way for anyone to write to it. The Worker needs the new playback-sync.js (it takes it from GitHub on its own).'},
  {v:'2026.11.17-ag', note:'THE RATED-ALBUMS RECORD: your Account page (and a friend\u2019s page) now has a big vinyl under the stats with every album rated, each one a cover on a single spiral groove: the highest rated sit on the outer edge and it winds in to the lowest at the label. Hover a cover (or tap it on a phone) to read its title, artist and rating on the label, and tap again to keep it there. The record turns slowly, stops when you point at it, and pops in cover by cover when the page opens. A brighter ring means a higher rating. Deluxe editions rated on their own are not drawn, matching the albums count.'},
  {v:'2026.11.17-af', note:'FIX: DELUXE EDITIONS WITH A ROMAN NUMERAL TITLE NOW FOLD IN: Skate Story: Vol. I and its Deluxe Edition (titled Vol. 1) stayed as two separate albums because Playback read I and 1 as different words. Vol., Part, Chapter, Book, Act and Episode followed by a Roman numeral now count as the number when titles are compared. The tracklist check is unchanged: the deluxe still has to carry nearly all of the standard album\u2019s songs and add more, so a different album with a similar name stays separate. Tap Check for new releases on the artist to apply it; the rating on the stand-alone deluxe moves to your deluxe rating and its song checks move onto the album.'},
  {v:'2026.11.17-ae', note:'FRIENDS AS A SHEET: the Friends button now slides a sheet up over whatever you are on (music, screen, collection) instead of replacing the page. Close it with the X, by tapping outside it, or with Escape, and you are exactly where you were, so your artists and the tab bar stay put. Opening a friend from it still works, and its back button reopens the sheet.'},
  {v:'2026.11.17-ad', note:'OWNER: PEOPLE USING PLAYBACK. In your Settings, a new People using Playback card lists everyone who has made an account: name, when they joined, when they last opened Playback, how many things they rated, how many friends they have, and whether their log is synced or their page is private. Load users reads it from your Worker (it takes the new playback-sync.js from GitHub on its own), and only you can see it. It never shows anyone\u2019s ratings. FRIENDS PAGE FIX: the Friends page could come out wider than a phone screen, pushing the account icon and tab bar off the right edge; pages are now held to the screen width and rows wrap instead.'},
  {v:'2026.11.17-ac', note:'FRIENDS ONE TAP AWAY: once you are signed in, a Friends button (two people) sits in the top bar next to your account icon. It opens a Friends page with just the list: requests waiting for you first, then your friends (tap a name to open their page, and the back button returns to the list), then your friend code and the add-by-code box. A small number on the button shows how many requests are waiting. The list also lives on your Account page as before.'},
  {v:'2026.11.17-ab', note:'PROBLEM REPORTS: if Playback crashes on a friend\u2019s phone, a small card slides in offering to send the error details to Skyler through the Suggest box (one tap, only after they press Send report). Network hiccups are not reported, and each error shows once. The owner does not see it. They read in Settings, Friend suggestions, starting with [auto].'},
  {v:'2026.11.17-aa', note:'MATCH FIX: friends could not open another person\u2019s page (\u201cCould not reach Playback\u2019s server\u201d) when that page had albums without a MusicBrainz id, which is most Spotify and Apple Music imports. The page now opens, taste match counts only things you both rated, and a drawing error is no longer reported as a connection problem.'},
];
const BUILD=CHANGELOG[0].v;

/* ---------- problem reports from friends ----------
   A crash anywhere (or a page that could not be drawn) shows a small card with one button that sends the details to
   Skyler through the Suggest box. Nothing is sent without the tap. Only friends see it; the owner has the console.
   Network failures are not reported (they are not bugs), each different error shows once, and at most three per visit. */
const ERX={seen:new Set(),n:0,el:null,rep:'',busy:false};
function pbErr(e,where){
  try{
    if(window.PB_OWNER)return;
    const msg=String((e&&e.message)||e||'').slice(0,160);
    if(!msg||/ResizeObserver|^Script error\.?$|Load failed|Failed to fetch|NetworkError|AbortError/i.test(msg))return;
    const st=String((e&&e.stack)||'').split('\n').slice(1,3).map(x=>x.trim().replace(/https?:\/\/[^\s)]*\//,'')).join(' | ');
    const key=msg+st;if(ERX.seen.has(key)||ERX.n>=3)return;ERX.seen.add(key);ERX.n++;
    let v='';try{v=UI.view||UI.tab||'main'}catch(x){v='boot'}
    const ua=(navigator.userAgent.match(/(iPhone|iPad|Android|Macintosh|Windows|Linux)[^;)]*/)||[''])[0];
    ERX.rep=('[auto] '+BUILD+' · '+(where||'page')+' · '+v+' · '+msg+(st?' · '+st:'')+(ua?' · '+ua:'')).slice(0,600);
    pbErrShow('ask');
  }catch(x){}
}
function pbErrShow(mode){
  try{
    let el=ERX.el;
    if(!el||!el.isConnected){el=ERX.el=document.createElement('div');el.className='pberr';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el);el.addEventListener('click',pbErrClick)}
    el.innerHTML=mode==='ask'?`<p>Something went wrong on this page.<small>Sending a report tells Skyler what broke, with your name.</small></p><div class="pbb"><button class="btn primary" data-pe="send">Send report</button><button class="btn" data-pe="no">Not now</button></div>`
      :mode==='busy'?`<p>Sending…</p>`
      :mode==='ok'?`<p>Sent. Thanks, that helps.</p>`
      :`<p>That did not send. Check your connection.</p><div class="pbb"><button class="btn primary" data-pe="send">Try again</button><button class="btn" data-pe="no">Dismiss</button></div>`;
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
  }catch(x){}
}
function pbErrHide(){const el=ERX.el;if(!el)return;el.classList.remove('in');setTimeout(()=>{if(!el.classList.contains('in'))el.remove()},350)}
async function pbErrClick(ev){
  const b=ev.target.closest&&ev.target.closest('[data-pe]');if(!b)return;
  if(b.dataset.pe==='no'){pbErrHide();return}
  if(ERX.busy)return;ERX.busy=true;pbErrShow('busy');
  try{
    let name='';try{name=(ACC&&ACC.me&&ACC.me.name)||''}catch(x){}
    const r=await fetch(SUG_URL+'/suggest',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name.slice(0,40),text:ERX.rep})});
    if(!r.ok)throw 0;
    pbErrShow('ok');setTimeout(pbErrHide,1800);
  }catch(x){pbErrShow('fail')}
  ERX.busy=false;
}
window.addEventListener('error',ev=>pbErr(ev.error||ev.message,'page'));
window.addEventListener('unhandledrejection',ev=>pbErr(ev.reason,'page'));
const KEY='playback_v1';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sid(...p){const s=p.join('|').toLowerCase();let x=5381;for(let i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))>>>0;return 'i'+x.toString(36)}
/* ---------- saving on this device ----------
   The log lives in IndexedDB, which holds hundreds of MB. localStorage (about
   5 MB per site, tightest on iPhone) keeps a quick-start copy only while the
   log is small; once it grows past LS_MAX characters, or localStorage refuses
   it, that copy is removed so a stale one can never load. If a save fails
   everywhere, a banner says so instead of failing silently. A missing
   localStorage copy at startup means: wait for IndexedDB before showing the
   log (READY), and never save until then. */
let READY=false;
const LS_MAX=1500000;
const blank=()=>({v:1,music:[],screen:[],marks:{},flags:{}});
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1){READY=true;return o}}}catch(e){}return blank()}
const IDB=(()=>{let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('no IndexedDB'));
    const r=indexedDB.open('playback',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
  }).catch(e=>{p=null;throw e}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('kv',mode),q=fn(t.objectStore('kv'));let out;
    q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error||new Error('aborted'));
  }));
  return{get:k=>run('readonly',s=>s.get(k)),put:(k,v)=>run('readwrite',s=>s.put(v,k))};
})();
const SV={idb:null,ls:false,err:false,bytes:0};   /* idb: true saved / false failed / null not tried */
let idbNext=null,idbBusy=false;
function idbSave(txt){
  idbNext=txt;if(idbBusy)return;idbBusy=true;
  (function step(){const t=idbNext;idbNext=null;
    IDB.put(KEY,t).then(()=>{SV.idb=true},()=>{SV.idb=false}).finally(()=>{saveState();if(idbNext!==null)step();else idbBusy=false})})();
}
function saveState(){const err=SV.idb===false&&!SV.ls;if(err!==SV.err){SV.err=err;if(READY)render()}}
/* A rating means you've heard/watched it, so anything with a rating is always

  if(S.rymSeen&&S.rymSeen[g.id]!=null&&S.rymSeen[tg.id]==null)S.rymSeen[tg.id]=S.rymSeen[g.id];
  if(!rating(dxId(tg))&&rating(dxId(g)))S.marks[dxId(tg)]={...(S.marks[dxId(tg)]||{}),r:rating(dxId(g)),...rdCarry(dxId(g))};
  unmark(dxId(g),dxId(tg));

/* "3 min ago", "2 h ago", "5 days ago" */
function stAgo(sec){
  const s=Math.max(0,Math.floor(Date.now()/1000)-sec);
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+' min ago';
  if(s<86400){const h=Math.floor(s/3600);return h+' h ago'}
  if(s<14*86400){const n=Math.floor(s/86400);return n+(n===1?' day':' days')+' ago'}
  if(s<60*86400){const n=Math.floor(s/604800);return n+' weeks ago'}
  if(s<730*86400){const n=Math.floor(s/2629800);return n+' months ago'}
  return Math.floor(s/31557600)+' years ago';
}

  const inc=a.groups.filter(g=>g.src==='mb').map(g=>({rgid:g.mbid,title:g.title,year:g.year,kind:g.kind,img:g.img||'',...(g.dxImg?{dxImg:g.dxImg}:{}),...(g.dxTitle?{dxTitle:g.dxTitle}:{}),...(g.w&&g.w.length?{w:g.w}:{}),items:g.items.map(i=>({k:mbItemKey(i),title:i.title,...(i.f&&i.f.length?{f:i.f}:{}),...(i.dx?{dx:1}:{})}))}));
  mbMerge({id:a.mbid,name:a.name},inc,a.mbVersions,true);
}
function mbReportText(r){
  const names={'Studio album':['studio album','studio albums'],'EP':['EP','EPs'],'Single':['single','singles'],'Compilation':['compilation','compilations'],'Live':['live release','live releases'],'Other':['other release','other releases']};
  const parts=MB_KIND_ORDER.filter(k=>r.kinds[k]).map(k=>r.kinds[k]+' '+names[k][r.kinds[k]===1?0:1]);
  let s=r.name+': '+parts.join(', ')+' · '+r.songs+' songs'+(r.added===r.songs?'.':'. '+r.added+' new, '+(r.songs-r.added)+' were already in your log with their checkmarks and ratings.');
  const where='on '+SRC_NAME[r.src||'mb'];
  if(r.src==='sp'||r.src==='am')s=r.name+' (tracklists from '+SRC_NAME[r.src]+'): '+s.slice(r.name.length+2);
  if(r.kept)s+=' '+r.kept+' song'+(r.kept===1?'':'s')+' you had marked '+(r.kept===1?"isn't":"aren't")+' '+where+', so '+(r.kept===1?'it stays':'they stay')+' in “Kept from your earlier list”.';
  if(r.folded)s+=' '+r.folded+' song'+(r.folded===1?'':'s')+' you had marked '+(r.folded===1?'was':'were')+' listed under a slightly different title, so '+(r.folded===1?'it moved':'they moved')+' onto the matching song with '+(r.folded===1?'its':'their')+' checkmark and rating.';
  if(r.dropped)s+=' '+r.dropped+' unmarked song'+(r.dropped===1?' from the old list was':'s from the old list were')+' not '+(r.src==='sp'||r.src==='am'?where:'found')+' and removed.';
  return s;
}

/* ---- the flow ---- */
async function mbSearch(q){
  if(MBX.busy||MBX.searching)return;
  Object.assign(MBX,{q,err:'',report:'',results:null,pick:null,searching:true,errWhere:'side'});render();
  try{
    const lq=q.replace(/([+\-&|!(){}\[\]^"~*?:\\\/])/g,'\\$1');
    const j=await mbGet('artist',{query:lq,limit:8});
    const list=j.artists||[];if(!list.length)throw MBError('nomatch');
    MBX.results=list.map(x=>({id:x.id,name:x.name,dis:x.disambiguation||'',country:x.country||(x.area&&x.area.name)||'',type:x.type||'',aka:mbAkas(x),begin:String((x['life-span']&&x['life-span'].begin)||'').slice(0,4)}));
  }catch(e){MBX.err=mbMessage(e,q)}
  MBX.searching=false;MBX.cancel=false;render();
}
async function mbImport(art,where,forceMb,forceSrc){
  if(MBX.busy)return;
  const findExisting=()=>S.music.find(x=>x.mbid===art.id)||S.music.find(x=>x.id===sid('artist',art.name)&&!x.mbid)||S.music.find(x=>!x.mbid&&nArtist(x.name)===nArtist(art.name));
  let existing=findExisting();
  Object.assign(MBX,{busy:true,cancel:false,err:'',report:'',spFallback:null,where,errWhere:where,aid:existing?existing.id:null,name:art.name,step:'Asking MusicBrainz',n:0,of:0,note:''});render();
  const want=importSource(),pick=forceMb?'mb':(forceSrc||want);
  let phase='mb',hint=forceMb?' This one came from MusicBrainz because '+SRC_NAME[want==='mb'?'sp':want]+' was not available. Tap Rebuild from '+SRC_NAME[want==='mb'?'sp':want]+' later for its covers and exact tracklists.':forceSrc==='am'?' This one came from Apple Music because Spotify was not available. Tap Rebuild from Spotify later for Spotify\u2019s own tracklists and covers.':'';
  try{
    let groups=null,sp=null;
    if(!art.aka){try{art.aka=mbAkas(await mbGet('artist/'+art.id,{inc:'aliases'}))}catch(e){if(e.code==='cancel')throw e;art.aka=(existing&&existing.aka)||[]}}   /* his other names, so Spotify and your RYM list land on the same artist */
    akaRemember(art);existing=findExisting();
    if(pick==='sp'){
      phase='sp';
      try{const c=await spFetchCatalog(art,existing);
        MBX.step='Sorting out duplicates';mbProgress();
        groups=spBuild(c.albums,c.artist.id,MBX.versions);sp=c.artist;
        if(c.cached)hint+=' '+c.cached+' of '+c.albums.length+' tracklists came from copies saved on this device, so Spotify was only asked for '+(c.albums.length-c.cached)+'.';
        if(!groups.length){groups=null;sp=null;hint=' Spotify had no releases for this artist, so this came from MusicBrainz.'}}
      catch(e){if(e.code!=='nomatch')throw e;hint=' Could not find '+art.name+' on Spotify, so this came from MusicBrainz.'}
      phase='mb';
    }else if(pick==='am'){
      phase='am';
      try{const c=await amFetchCatalog(art,existing);
        MBX.step='Sorting out duplicates';mbProgress();
        groups=spBuild(c.albums,c.artist.id,MBX.versions);sp=c.artist;
        if(c.cached)hint+=' '+c.cached+' of '+c.albums.length+' tracklists came from copies saved on this device, so Apple Music was only asked for '+(c.albums.length-c.cached)+'.';
        if(!groups.length){groups=null;sp=null;hint=' Apple Music had no releases for this artist, so this came from MusicBrainz.'}}
      catch(e){if(e.code!=='nomatch')throw e;hint=' Could not find '+art.name+' on Apple Music, so this came from MusicBrainz.'}
      phase='mb';
      if(spCid()&&ownSync()&&(SY.wv||0)===3&&!(S.cfg&&S.cfg.importSrc))hint+=' Paste the updated sync Worker into Cloudflare to get tracklists straight from Spotify.';
    }
    if(!groups){
      const rels=await mbFetchCatalog(art.id);
      if(MBX.cancel)throw MBError('cancel');
      MBX.step='Sorting out duplicates';mbProgress();
      groups=mbBuild(rels,MBX.versions);
      if(!groups.length)throw MBError('empty');
    }
    const ex=findExisting();if(ex)undoTake(ex);                       /* so the import can be undone */
    const r=mbMerge(art,groups,MBX.versions,false,sp);
    mergeSameArtists();
    touch();
    UI.tab='music';UI.sel.music=r.aid;UI.filter='all';
    try{localStorage.setItem(KEY+'_tab','music')}catch(e){}
    Object.assign(MBX,{report:mbReportText(r)+hint,results:null,pick:null,q:'',errWhere:'sheet',aid:r.aid});
  }catch(e){MBX.err=phase==='sp'&&e.code!=='cancel'?spImportMessage(e):phase==='am'&&e.code!=='cancel'?amImportMessage(e):mbMessage(e,art.name);
    MBX.fbFrom=phase;MBX.spFallback=(phase==='sp'||phase==='am')&&['quota','limited','busy','network'].includes(e.code)?art:null}   /* offer the other source */
  finally{MBX.busy=false;MBX.cancel=false;render()}
  /* on a phone the sheet sits below the sidebar: bring the result into view */
  if(MBX.errWhere==='sheet'&&window.innerWidth<=760){const el=document.querySelector('.mbok,.sheet .mberr');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
}

/* ---------- Rate Your Music album ratings ----------
   RYM's export is one row per rated release (ratings already run 1-10). Each
   rating goes onto the matching album or EP here; anything not here yet waits in
   S.pendingR and fills in the moment that artist is imported. Matching is by
   artist and title, never by year: RYM often carries a reissue date. */
const RATEABLE=['Studio album','EP','Live','Compilation','Other'];
const RYX={err:'',report:null};
const decodeEnt=x=>{const t=document.createElement('textarea');t.innerHTML=x;return t.value};
const nrm=x=>decodeEnt(String(x)).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\$/g,'s').replace(/&/g,' and ').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
/* one artist who goes by two names: the left name is read as the right one (Ye is Kanye West) everywhere
   artists are matched (RYM imports, Spotify plays, imports), so they never split in two */
const ARTIST_SAME={'ye':'kanye west'};
const ARTIST_SHOW={'kanye west':'Kanye West'};   /* the name it is shown under, whichever name an import brings */
/* ARTIST_SAME is the short fixed list; AKA is built from every artist's own "also known as" names
   (MusicBrainz aliases, the name Spotify uses), so any artist who goes by two names is one artist */
let AKA={};
const akaKey=x=>nrm(x).replace(/^the /,'');
const nArtist=x=>{const n=akaKey(x);return ARTIST_SAME[n]||AKA[n]||n};
function rebuildAka(){
  const m={},own=new Map();
  for(const a of S.music){const k=ARTIST_SAME[akaKey(a.name)]||akaKey(a.name);if(!own.has(k))own.set(k,new Set());own.get(k).add(a.mbid||'')}
  for(const a of S.music){
    if(!Array.isArray(a.aka)||!a.aka.length)continue;
    const home=ARTIST_SAME[akaKey(a.name)]||akaKey(a.name);
    for(const n of a.aka){
      for(const k of [akaKey(n),akaKey(a.name+' '+n),akaKey(n+' '+a.name)]){   /* "공중도둑 (Mid-Air Thief)" reads as him too */
        if(!k||k===home||ARTIST_SAME[k])continue;
        const o=own.get(k);if(o&&[...o].some(id=>id&&id!==a.mbid))continue;   /* a different MusicBrainz artist with that very name is someone else */
        m[k]=home}}
  }
  AKA=m;
}
/* the other names MusicBrainz lists for an artist (search results and lookups both carry them) */
function mbAkas(x){
  const out=[],seen=new Set([akaKey(x.name||'')]);
  for(const al of (x.aliases||[])){const n=al&&al.name;if(!n)continue;const k=akaKey(n);if(!k||seen.has(k))continue;seen.add(k);out.push(n)}
  return out.slice(0,12);
}
/* an artist's saved "also known as" list: MusicBrainz aliases, the Spotify name, and any earlier name */
function akaSet(a,art,sp,prev){
  const names=[art&&art.name,...((art&&art.aka)||[]),sp&&sp.name,prev,...(a.aka||[])].filter(Boolean);
  const seen=new Set([akaKey(a.name)]),out=[];
  for(const n of names){const k=akaKey(n);if(!k||seen.has(k))continue;seen.add(k);out.push(n)}
  a.aka=out.slice(0,12);
}
/* during an import, before the artist is saved, so Spotify's name already matches */
function akaRemember(art){const h=akaKey(art.name);for(const n of (art.aka||[])){const k=akaKey(n);if(k&&k!==h&&!ARTIST_SAME[k]&&!AKA[k])AKA[k]=ARTIST_SAME[h]||h}}
let akaBusy=false;
/* artists imported before this build have no alias list yet: fetch them quietly, one a second */
async function akaBackfill(){
  if(akaBusy||MBX.busy||MBX.searching||navigator.onLine===false)return;
  const todo=S.music.filter(a=>a.mbid&&a.akaAt==null);if(!todo.length)return;
  akaBusy=true;let n=0;
  try{for(const a of todo){
    if(MBX.busy||MBX.searching)break;
    const j=await mbGet('artist/'+a.mbid,{inc:'aliases'});
    akaSet(a,{name:a.name,aka:mbAkas(j)});a.akaAt=Date.now();n++}}
  catch(e){}
  finally{akaBusy=false}
  if(n){rebuildAka();mergeSameArtists();touch();render()}
}
const nTitle=x=>nrm(String(x).replace(/\s*[\(\[][^)\]]*(deluxe|remaster|edition|version|anniversary|expanded)[^)\]]*[\)\]]/ig,''));
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function rymEntries(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('shape');
  const H=rows[0].map(h=>h.trim().toLowerCase()),ix=n=>H.indexOf(n);
  if(['title','rating','last name'].some(n=>ix(n)<0))throw new Error('shape');
  const get=(r,n)=>ix(n)<0?'':String(r[ix(n)]||'').trim();
  const by=new Map();let zero=0;
  for(const r of rows.slice(1)){
    const title=decodeEnt(get(r,'title')),rate=parseFloat(get(r,'rating'));
    if(!title)continue;
    if(!(rate>0)){zero++;continue}
    const prim=decodeEnt([get(r,'first name'),get(r,'last name')].filter(Boolean).join(' ')),br=prim.match(/\[(.+)\]\s*$/);
    const fl=get(r,'first name localized'),ll=get(r,'last name localized');
    const display=br?br[1]:prim;
    const names=[...new Set([display,prim,fl&&ll?fl+' '+ll:'',fl&&ll?ll+' '+fl:'',ll].filter(Boolean).map(nArtist))];
    const key=nArtist(display)+'|'+nTitle(title),yr=parseInt(get(r,'release_date'))||9999;
    const e={key,a:display,t:title,r:Math.min(10,rate),n:names,yr};
    const o=by.get(key);if(!o)by.set(key,{...e,dups:[]});
    else{const keep=e.yr<o.yr?e:o,drop=keep===e?o:e;
      by.set(key,{...keep,dups:[...o.dups,...(drop.r!==keep.r?[drop.r]:[])]})}
  }
  return{list:[...by.values()],zero};
}
const pendingFor=a=>{const k=nArtist(a.name);return Object.entries(S.pendingR||{}).filter(([,p])=>p.n.includes(k))};
function rymGroup(a,tk){return a.groups.find(g=>RATEABLE.includes(g.kind)&&nTitle(g.title)===tk)}
/* ratings that were waiting for this artist's albums land on them now */
function applyPending(a){
  let n=0;
  for(const [key,p] of pendingFor(a)){
    const g=rymGroup(a,key.split('|')[1]);if(!g)continue;
    if(!rating(g.id)){S.marks[g.id]={...(S.marks[g.id]||{}),r:p.r};n++}
    rymNote(g.id,p.r);delete S.pendingR[key];
  }
  return n;
}
/* artists you do not have yet come in with just the albums you rated (no songs
   until you pull the tracklist from MusicBrainz); their ratings go straight on */
function rymAddWaiting(){
  const out={artists:0,albums:0},made=new Map();
  for(const [key,p] of Object.entries(S.pendingR||{})){
    const k=nArtist(p.a);let a=made.get(k);
    if(!a){if(S.music.some(x=>p.n.includes(nArtist(x.name))))continue;
      a={id:sid('artist',p.a),name:p.a,groups:[]};made.set(k,a)}
    const g={id:sid(a.id,p.t),title:p.t,year:p.y&&p.y<9999?String(p.y):'—',kind:'Studio album',items:[]};
    if(a.groups.some(x=>x.id===g.id))continue;
    a.groups.push(g);S.marks[g.id]={...(S.marks[g.id]||{}),r:p.r};rymNote(g.id,p.r);delete S.pendingR[key];out.albums++;
  }
  [...made.values()].sort((x,y)=>x.name.localeCompare(y.name)).forEach(a=>{a.groups.sort((x,y)=>(x.year>y.year)-(x.year<y.year));S.music.push(a);out.artists++});
  return out;
}
const rymMissing=()=>Object.values(S.pendingR||{}).filter(p=>!S.music.some(x=>p.n.includes(nArtist(x.name)))).length;
function rymImport(text){
  RYX.err='';RYX.report=null;
  try{
    const {list,zero}=rymEntries(text);
    S.pendingR=S.pendingR||{};
    const rp={total:list.length,zero,filled:0,same:0,kept:[],waiting:[],notFound:[],dups:[]};
    for(const e of list){
      if(e.dups.length)rp.dups.push(e.a+' – '+e.t+': kept '+fmt(e.r)+' (also '+e.dups.map(fmt).join(', ')+')');
      const a=S.music.find(x=>e.n.includes(nArtist(x.name)));
      const g=a&&rymGroup(a,e.key.split('|')[1]);
      if(g){
        const cur=rating(g.id);delete S.pendingR[e.key];rymNote(g.id,e.r);
        if(!cur){S.marks[g.id]={...(S.marks[g.id]||{}),r:e.r};rp.filled++}
        else if(cur===e.r)rp.same++;
        else rp.kept.push(e.a+' – '+e.t+': you have '+fmt(cur)+' here, RYM says '+fmt(e.r));
      }else{
        S.pendingR[e.key]={a:e.a,t:e.t,r:e.r,n:e.n,y:e.yr};
        (a?rp.notFound:rp.waiting).push(e);
      }
    }
    rp.added=rymAddWaiting();
    mergeSameArtists();
    RYX.report=rp;touch();
  }catch(err){
    RYX.err=err.message==='shape'?'That does not look like a Rate Your Music export (it needs Title, Rating and name columns). Nothing was changed.':'Could not read that file. Nothing was changed.';
  }
  render();
}
function rymReport(){
  const r=RYX.report,cnt=(n,w)=>n+' '+w+(n===1?'':'s');
  const byArtist=l=>{const m={};l.forEach(e=>m[e.a]=(m[e.a]||0)+1);return Object.entries(m).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0])).map(([k,v])=>esc(k)+' ('+v+')').join(', ')};
  let h=`<div class="mbok rymrep" role="status"><span><b>${cnt(r.total,'rated album')}</b> in your file. ${r.filled} filled in now${r.same?', '+r.same+' already matched':''}.</span>`;
  if(r.added&&r.added.artists)h+=`<span>Added <b>${cnt(r.added.artists,'new artist')}</b> with just the ${cnt(r.added.albums,'album')} you rated. Open an artist and tap Find on MusicBrainz to fill in the songs; your ratings stay.</span><details><summary>Which artists</summary><p class="note">${byArtist(r.waiting)}</p></details>`;
  if(r.notFound.length)h+=`<span>${r.notFound.length} are for artists you have, but I could not find the album under the same name.</span><details><summary>Which albums</summary><ul>${r.notFound.map(e=>'<li>'+esc(e.a+' – '+e.t)+'</li>').join('')}</ul></details>`;
  if(r.kept.length)h+=`<span>${cnt(r.kept.length,'rating')} here already differed, so I kept yours.</span><details><summary>Which</summary><ul>${r.kept.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`;
  if(r.dups.length)h+=`<details><summary>${cnt(r.dups.length,'album')} appeared twice in your file</summary><ul>${r.dups.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="note">I used the earliest release.</p></details>`;
  if(r.zero)h+=`<span class="note">${cnt(r.zero,'row')} had no rating (singles and the like) and were skipped.</span>`;
  return h+'</div>';
}
function rymSide(){

const cnt0=n=>n+' rating'+(n===1?'':'s');

/* ---------- the day you rated each album ----------
   The list (kept privately on your sync Worker under /rating-dates, no longer in this repo) gives the day you rated each album, read off your rating
   history: [{"d":"2024-08-03","t":"IGOR","s":5}, ...] where d is the day, t the album title as
   the history shows it and s its stars out of 5. Oldest first. Each album found here that you
   have rated gets that day (rd on its rating, the same day the banner shows). A day you already
   have is never replaced. The history has no artist names, so matching is by title; when two
   artists have an album with that title, the one rated the same as the history's stars x2 wins.
   A Deluxe listing lands on the deluxe rating when the album has one. */
const RDX={err:'',report:null,busy:false};
const rdDx=t=>/[\(\[][^)\]]*(deluxe|bonus|expanded)[^)\]]*[\)\]]/i.test(String(t));
function rdTargets(e,plain){   /* every album with this title, as the mark that holds its rating (twins count once) */
  const key=nTitle(e.t),dx=rdDx(e.t),stdOk=!dx||!plain.has(key),seen=new Set(),out=[];
  for(const a of S.music)for(const g of a.groups){
    if(!RATEABLE.includes(g.kind)||nTitle(g.title)!==key)continue;
    /* a Deluxe listing lands on the deluxe rating; it may fall back to the plain rating only when the history has no plain entry for this album, so the two never share a day */
    const ids=dx?(hasDx(g)?(stdOk?[dxId(g),g.id]:[dxId(g)]):(stdOk?[g.id]:[])):[g.id],
      id=ids.find(i=>rating(i))||'',ck=canonK(id||ids[0]||g.id);
    if(seen.has(ck))continue;seen.add(ck);
    out.push({a,g,id,r:id?rating(id):0});
  }
  return out;
}
function rdImport(list){
  RDX.err='';RDX.report=null;
  const today=todayISO(),rp={total:0,set:0,same:0,kept:[],differ:[],noRating:[],notFound:[],unsure:[],bad:0},picked=new Map();
  const plain=new Set(list.filter(x=>x&&x.t&&!rdDx(x.t)).map(x=>nTitle(x.t)));
  for(const e of list){
    if(!e||!e.t||!/^\d{4}-\d\d-\d\d$/.test(e.d||'')||e.d>today){rp.bad++;continue}
    rp.total++;
    const c=rdTargets(e,plain),rated=c.filter(x=>x.id),stars=(+e.s||0)*2;
    if(!c.length){rp.notFound.push(e.t);continue}
    if(!rated.length){rp.noRating.push(e.t);continue}
    let pick=null;
    if(rated.length===1)pick=rated[0];
    else{const m=rated.filter(x=>x.r===stars);if(m.length===1)pick=m[0]}
    if(!pick){rp.unsure.push(e.t+' ('+rated.map(x=>x.a.name).join(' / ')+')');continue}
    picked.set(canonK(pick.id),{pick,e});   /* rated again later in the history: the later entry wins, like rating again here */
  }
  for(const {pick,e} of picked.values()){
    const cur=ratedDate(pick.id),stars=(+e.s||0)*2;
    if(!cur){S.marks[pick.id]={...S.marks[pick.id],rd:e.d};lsFromMark(pick.id);rp.set++}
    else if(cur===e.d)rp.same++;
    else rp.kept.push(e.t+': you have '+fmtRd(cur)+', the history says '+fmtRd(e.d));
    if(stars&&pick.r!==stars)rp.differ.push(e.t+': '+fmt(pick.r)+' here, '+fmt(stars)+' in the history');
  }
  if(!rp.total&&rp.bad){RDX.err='Nothing in the list could be read. Nothing was changed.';render();return}
  RDX.report=rp;if(rp.set)touch();
  render();
}
async function rdRun(){
  if(RDX.busy)return;
  RDX.busy=true;RDX.err='';RDX.report=null;render();
  try{
    if(!ownSync()){RDX.busy=false;RDX.err='Connect your sync Worker first (Settings, Sync). Your rating days are kept on it, not in the public app. Nothing was changed.';render();return}
    const r=await fetch(SY.url.replace(/\/+$/,'')+'/rating-dates',{cache:'no-store',headers:{...syH()}});
    if(!r.ok)throw new Error('http');
    const list=await r.json();
    if(!Array.isArray(list))throw new Error('shape');
    RDX.busy=false;rdImport(list);
  }catch(err){
    RDX.busy=false;RDX.err='Could not load the rating dates list. Check your connection and try again. Nothing was changed.';render();
  }
}
function rdReport(){
  const r=RDX.report,cnt=(n,w)=>n+' '+w+(n===1?'':'s'),li=l=>'<ul>'+l.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  let h=`<div class="mbok rymrep rdrep" role="status"><span><b>${cnt(r.total,'rating')}</b> in your history. <b>${r.set}</b> got a day now${r.same?', '+r.same+' already had it':''}.</span>`;
  if(r.kept.length)h+=`<span>${cnt(r.kept.length,'album')} already had a different day, so I kept yours.</span><details><summary>Which</summary>${li(r.kept)}</details>`;
  if(r.differ.length)h+=`<span>${cnt(r.differ.length,'album')} got a day, but your rating here is not the one in the history.</span><details><summary>Which</summary>${li(r.differ)}<p class="note">Worth a glance in case the wrong album matched.</p></details>`;
  if(r.noRating.length)h+=`<span>${cnt(r.noRating.length,'album')} ${r.noRating.length===1?'has':'have'} no rating here yet, so there was nothing to date.</span><details><summary>Which</summary>${li(r.noRating)}</details>`;
  if(r.notFound.length)h+=`<span>${cnt(r.notFound.length,'album')} ${r.notFound.length===1?'is':'are'} not in Playback yet.</span><details><summary>Which</summary>${li(r.notFound)}<p class="note">Import that artist, then tap Import rating dates again.</p></details>`;
  if(r.unsure.length)h+=`<span>${cnt(r.unsure.length,'album')} matched more than one artist, so I left ${r.unsure.length===1?'it':'them'} alone.</span><details><summary>Which</summary>${li(r.unsure)}<p class="note">Set the day by hand from the ⋯ menu under the album.</p></details>`;
  if(r.bad)h+=`<span class="note">${cnt(r.bad,'row')} in the list could not be read and ${r.bad===1?'was':'were'} skipped.</span>`;
  return h+'</div>';
}
function rdSide(){
  let h=`<div class="add"><span class="label">Add the days you rated your albums</span>
    <p class="note">Playback keeps the day you rated each album (Rated Nov 14, 2026 on its banner). This adds that day to the albums you rated earlier, from your rating history. A day you already have is never replaced and no rating changes. Tap it again after adding artists or when a new batch is added.</p>
    <div><button class="btn primary rdgo" data-act="rdimp"${RDX.busy?' disabled':''}>${RDX.busy?'<i class="rdspin" aria-hidden="true"></i>Reading…':'Import rating dates'}</button></div>`;
  if(RDX.err)h+=`<p class="mberr" role="alert">${esc(RDX.err)}</p>`;

}

/* ---------- Rate Your Music song ratings ----------
   RYM's CSV export has no song ratings, so a small Tampermonkey script
   (rym-helper.user.js in this repo) reads them off the album pages you open on
   RYM and queues them. It hands the queue over with postMessage; anything that
   lands goes back as "done" and leaves the queue, the rest waits for that artist
   or album to be here. A song rating you already set is never overwritten. */
const RTX={bridge:false,queue:[],report:null};
const HELPER_URL='https://frostie4life9.github.io/playback/rym-helper.user.js';
const rtClean=x=>{                        /* the queue comes from outside the app: check every field */
  if(!x||typeof x!=='object'||typeof x.url!=='string'||!/^https:\/\/rateyourmusic\.com\/release\//.test(x.url))return null;
  const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';
  const artists=(Array.isArray(x.artists)?x.artists:[]).map(a=>str(a,200)).filter(Boolean).slice(0,10);
  const tracks=(Array.isArray(x.tracks)?x.tracks:[]).map(t=>({t:str(t&&t.t,300),r:Math.round(Math.min(10,Math.max(0,+(t&&t.r)||0))*2)/2})).filter(t=>t.t&&t.r>0).slice(0,200);
  const title=str(x.title,300);
  if(!title||!artists.length||!tracks.length)return null;
  return{url:x.url,title,artists,tracks,tracklist:(Array.isArray(x.tracklist)?x.tracklist:[]).map(t=>str(t,300)).filter(Boolean).slice(0,200)};
};
window.addEventListener('message',e=>{
  if(e.source!==window||e.origin!==location.origin)return;
  const d=e.data;if(!d||d.src!=='rym-bridge'||d.type!=='queue'||!Array.isArray(d.items))return;
  RTX.bridge=true;RTX.queue=d.items.map(rtClean).filter(Boolean);
  if(UI.tab==='music')render();
});
const rtAsk=()=>window.postMessage({src:'playback',type:'ask'},location.origin);
setTimeout(rtAsk,300);setTimeout(rtAsk,2000);           /* the helper loads after the page */
function rtArtist(names){const ns=names.map(nArtist);return S.music.find(x=>ns.includes(nArtist(x.name)))}
function rtGroup(a,title){const k=nTitle(title),hits=a.groups.filter(g=>nTitle(g.title)===k);return hits.find(g=>RATEABLE.includes(g.kind))||hits[0]}
function rtImport(){
  const rp={albums:0,filled:0,same:0,kept:[],missing:[],songs:[],made:0,loose:[]},done=[];
  for(const e of RTX.queue){
    const a=rtArtist(e.artists),g=a&&rtGroup(a,e.title);
    if(!g){rp.missing.push(e.artists[0]+' – '+e.title+(a?' (album not found under '+a.name+')':' (artist not here yet)'));continue}
    /* an album that came in from the CSV has no songs yet: give it RYM's tracklist,
       with the same song IDs a later MusicBrainz import uses, so nothing doubles */
    if(!g.items.length){
      const seen=new Map();a.groups.forEach(x=>x.items.forEach(i=>seen.set(mbItemKey(i),i.id)));
      for(const t of (e.tracklist.length?e.tracklist:e.tracks.map(x=>x.t))){const k=mbKeyOf(t);if(!k||seen.has(k))continue;
        const id=sid(a.id,'song',k);seen.set(k,id);g.items.push({id,title:t,k});rp.made++}
    }
    const byKey=new Map();g.items.forEach(i=>byKey.set(mbItemKey(i),i));
    const other=new Map();a.groups.forEach(x=>x.items.forEach(i=>{const k=mbItemKey(i);if(!other.has(k))other.set(k,i)}));
    for(const t of e.tracks){
      let i=byKey.get(mbKeyOf(t.t))||other.get(mbKeyOf(t.t));
      if(!i){   /* no exact match: the one song on this album (or else this artist) with the same title minus a bracketed subtitle */
        i=mbLooseFind(g.items,t.t)||mbLooseFind(artistItems(a),t.t);
        if(i)rp.loose.push(t.t+' → '+i.title)}
      if(!i){rp.songs.push(e.artists[0]+' – '+e.title+': '+t.t);continue}
      const cur=rating(i.id);rymNote(i.id,t.r);
      if(!cur){S.marks[i.id]={...(S.marks[i.id]||{}),r:t.r};rp.filled++}
      else if(cur===t.r)rp.same++;
      else rp.kept.push(i.title+': you have '+fmt(cur)+' here, RYM says '+fmt(t.r));
    }
    rp.albums++;done.push(e.url);
  }
  RTX.report=rp;
  if(done.length){RTX.queue=RTX.queue.filter(e=>!done.includes(e.url));window.postMessage({src:'playback',type:'done',urls:done},location.origin);touch()}
}
function rtSide(){
  const cnt=(n,w)=>n+' '+w+(n===1?'':'s');
  let h=`<div class="add"><span class="label">Song ratings from Rate Your Music</span>`;
  if(!RTX.bridge)h+=`<p class="note">RYM's file has no song ratings. On a computer, install the Playback RYM helper in Tampermonkey, then open your album pages on RYM; each one you open is saved for here. It never loads pages on its own.</p>
    <div><a class="btn" href="${HELPER_URL}" target="_blank" rel="noopener">Install the helper</a></div>`;
  else if(!RTX.queue.length)h+=`<p class="note">The helper is on. Open your album pages on RYM, 10 to 15 tabs at a time, and they will wait here.</p>`;
  else{const n=RTX.queue.reduce((x,e)=>x+e.tracks.length,0);
    h+=`<p class="note">${cnt(RTX.queue.length,'album')} waiting, ${cnt(n,'song rating')}.</p><div><button class="btn primary" data-act="rtimport">Import song ratings</button></div>`}
  const r=RTX.report;
  if(r){h+=`<div class="mbok rymrep" role="status"><span><b>${r.filled} song rating${r.filled===1?'':'s'}</b> filled in across ${cnt(r.albums,'album')}${r.same?', '+r.same+' already matched':''}.</span>`;
    if(r.made)h+=`<span>${cnt(r.made,'song')} added from RYM's tracklists to albums that had none yet.</span>`;
    if(r.kept.length)h+=`<details><summary>${cnt(r.kept.length,'rating')} differed, so I kept yours</summary><ul>${r.kept.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`;
    if(r.loose&&r.loose.length)h+=`<details><summary>${cnt(r.loose.length,'song')} matched on a slightly different title</summary><ul>${r.loose.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="note">RYM's title is on the left, the song here on the right.</p></details>`;
    if(r.songs.length)h+=`<details><summary>${cnt(r.songs.length,'song')} not found on the album here</summary><ul>${r.songs.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`;
    if(r.missing.length)h+=`<details><summary>${cnt(r.missing.length,'album')} still waiting</summary><ul>${r.missing.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="note">Import that artist (or the RYM file) and tap Import again.</p></details>`;
    h+='</div>'}
  return h+'</div>';
}

/* ---------- Export your ratings ----------
   Spreadsheets (CSV) of everything you rated, plus a "Not yet in Rate Your Music"
   list, since RYM has no import and those are the ones you type in by hand.
   S.rymSeen remembers the rating RYM had for each album and song the last time it
   came from RYM (the RYM file or the song-ratings helper). Anything rated here that
   was never there, or differs from it, is "not yet in RYM". S.flags.rymBase is set
   once you tell Playback the ratings it already has are on RYM. */
const EXP={open:false};
function rymNote(id,r){(S.rymSeen=S.rymSeen||{})[canonK(id)]=r}
const csvCell=(v,text)=>{let s=v==null?'':String(v);if(text&&/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const csvText=(head,rows)=>'﻿'+[head,...rows].map(r=>r.map(c=>csvCell(c,typeof c==='string')).join(',')).join('\r\n')+'\r\n';
function dlCSV(name,text){
  const day=new Date().toISOString().slice(0,10),url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name.replace('.csv','-'+day+'.csv');
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
const xYear=g=>/^\d{4}/.test(g.year||'')?String(g.year).slice(0,4):'';
const xArtists=()=>[...S.music].sort((x,y)=>x.name.localeCompare(y.name));
const xGroups=a=>[...a.groups].sort((x,y)=>(xYear(x)||'9999').localeCompare(xYear(y)||'9999')||x.title.localeCompare(y.title));
const r2=v=>Math.round(v*100)/100;
function csvAlbums(){
  const rows=[],once=new Set();
  for(const a of xArtists())for(const g of xGroups(a)){
    if(!RATEABLE.includes(g.kind)||once.has(canonK(g.id)))continue;once.add(canonK(g.id));
    const its=stdItems(g),r=rating(g.id),rs=its.map(i=>rating(i.id)).filter(Boolean);
    if(r||rs.length)rows.push([a.name,g.title,xYear(g),g.kind,r||'',rs.length?r2(rs.reduce((x,y)=>x+y,0)/rs.length):'',rs.length,its.length,reviewOf(g.id)]);
    if(hasDx(g)){const dr=rating(dxId(g)),drs=g.items.map(i=>rating(i.id)).filter(Boolean);   /* the deluxe edition, rated on its own */
      if(dr)rows.push([a.name,dxName(g),xYear(g),g.kind,dr,drs.length?r2(drs.reduce((x,y)=>x+y,0)/drs.length):'',drs.length,g.items.length,reviewOf(dxId(g))])}
  }
  return csvText(['Artist','Release','Year','Type','Album rating','Song average','Songs rated','Songs in list','Review'],rows);
}
function csvSongs(){
  const rows=[],seen=new Set();
  for(const a of xArtists())for(const g of xGroups(a))for(const i of g.items){
    const r=rating(i.id);if(!r||seen.has(canonK(i.id)))continue;seen.add(canonK(i.id));
    rows.push([a.name,g.title,xYear(g),g.kind,i.title,r]);
  }
  return csvText(['Artist','Release','Year','Type','Song','Rating'],rows);
}
function csvScreen(){
  const rows=[];
  for(const s of [...S.screen].sort((x,y)=>x.title.localeCompare(y.title))){
    const y=/^\d{4}/.test(s.year||'')?String(s.year).slice(0,4):'';
    if(s.type==='film'){if(rating(s.id))rows.push(['Film',s.title,y,'','',rating(s.id)]);continue}
    if(rating(s.id))rows.push(['Show',s.title,y,'','',rating(s.id)]);
    for(const se of s.seasons){
      const sr=rating(sid(s.id,'s',se.n));if(sr)rows.push(['Season',s.title,y,se.n,'',sr]);
      for(let e=1;e<=se.eps;e++){const er=rating(sid(s.id,'s',se.n,'e',e));if(er)rows.push(['Episode',s.title,y,se.n,e,er])}
    }
  }
  return csvText(['Type','Title','Year','Season','Episode','Rating'],rows);
}
function rymTodo(){
  const seen=S.rymSeen||{},out=[],done=new Set();
  const add=(a,g,i)=>{const id=canonK(i?i.id:g.id),r=rating(id);if(!r||seen[id]===r||done.has(id))return;done.add(id);
    out.push({a:a.name,rel:g.title,song:i?i.title:'',r,was:seen[id]||0})};
  for(const a of xArtists())for(const g of xGroups(a)){if(RATEABLE.includes(g.kind)){add(a,g,null);if(hasDx(g))add(a,{id:dxId(g),title:dxName(g)},null)}g.items.forEach(i=>add(a,g,i))}
  return out;
}
function rymMark(){

    for(const i of g.items)if(rating(i.id))S.rymSeen[canonK(i.id)]=rating(i.id);

}
const csvTodo=()=>csvText(['Artist','Release','Song','What','Your rating','On RYM now','Status'],

function expSide(){

/* ---------- Your numbers ----------
   Read-only summary of your ratings, worked out from the log each time the panel
   is open (nothing is stored). Album numbers use each release's standard tracklist;

const amRe=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* ---------- TMDB for the Screen tab ----------
   Search shows and films on The Movie Database and bring in the poster, year,
   seasons and episode counts. The TMDB key lives in the log (S.cfg.tmdb), so it
   reaches the other devices through the playback-sync Worker and never sits in
   this public repo.
   Episode IDs come from show ID + season + episode number, exactly like shows
   added by hand, so importing over a hand-added show keeps every checkmark.
   Only aired episodes are counted (an airing season would otherwise sit below
   100% for episodes that don't exist yet). "Check for new episodes", plus a
   quiet once-a-day check of shows still airing, adds them as they come out.
   Specials (season 0) stay out. An episode that is checked or rated is never

  if(/^eyJ/.test(key))h.authorization='Bearer '+key;else u.searchParams.set('api_key',key);   /* read access token or v3 key */
  let r;try{r=await fetch(u,{headers:h})}catch(e){throw TMError(navigator.onLine===false?'offline':'network')}
  if(r.status===401)throw TMError('badkey',401);

function tmMessage(e,q){
  switch(e.code){

    case 'badkey':return 'TMDB did not accept that key. Copy it again from themoviedb.org under Settings › API.';
    case 'offline':return 'You look offline. Try again once you are connected.';

    case 'busy':return 'TMDB is asking for a short break. Try again in a few seconds.';

const tmYear=d=>String(d||'').slice(0,4);
const tmDay=d=>{const t=new Date(d+'T12:00:00');return isNaN(t)?'':t.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})};

async function tmFetchShow(tid){

/* Where to watch. TMDB passes on JustWatch's list per country: stream (subscription),

/* Episode names, descriptions, air dates and runtimes. A long show is a lot of text,

/* the choice between this device and the synced log: show what each one holds so the

function logSum(o){let s=0,r=0;for(const a of (o&&o.music)||[])for(const g of a.groups||[])s+=(g.items||[]).length;
  const m=(o&&o.marks)||{};for(const k in m)if(m[k]&&m[k].r)r++;return{s,r,t:(o&&o.mtime)||0}}

    pl=(v,w)=>n(v)+' '+w+(v===1?'':'s'),

/* ---------- list for your morning brief ----------
   A Worker from 2026.11.05 on (x-pb-worker 5) keeps a tiny list of the next episode
   of each show you follow, so your morning brief can say what lands tonight. The app
   works it out and sends it after a sync; the Worker never opens your log. A show
   counts as followed once you have watched something, or when it is a premiere you
   added. "behind" means you still have episodes that are already out. */
let briefSig='';
function briefData(){
  const shows=[];
  for(const s of S.screen){
    if(s.type!=='show'||s.example||!s.next||!s.next.d)continue;
    const st=showStatus(s);
    if(!st.watched&&!(s.next.n===1&&s.next.e===1))continue;
    shows.push({t:s.title,n:s.next.n,e:s.next.e,d:s.next.d,behind:st.watched>0&&!st.done&&!st.caught});
  }
  shows.sort((a,b)=>a.d.localeCompare(b.d)||a.t.localeCompare(b.t));
  return{v:1,shows:shows.slice(0,100),rel:nrList().slice(0,20).map(x=>({a:x.a,t:x.t,d:x.d}))};
}
async function briefPush(){

   this device the search runs straight from this device instead. The token stays in this
   browser only (never in your log, never synced). Without one, or if the browser cannot reach
   Discogs, the search goes through your Worker as before. */
const DC_KEY='playback_discogs_token';
const dcToken=()=>{try{return localStorage.getItem(DC_KEY)||''}catch(e){return ''}};
function dcSetToken(t){try{t?localStorage.setItem(DC_KEY,t):localStorage.removeItem(DC_KEY)}catch(e){return false}return true}
async function dcDirect(p,tok){
  const q=new URLSearchParams({type:'release',format:'Vinyl',per_page:'30'});
  if(p.artist)q.set('artist',p.artist);if(p.title)q.set('release_title',p.title);if(p.barcode)q.set('barcode',p.barcode);if(p.catno)q.set('catno',p.catno);
  q.set('token',tok);
  const r=await fetch('https://api.discogs.com/database/search?'+q,{cache:'no-store'});
  let j={};try{j=await r.json()}catch(e){}
  return{status:r.status,j};
}
async function dcSearch(d){
  COL.q={artist:(d.artist||'').trim(),title:(d.title||'').trim(),code:(d.code||'').trim()};
  if(!COL.q.artist&&!COL.q.title&&!COL.q.code){COL.err='Type an artist, an album, or a barcode or catalog number.';render();return}
  const tok=dcToken();
  if(!tok&&!ownSync()){COL.err='Save a Discogs token on this device (under Discogs token below), or connect your sync Worker in Settings, to look up pressings. You can also add the record by hand.';render();return}
  const p={artist:COL.q.artist,title:COL.q.title,barcode:'',catno:''};
  if(COL.q.code){/^[\d\s-]{8,}$/.test(COL.q.code)?p.barcode=COL.q.code.replace(/[\s-]/g,''):p.catno=COL.q.code}
  if(tok){
    COL.busy=true;COL.err='';COL.res=null;render();
    try{
      const {status,j}=await dcDirect(p,tok);
      if(status===401)COL.err='Discogs did not accept the token saved on this device. Generate a new one under Discogs Settings, Developers and save it below.';
      else if(status===429)COL.err='Discogs asked for a pause (HTTP 429). That is your own limit of 60 a minute, so wait a minute and try again.';
      else if(status<200||status>=300)COL.err='Discogs could not run that search ('+status+'). Try again, or add the record by hand.';
      else{COL.res=dcSort((j.results||[]).map(dcParse).filter(x=>x.title));COL.busy=false;render();return}
      COL.busy=false;render();return;
    }catch(e){
      if(!ownSync()){COL.err='Could not reach Discogs from this browser. Check your connection and try again.';COL.busy=false;render();return}
      /* the browser could not reach Discogs: fall through to the Worker */
    }
  }
  const q=new URLSearchParams();
  if(COL.q.artist)q.set('artist',COL.q.artist);
  if(COL.q.title)q.set('title',COL.q.title);
  if(p.barcode)q.set('barcode',p.barcode);if(p.catno)q.set('catno',p.catno);
  COL.busy=true;COL.err='';COL.res=null;render();
  try{
    const r=await fetch(SY.url.replace(/\/+$/,'')+'/discogs?'+q,{cache:'no-store',headers:{...syH()}});
    const wv=+(r.headers.get('x-pb-worker')||0);if(r.ok&&wv>(SY.wv||0)){SY.wv=wv;saveSync()}
    let j={};try{j=await r.json()}catch(e){}
    if(r.status===401)COL.err='Your Worker did not accept the sync key. Re-enter it under Sync in Settings.';
    else if(r.status===404)COL.err='Your sync Worker does not have the Discogs lookup yet. It updates itself when this change deploys; if it still says this, paste worker/playback-sync.js into Cloudflare.';
    else if(j.error==='no discogs token')COL.err='Add your Discogs token to the Worker first: in Cloudflare open playback-sync, Settings, Variables and Secrets, add a Secret named DISCOGS_TOKEN. You can still add records by hand below.';
    else if(j.error==='discogs rejected the token')COL.err='Discogs did not accept the token saved on your Worker. Generate a new one and replace DISCOGS_TOKEN.';
    else if(r.status===429){const rl=j.ratelimit||{},bits=[rl.ratelimit&&'limit '+rl.ratelimit,rl['ratelimit-used']&&'used '+rl['ratelimit-used'],rl['ratelimit-remaining']&&'left '+rl['ratelimit-remaining'],j.via&&'from '+j.via,j.body&&'said: '+String(j.body).slice(0,120)].filter(Boolean);
      COL.err='Discogs turned the request away (HTTP 429) even after a retry'+(bits.length?' ('+bits.join(', ')+')':'')+'. Try again in a minute, or add the record by hand below.'}
    else if(!r.ok)COL.err='The lookup failed ('+r.status+'). Try again, or add the record by hand.';
    else COL.res=dcSort((j.results||[]).map(dcParse).filter(x=>x.title));
  }catch(e){COL.err='Could not reach your Worker. Check your connection and try again.'}
  COL.busy=false;render();
}

async function colLoadImgs(id){
  if(COL.imgs[id]!==undefined)return;COL.imgs[id]='loading';
  const done=v=>{COL.imgs[id]=v;document.querySelectorAll('[data-gal="'+id+'"]').forEach(el=>el.innerHTML=colGalHTML(id))};
  const pick=j=>(j.images||[]).map(i=>({uri:i.uri,uri150:i.uri150,type:i.type})).filter(i=>i.uri||i.uri150).sort((p,q)=>(p.type==='primary')-(q.type==='primary'));
  const tok=dcToken();
  try{
    if(tok){
      const r=await fetch('https://api.discogs.com/releases/'+(+id)+'?token='+encodeURIComponent(tok),{cache:'no-store'});
      if(r.ok){done(pick(await r.json()));return}
      if(r.status===401){done({err:'Discogs did not accept the token saved on this device, so the photos could not load.'});return}
      if(!ownSync()){done({err:'Discogs could not send the photos right now ('+r.status+'). Close and reopen the record to try again.'});return}
    }
    if(!ownSync()){done({err:'Save a Discogs token on this device (under Find a pressing) to see this pressing’s back cover, inner sleeves and labels.'});return}
    const r=await fetch(SY.url.replace(/\/+$/,'')+'/discogs/release?id='+(+id),{cache:'no-store',headers:{...syH()}});
    let j={};try{j=await r.json()}catch(e){}
    if(r.status===404)done({err:'Your sync Worker does not have the photo lookup yet. It updates itself from GitHub within a few minutes; or save a Discogs token on this device.'});
    else if(j.error==='no discogs token')done({err:'Add a Discogs token (on this device, or as DISCOGS_TOKEN on your Worker) to see the photos.'});
    else if(!r.ok)done({err:'The photo lookup failed ('+r.status+'). Close and reopen the record to try again.'});
    else done(pick(j));
  }catch(e){done({err:'Could not reach Discogs for the photos. Check your connection.'})}
}
/* Clean, labelled scans. Cover Art Archive tags each image (Front, Back, Medium = the disc
   label, Liner = the inner sleeve), unlike Discogs. MusicBrainz links many releases to their
   Discogs pressing, so the exact pressing is tried first; failing that, another vinyl release
   of the same album in your log. What is found is kept on the entry (x.scan), so it is looked
   up once; x.art holds the photos you picked yourself, and those win. */

const myPhoto=(x,k)=>!!(x.photos&&x.photos[k]&&x.photos[k].url);

  if(!r.ok)return null;const j=await r.json(),o={},img=i=>(i.thumbnails&&(i.thumbnails['1200']||i.thumbnails.large||i.thumbnails['500']))||i.image;

  if(of('Front')[0])o.front=img(of('Front')[0]);if(of('Back')[0])o.back=img(of('Back')[0]);

async function colFindScans(x){
  if(COL.scanBusy[x.id])return;COL.scanBusy[x.id]=1;viewRedraw();
  let out=null;
  try{
    if(x.discogs){try{const j=await mbGet('url',{resource:'https://www.discogs.com/release/'+(+x.discogs),inc:'release-rels'});
      const rel=(j.relations||[]).map(r=>r.release&&r.release.id).filter(Boolean);
      for(const id of rel.slice(0,2)){const o=await caaTyped(id);if(o){out=Object.assign(o,{mbid:id,exact:true});break}}}catch(e){}}
    const {g}=colMatch(x);
    if(!out&&g&&g.mbid&&!/^sp:/.test(g.mbid)){
      const j=await mbGet('release',{'release-group':g.mbid,inc:'media+labels',limit:'100'});
      const cat=String(x.catno||'').replace(/\W/g,'').toLowerCase();
      const L=(j.releases||[]).filter(r=>(r.media||[]).some(m=>/vinyl/i.test(m.format||''))&&r['cover-art-archive']&&r['cover-art-archive'].back)
        .map(r=>({r,s:((r['label-info']||[]).some(l=>cat&&String(l['catalog-number']||'').replace(/\W/g,'').toLowerCase()===cat)?4:0)+(r.country===x.country?1:0)+(String(r.date||'').slice(0,4)===String(x.year)?1:0)}))
        .sort((p,q)=>q.s-p.s);
      for(const {r,s:sc} of L.slice(0,3)){const o=await caaTyped(r.id);if(o){out=Object.assign(o,{mbid:r.id,exact:sc>=4});break}}
    }
  }catch(e){}
  x.scan=out?Object.assign(out,{at:Date.now()}):{none:true,at:Date.now()};
  delete COL.scanBusy[x.id];touch();viewRedraw();
}

function ringColor(c){
