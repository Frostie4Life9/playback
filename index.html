<style>
/* Layout: catalog sidebar (artists / shows) + detail sheet; "up next" strip on top. Archival record-sleeve feel. */
:root{
  --bg:#ECEFEC; --surface:#F8FAF8; --sunk:#E1E6E2; --ink:#18221E; --muted:#5D6A64; --line:#CDD5D0;
  --accent:#0F6E72; --accent-ink:#FFFFFF; --done:#2C7A55; --done-soft:#D6EBDF; --warn:#B4502F;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201D; --sunk:#0C100E; --ink:#E3E9E6; --muted:#8F9C96; --line:#2C3632;
  --accent:#6FD3C6; --accent-ink:#0B2A2C; --done:#6FCB9A; --done-soft:#1D3328; --warn:#F08A66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201D; --sunk:#0C100E; --ink:#E3E9E6; --muted:#8F9C96; --line:#2C3632;
  --accent:#6FD3C6; --accent-ink:#0B2A2C; --done:#6FCB9A; --done-soft:#1D3328; --warn:#F08A66; color-scheme:dark}
*{box-sizing:border-box}
:root{color-scheme:light;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
html,body{-webkit-tap-highlight-color:transparent}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.label{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.tabs{display:flex;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 18px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* up next */
.next{display:flex;flex-direction:column;gap:8px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.card{flex:0 0 auto;width:240px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* shell */
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:760px){.shell{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:10px}
.entry{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px}
.entry:hover{background:var(--sunk)}
.entry[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.entry .n{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .p{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px}

form.add{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical;font-size:14px}
.row2{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:var(--surface);border-color:var(--warn)}

/* detail */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:22px;min-width:0}
@media (max-width:500px){.sheet{padding:16px}}
.head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.head h2{font:700 30px/1.1 var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.head .meta{flex:1;min-width:180px;display:flex;flex-direction:column;gap:4px}
.ring{--p:0;width:84px;aspect-ratio:1;border-radius:50%;flex:0 0 auto;
  background:repeating-radial-gradient(circle,transparent 0 3px,rgb(127 127 127 / .08) 3px 4px),conic-gradient(var(--done) calc(var(--p)*1%),var(--sunk) 0);
  display:grid;place-items:center}
.ring span{width:46px;aspect-ratio:1;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.group{display:flex;flex-direction:column;gap:6px}
.ghead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.ghead h3{font:700 18px/1.2 var(--display);margin:0}
.ghead .sp{flex:1}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;width:80px}
.bar i{display:block;height:100%;background:var(--done)}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:0}
.link:disabled{opacity:.45;cursor:default}
.arate{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:2px 0 6px;border-bottom:1px solid var(--line)}
.avg{font:500 12px var(--mono);color:var(--muted)}
.avg .of{opacity:.8}
.diff{font:600 12px var(--mono);color:var(--muted)}
.diff.up,.diff.down{color:var(--accent)}
.ghead .art{width:44px;height:44px;border-radius:5px;object-fit:cover;background:var(--sunk);flex:0 0 auto;align-self:center;box-shadow:0 0 0 1px var(--line)}

/* MusicBrainz import */
.mbres{display:flex;flex-direction:column;gap:4px}
.mbhit{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.mbhit:hover{border-color:var(--accent)}
.mbhit b{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mbsub{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}
.tag{font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px}
.mbpick{display:flex;flex-direction:column;gap:10px;border:1px solid var(--accent);background:var(--surface);border-radius:10px;padding:12px}
.mbpick .note{margin:0}
.tick{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.tick input{width:18px;height:18px;flex:0 0 auto;margin:1px 0 0;accent-color:var(--accent)}
.mbprog{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.bar.wide{width:100%;height:6px;border-radius:3px}
.bar.wide i{background:var(--accent);transition:width .4s}
.mberr,.mbok{margin:0;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.45}
.mberr{border:1px solid var(--warn);color:var(--warn);background:var(--surface)}
.mbok{border:1px solid var(--done);background:var(--done-soft);color:var(--ink)}
.mbok .link{margin-left:8px}
.mbsrc{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.mbsrc.warn{flex-direction:column;align-items:flex-start;border:1px dashed var(--line);border-radius:10px;padding:12px}
.mbsrc.warn .note{margin:0}

.track{display:grid;grid-template-columns:28px 26px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 4px;border-radius:6px}
.track:hover{background:var(--bg)}
.track .num{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.track .ttl{min-width:0;overflow-wrap:anywhere}
.track.done .ttl{color:var(--muted)}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
.check[aria-pressed="true"]::after{content:"";width:8px;height:4px;border:2px solid var(--surface);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.rate{display:flex;align-items:center;gap:8px}
.dots{display:flex;gap:3px}
.dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line);display:flex;overflow:hidden;flex:0 0 auto}
.dot.full{background:var(--accent);border-color:var(--accent)}
.dot.half{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot button{flex:1;border:0;background:transparent;padding:0;margin:0}
.dots:hover .dot{border-color:var(--muted)}
.rv{font:500 12px var(--mono);font-variant-numeric:tabular-nums;min-width:28px;text-align:right;color:var(--muted)}
.rv.set{color:var(--accent);font-weight:600}
@media (pointer:coarse){.dot{width:18px;height:18px}.dots{gap:4px}}
@media (max-width:560px){.track{grid-template-columns:28px 26px minmax(0,1fr)}.track .rate{grid-column:3}}

.eps{display:flex;flex-wrap:wrap;gap:6px}
.ep{font:500 12px var(--mono);border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 8px;min-width:58px;font-variant-numeric:tabular-nums}
.ep[aria-pressed="true"]{background:var(--done-soft);border-color:var(--done);color:var(--done)}

details.more{border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.more form{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-width:460px}
.note{color:var(--muted);font-size:13px;max-width:62ch}
.empty{color:var(--muted);padding:30px 0;text-align:center}
footer{display:flex;flex-direction:column;gap:8px}
footer details{max-width:640px}
footer textarea{font:12px var(--mono);margin-top:8px}
@media (prefers-reduced-motion:no-preference){.ring{transition:background .3s}}
.topr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:500 12px var(--mono);color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.sync[data-s="ok"] i{background:var(--done)}
.sync[data-s="busy"] i{background:var(--accent)}
.sync[data-s="error"] i,.sync[data-s="conflict"] i{background:var(--warn)}
.banner{border:1px solid var(--warn);background:var(--surface);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.banner p{margin:0;flex:1;min-width:220px}
.panel{display:flex;flex-direction:column;gap:8px;max-width:520px;margin-top:8px}
.panel .msg{font-size:13px;color:var(--muted)}
.panel .msg.err{color:var(--warn)}
.buildid{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
/* ---- update bar (same behavior as the other apps) ---- */
.updbar{position:fixed;left:0;right:0;top:0;z-index:130;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.updin{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 16px;
  border-radius:24px;background:var(--surface);border:1px solid var(--accent);box-shadow:0 10px 30px rgb(0 0 0 / .28);pointer-events:auto;
  transform:translateY(calc(-100% - 40px));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.updbar.up .updin{transform:none}
.upddot{width:8px;height:8px;border-radius:4px;background:var(--accent);flex:0 0 auto}
.updtxt{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.updgo{height:36px;padding:0 16px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:700}
.updx{width:36px;height:36px;border:0;border-radius:18px;background:transparent;color:var(--muted);display:grid;place-items:center}
.updx svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
@media (prefers-reduced-motion:reduce){.updin{transition:none}}
</style>

<!-- suite:css v9 · shared by Kitchen, Grocery, Lift, DishLog, Protocol, Rail, Game Log, Playback — edit tools/suite.py in the kitchen repo, not here -->
<style id="suite-css">
/* App colors come from each app's home-screen icon, so the bar, the icon and
   the page all agree. The tab for every app carries its own color, so the
   whole set reads as one color-coded system wherever you are in it. */
.sx-bar{
  --sx-kitchen:#7A2E1E; --sx-grocery:#2D5840; --sx-lift:#A8522B; --sx-dishlog:#6A2347; --sx-protocol:#1E3550; --sx-rail:#3A2A63; --sx-gamelog:#242B5C; --sx-playback:#124C50;
  --sx-on:#FFF8EF;
  --sx-paper:#FAF6F0; --sx-ink:#1F1A14; --sx-dim:#7D7262; --sx-line:#DDD3C2; --sx-hover:#EFE7DA;
}
@media (prefers-color-scheme:dark){ .sx-bar:not(.sx-light){
  --sx-kitchen:#E8987C; --sx-grocery:#7CC39A; --sx-lift:#EE9C66; --sx-dishlog:#DD8DB2; --sx-protocol:#5FE6B0; --sx-rail:#B9A6F2; --sx-gamelog:#F5B63F; --sx-playback:#6FD3C6;
  --sx-on:#15120E;
  --sx-paper:#17140F; --sx-ink:#F1EADF; --sx-dim:#A0947F; --sx-line:#3B342B; --sx-hover:#2A251E;
}}
.sx-bar.sx-dark{
  --sx-kitchen:#E8987C; --sx-grocery:#7CC39A; --sx-lift:#EE9C66; --sx-dishlog:#DD8DB2; --sx-protocol:#5FE6B0; --sx-rail:#B9A6F2; --sx-gamelog:#F5B63F; --sx-playback:#6FD3C6;
  --sx-on:#15120E;
}
/* layout tokens every app's own layout lines up with. No width cap: on a
   computer the apps use the whole window; each app decides how many columns. */
:root{ --sx-max:100000px; --sx-gut:clamp(16px,2vw,40px); --sx-barh:56px; }

.sx-bar{position:relative;z-index:40;background:var(--sx-paper);border-bottom:1px solid var(--sx-line);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;color:var(--sx-ink)}
.sx-in{max-width:var(--sx-max);margin:0 auto;box-sizing:border-box;min-height:52px;
  padding:calc(8px + env(safe-area-inset-top,0px)) var(--sx-gut) 8px;display:flex;align-items:center;gap:18px}
.sx-id{display:flex;align-items:center;gap:10px;flex:0 1 auto;min-width:0}
.sx-tile{width:32px;height:32px;border-radius:7.5px;display:block;background:var(--app);flex:0 0 auto;
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 2px 6px -2px rgba(0,0,0,.3)}
.sx-name{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:600;font-size:21px;letter-spacing:-.01em;line-height:1;color:var(--sx-ink);white-space:nowrap}
.sx-t svg,.sx-gbtn svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* phone: app name on the left, the grid button on the right */
.sx-gbtn{margin-left:auto;flex:0 0 auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--sx-line);background:transparent;
  color:var(--sx-dim);display:grid;place-items:center;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;transition:background .15s,color .15s,scale .22s var(--sx-spring)}
.sx-gbtn svg{width:19px;height:19px}
.sx-gbtn[aria-expanded="true"]{background:var(--sx-hover);color:var(--sx-ink)}
.sx-menu{position:fixed;inset:0;z-index:300}
.sx-menu[hidden]{display:none}
.sx-pop{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));right:var(--sx-gut);width:min(340px,calc(100vw - 2 * var(--sx-gut)));
  box-sizing:border-box;padding:10px;border-radius:22px;background:var(--sx-paper);border:1px solid var(--sx-line);
  box-shadow:0 24px 60px -18px rgba(0,0,0,.45);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  transform-origin:top right;animation:sx-pop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes sx-pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.sx-cell{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:16px;text-decoration:none;
  color:var(--sx-ink);font:700 12px/1.1 'Manrope',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.sx-cell img{width:54px;height:54px;border-radius:12.5px;display:block;background:var(--c);
  box-shadow:0 0 0 .5px rgba(0,0,0,.12),0 3px 8px -3px rgba(0,0,0,.35)}
.sx-cell:active{background:var(--sx-hover)}
.sx-cell[aria-current="page"]{background:var(--sx-hover)}
.sx-cell[aria-current="page"] b{color:var(--sx-dim);font-weight:700}
.sx-cell b{font-weight:700}
.sx-tabs{display:none}
@media (prefers-reduced-motion:reduce){.sx-pop{animation:none}}

/* computer and tablet: the full bar of tabs */
.sx-t{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 11px;box-sizing:border-box;
  border-radius:999px;border:1px solid transparent;background:transparent;color:var(--sx-dim);text-decoration:none;
  font:700 12.5px/1 'Manrope',system-ui,sans-serif;letter-spacing:.02em;white-space:nowrap;transition:background .15s,color .15s,border-color .15s,scale .22s var(--sx-spring)}
.sx-t svg{width:16px;height:16px;color:var(--c);flex:0 0 auto}
.sx-t:hover{background:var(--sx-hover);color:var(--sx-ink)}
.sx-t:focus-visible,.sx-gbtn:focus-visible,.sx-cell:focus-visible{outline:2px solid var(--app);outline-offset:2px}
.sx-t[aria-current="page"]{background:var(--c);border-color:var(--c);color:var(--sx-on)}
.sx-t[aria-current="page"] svg{color:inherit}
@media (min-width:900px){
  .sx-bar{position:sticky;top:0;z-index:70;background:color-mix(in srgb,var(--sx-paper) 88%,transparent);
    -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
  .sx-in{min-height:var(--sx-barh)}
  .sx-tabs{display:flex;gap:6px;margin-left:auto;flex:0 1 auto;min-width:0}
  .sx-gbtn,.sx-menu{display:none!important}
}
@media print{.sx-bar{display:none}}

/* Moving between apps: they all live on frostie4life9.github.io, so the
   browser can cross-fade one page into the next instead of cutting. The bar
   is its own layer, so it holds still and just changes color and name,

/* suite motion helpers (window.SX), shared by every app. Each one is a

     SX.expand(el, open, apply)  open or close a block by its height

      var k=keyOf(el,o.key); if(k==null || seen[k]) return; seen[k]=1;
      var b=before[k], r=el.getBoundingClientRect();

    var els=sel?root.querySelectorAll(sel):root.children, vh=window.innerHeight, i=0;

      var r=el.getBoundingClientRect(); if(r.bottom<0 || r.top>vh || !r.height) return;

    });
  }

  var rows=[];
  function pill(row,activeSel,o){
    row=q(row); if(!row) return;
    var rec=null; rows.forEach(function(x){ if(x.row===row) rec=x; });
    if(!rec){ rec={row:row, sel:activeSel, last:null, o:o||{}}; rows.push(rec); watch(rec); }
    rec.sel=activeSel||rec.sel; place(rec,true);

  function place(rec,animate){
    var row=rec.row, p=row.querySelector(':scope > .sx-pill');

    p.style.transform='translate('+now.x+'px,'+now.y+'px)';
    if(animate && last && !still() && (last.x!==now.x || last.y!==now.y || last.w!==now.w)){

    } else {
      cs=getComputedStyle(el); h=el.offsetHeight; if(!h){ apply(false); return; }

      a=el.animate([f,{height:'0px',paddingTop:'0px',paddingBottom:'0px',marginTop:'0px',marginBottom:'0px',opacity:0}],{duration:240,easing:E});
    }
    el._sx=a;
    a.onfinish=function(){ el._sx=null; el.style.overflow=''; if(!open) apply(false); };

  }

  /* redraw something whose bars or meters are set inline (width:40%), and
     let each one ease from where it was instead of snapping */
  function morph(host,sel,prop,change){
    host=q(host); if(!host){ change(); return; }
    var old=Array.prototype.map.call(host.querySelectorAll(sel),function(e){ return e.style[prop]; });
    change();
    if(still()) return;
    var now=host.querySelectorAll(sel), to=Array.prototype.map.call(now,function(e){ return e.style[prop]; });
    Array.prototype.forEach.call(now,function(e,i){ if(old[i]===to[i]) return; e.style.transition='none'; e.style[prop]=old[i]!=null&&old[i]!==''?old[i]:'0'; });
    void host.offsetWidth;
    Array.prototype.forEach.call(now,function(e,i){ e.style.transition=''; e.style[prop]=to[i]; });
  }

  function bump(el){
    el=q(el); if(!el || still()) return;
    el.animate([{scale:1},{scale:1.08},{scale:1}],{duration:320,easing:SPRING});
  }

  /* <details> sections open and close by height instead of snapping.
     The toggle still happens for real, so anything listening for it works. */
  document.addEventListener('click',function(e){
    var sm=e.target.closest && e.target.closest('summary'); if(!sm || e.defaultPrevented) return;
    var d=sm.parentElement; if(!d || d.tagName!=='DETAILS' || d.hasAttribute('data-sx-still') || still()) return;
    e.preventDefault();
    if(d._sx){ d._sx.cancel(); d._sx=null; }
    var from=d.offsetHeight, opening=!d.open, to;
    d.style.overflow='hidden';
    if(opening){ d.open=true; to=d.offsetHeight; }
    else { d.open=false; to=d.offsetHeight; d.open=true; }
    var a=d.animate([{height:from+'px'},{height:to+'px'}],{duration:opening?320:240,easing:E});
    d._sx=a;
    a.onfinish=function(){ d._sx=null; d.style.overflow=''; if(!opening) d.open=false; };
    a.oncancel=function(){ d.style.overflow=''; };

  });

  window.SX={still:still, flip:flip, enter:enter, pill:pill, expand:expand, morph:morph, bump:bump};
})();

function seedAll(){
  const aid=sid('artist','radiohead');
  let a=S.music.find(x=>x.id===aid);
  if(!a&&!S.flags.rhDeleted){a={id:aid,name:'Radiohead',groups:[]};S.music.push(a)}
  if(a&&!a.mbid){   /* once Radiohead comes from MusicBrainz, the hand-typed lists are retired */
    for(const [title,year,kind,tracks] of RADIOHEAD){
      const gid=sid(aid,title);
      let g=a.groups.find(x=>x.id===gid);
      if(!g){g={id:gid,title,year,kind,items:[]};a.groups.push(g)}
      for(const t of tracks){const id=sid(aid,title,t);if(!g.items.some(i=>i.id===id))g.items.push({id,title:t})}
    }
    if(!S.flags.rhAlbums){
      a.groups.filter(g=>g.kind==='Studio album').forEach(g=>g.items.forEach(i=>S.marks[i.id]={...(S.marks[i.id]||{}),done:true}));
      S.flags.rhAlbums=true;
    }
  }
  if(!S.flags.exSeverance){
    const id=sid('show','severance');
    S.screen.push({id,type:'show',title:'Severance',year:'2022',example:true,seasons:[{n:1,eps:9},{n:2,eps:10}]});
    [1,2,3].forEach(e=>S.marks[sid(id,'s',1,'e',e)]={done:true});
    S.flags.exSeverance=true;
  }
  /* imported artists: fold back anything that duplicates a MusicBrainz song
     (an older copy of the app re-adding the hand-typed lists, say) */
  S.music.forEach(x=>{if(x.mbid)mbTidy(x)});
  save();
}

/* ---------- derived ---------- */
const isDone=id=>!!(S.marks[id]&&S.marks[id].done);
const rating=id=>(S.marks[id]&&S.marks[id].r)||0;
function artistItems(a){return a.groups.flatMap(g=>g.items)}
function epIds(s){return s.type==='film'?[s.id]:s.seasons.flatMap(se=>Array.from({length:se.eps},(_,k)=>sid(s.id,'s',se.n,'e',k+1)))}
function pct(ids){if(!ids.length)return 0;return Math.round(ids.filter(isDone).length/ids.length*100)}
const sxe=(n,e)=>'S'+String(n).padStart(2,'0')+'E'+String(e).padStart(2,'0');

function upNext(){
  const out=[];
  for(const a of S.music){
    for(const g of a.groups){const i=g.items.find(x=>!isDone(x.id));if(i){out.push({tab:'music',id:a.id,t:i.title,s:a.name+' · '+g.title});break}}
  }
  for(const s of S.screen){
    if(s.type==='film'){if(!isDone(s.id))out.push({tab:'screen',id:s.id,t:s.title,s:'Film'+(s.year?' · '+s.year:'')});continue}
    let found=null;
    for(const se of s.seasons){for(let e=1;e<=se.eps;e++){if(!isDone(sid(s.id,'s',se.n,'e',e))){found=[se.n,e];break}}if(found)break}
    if(found)out.push({tab:'screen',id:s.id,t:s.title,s:sxe(found[0],found[1])+' is next'});
  }
  return out;
}

/* ---------- MusicBrainz discography import ----------
   One paged sweep of the artist's official releases, each page carrying full
   tracklists, at no more than one request a second (MusicBrainz's rule).
   A song is identified by its normalized title (case, punctuation, "&"/"and",
   subtitles in brackets and "remastered"-type tags ignored), so the same song
   on an album, a single, a deluxe edition and a remaster is ONE item.
   Placement: studio albums claim their songs first, oldest first, using the
   edition most pressings share; then EPs, singles, compilations and the rest
   in release order, so a B-side lands on the release that first carried it;
   then (only with "other versions" ticked) songs that only exist on a
   bonus edition of a release join that release. Only digital releases
   count, since that is what streaming services carry. Live albums, remixes, demos and alternate versions are skipped
   unless asked for. Item IDs come from the title key, and an item that is
   already in the log keeps its ID, so checkmarks and ratings never move. */
const MB_API='https://musicbrainz.org/ws/2/';
const RH_MBID='a74b1b7f-71a5-4011-9441-d0b5e4122711';
const MBX={q:'',results:null,pick:null,versions:false,searching:false,busy:false,cancel:false,where:'side',aid:null,name:'',step:'',n:0,of:0,note:'',err:'',report:'',errWhere:'side'};
const mbSleep=ms=>new Promise(r=>setTimeout(r,ms));
let mbLast=0;
function MBError(code,status){const e=new Error(code);e.code=code;e.status=status;return e}
async function mbGet(path,params){
  for(let tries=0;;tries++){
    const wait=mbLast+1100-Date.now();if(wait>0)await mbSleep(wait);
    if(MBX.cancel)throw MBError('cancel');
    mbLast=Date.now();
    let r;
    /* no custom headers: browsers won't let a page set User-Agent, and any
       extra header would force a CORS preflight. fmt=json is all it needs. */
    try{r=await fetch(MB_API+path+'?'+new URLSearchParams(Object.assign({},params,{fmt:'json'})))}
    catch(e){throw MBError(navigator.onLine===false?'offline':'network')}
    if(r.status===503||r.status===429){
      if(tries>=4)throw MBError('busy');
      const ra=parseInt(r.headers.get('retry-after'),10);
      MBX.note='MusicBrainz asked us to slow down, waiting a moment';mbProgress();
      await mbSleep((ra>0?Math.min(ra,20):2+tries*3)*1000);
      MBX.note='';continue;
    }
    if(!r.ok)throw MBError('http',r.status);
    try{return await r.json()}catch(e){throw MBError('http',r.status)}
  }
}
function mbMessage(e,q){
  const c=e&&e.code;
  if(c==='offline')return "You're offline. Connect to the internet and try again. Nothing in your log was changed.";
  if(c==='network')return "Couldn't reach MusicBrainz. Check your connection; if that's fine, MusicBrainz may be down for a few minutes. Nothing in your log was changed.";
  if(c==='busy')return 'MusicBrainz is limiting requests right now (it allows about one a second, shared by everyone). Wait a minute and try again. Nothing in your log was changed.';
  if(c==='http')return 'MusicBrainz sent back an error ('+e.status+'). Try again in a few minutes. Nothing in your log was changed.';
  if(c==='nomatch')return 'No artists on MusicBrainz match “'+q+'”. Check the spelling, or try fewer words.';
  if(c==='empty')return 'MusicBrainz has no official releases with tracklists for this artist, so there was nothing to import.';
  if(c==='cancel')return 'Import cancelled. Nothing in your log was changed.';
  return 'Something went wrong while reading MusicBrainz. Nothing in your log was changed.';
}

/* ---- titles ---- */
function mbNorm(s){return String(s).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[‘’`´']/g,'').replace(/[&+]/g,' ').replace(/[^a-z0-9]+/g,' ')
  .replace(/\band\b/g,' ').replace(/\s+/g,' ').trim()}
/* what a tag in brackets (or after " - ") means: 'alt' = a different version,
   'same' = the same song (remasters, edits, mono), null = part of the title */
function mbVClass(d){
  const s=String(d).toLowerCase().replace(/["“”‘’']/g,'').replace(/\s+/g,' ').trim();
  if(!s)return null;
  if(/\b(live|demo|remix|rmx|rework|reworked|acoustic|instrumental|session|sessions|rehearsal|unplugged|orchestral|a ?cappella|karaoke|alternate|outtake|early)\b/.test(s))return 'alt';
  if(/\bremaster(ed)?\b|\b(mono|stereo|explicit|clean|bonus)\b/.test(s))return 'same';
  if(/^(radio|single|album|lp|original|short|long|full[- ]?length|7|7 inch|12|12 inch)? ?(edit|version|mix)$/.test(s))return 'same';
  if(/\b(mix|version|edit|take|dub)\b/.test(s))return 'alt';
  return null;
}
function mbSplit(title){
  const descs=[];let base=String(title);
  const stripped=base.replace(/\s*[\(\[]([^\)\]]*)[\)\]]/g,(m,inner)=>{descs.push(inner);return ' '});
  if(stripped.trim())base=stripped;else descs.length=0;            /* "(Nice Dream)" is the whole title */
  const dash=base.match(/^(.*\S)\s+[-–—]\s+(.+)$/);
  if(dash&&mbVClass(dash[2])){descs.push(dash[2]);base=dash[1]}
  return{base:base.replace(/\s+/g,' ').trim(),descs};
}
const mbK=s=>mbNorm(s).replace(/ /g,'');
function mbKeyOf(title){return mbK(mbSplit(title).base)||mbK(title)}
function mbTrack(t,rgid){
  const rec=t.recording||{};if(rec.video)return null;
  const title=String(rec.title||t.title||'').trim();
  if(!title||/^\[[^\]]*\]$/.test(title))return null;               /* [untitled], [silence], [data track] */
  const sp=mbSplit(title),key=mbK(sp.base)||mbK(title);if(!key)return null;
  let alt=null,fromDis=false;
  for(const d of sp.descs)if(mbVClass(d)==='alt'){alt=d;break}
  const dis=String(rec.disambiguation||'');
  if(!alt&&dis&&mbVClass(dis)==='alt'){alt=dis;fromDis=true}
  if(!alt)return{key,title};
  const live=/\blive\b/i.test(alt);
  return{key,title:fromDis?title+' ('+(live?'live':dis)+')':title,alt:true,altKey:key+'~'+(live?'live@'+rgid:mbK(alt)),
    take:/\b(live|demo|acoustic|session|sessions|rehearsal|unplugged|early|outtake)\b/i.test(alt)};   /* remixes and "versions" never stand in for the song */
}

/* ---- fetch + build ---- */
async function mbFetchCatalog(mbid){
  const rels=[];let off=0,total=0;
  do{
    const j=await mbGet('release',{artist:mbid,status:'official',inc:'recordings+release-groups',limit:100,offset:off});
    const got=j.releases||[];total=j['release-count']||0;rels.push(...got);off+=got.length;
    MBX.step='Reading releases';MBX.n=Math.min(off,total);MBX.of=total;mbProgress();
    if(!got.length)break;
  }while(off<total);
  return rels;
}
const MB_KIND_ORDER=['Studio album','EP','Single','Compilation','Live','Other'];
function mbDateKey(d){d=String(d||'');const p=d.split('-');return d?(p[0]||'9999')+'-'+(p[1]||'99')+'-'+(p[2]||'99'):'9999-99-99'}
function mbBuild(rels,versions){
  const byRg=new Map();
  for(const r of rels){
    if(r.status&&r.status!=='Official')continue;
    const rg=r['release-group'];if(!rg||!rg.id)continue;
    if(!byRg.has(rg.id))byRg.set(rg.id,{rg,rels:[]});
    byRg.get(rg.id).rels.push(r);
  }
  /* Spotify-style catalogs only carry digital releases. MusicBrainz also lists every CD, vinyl and
     Japan-only pressing, which is where songs nobody can stream come from. If the artist has any
     digital releases at all, only those count; a release group with none is skipped. */
  const isDigi=r=>(r.media||[]).some(m=>m.format==='Digital Media');
  const anyDigi=rels.some(isDigi);
  const fmtRank=r=>{const f=((r.media||[])[0]||{}).format||'';return f==='CD'?0:f==='Digital Media'?1:/vinyl|"/i.test(f)?2:3};
  const tracksOf=r=>(r.media||[]).filter(m=>!/dvd|blu-ray|vhs|video|laserdisc|umd/i.test(m.format||'')).flatMap(m=>m.tracks||[]);
  const entries=[];
  for(const {rg,rels:rr0} of byRg.values()){
    const rr=anyDigi?rr0.filter(isDigi):rr0;if(!rr.length)continue;
    const sec=(rg['secondary-types']||[]).map(s=>String(s).toLowerCase()),pt=rg['primary-type']||'Other';
    if(sec.some(s=>['interview','spokenword','audiobook','audio drama','field recording'].includes(s)))continue;
    const isLive=sec.includes('live')||pt==='Broadcast',isAlt=sec.some(s=>['remix','dj-mix','demo','mixtape/street'].includes(s));
    if((isLive||isAlt)&&!versions)continue;
    const kind=isLive?'Live':sec.includes('compilation')?'Compilation':isAlt||sec.includes('soundtrack')?'Other':pt==='Album'?'Studio album':pt==='EP'?'EP':pt==='Single'?'Single':'Other';
    /* the edition most pressings share is the "real" tracklist; ties go to the oldest */
    const sigCount=new Map(),sig=r=>tracksOf(r).map(t=>mbKeyOf((t.recording&&t.recording.title)||t.title)).join('|');
    rr.forEach(r=>{const s=sig(r);sigCount.set(s,(sigCount.get(s)||0)+1)});
    const byAge=rr.slice().sort((a,b)=>mbDateKey(a.date)<mbDateKey(b.date)?-1:mbDateKey(a.date)>mbDateKey(b.date)?1:fmtRank(a)-fmtRank(b));
    const usable=byAge.filter(r=>tracksOf(r).length);if(!usable.length)continue;
    /* for albums, deluxe and anniversary editions can outnumber the standard one, so only editions
       within a few tracks of the shortest one compete for "standard" */
    const minLen=Math.min(...usable.map(r=>tracksOf(r).length));
    const cands=kind==='Studio album'?usable.filter(r=>tracksOf(r).length<=minLen+3):usable;
    const rep=cands.slice().sort((a,b)=>(sigCount.get(sig(b))-sigCount.get(sig(a)))||(usable.indexOf(a)-usable.indexOf(b)))[0];
    const date=rg['first-release-date']||usable[0].date||'';
    /* albums: the standard edition first, bonus editions later. Singles and EPs
       often came as CD1/CD2, so every edition counts as the release itself. */
    const whole=kind!=='Studio album',restR=usable.filter(r=>r!==rep);
    entries.push({rgid:rg.id,title:rg.title||rep.title,year:date.slice(0,4)||'—',kind,date:mbDateKey(date),
      rep:(whole?[rep,...restR]:[rep]).flatMap(tracksOf),others:whole||!versions?[]:restR.flatMap(tracksOf),items:[]});
  }
  const albums=entries.filter(e=>e.kind==='Studio album').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const rest=entries.filter(e=>e.kind!=='Studio album').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:MB_KIND_ORDER.indexOf(a.kind)-MB_KIND_ORDER.indexOf(b.kind));
  const order=[...albums,...rest],claimed=new Set(),alts=[];
  const add=(E,key,title)=>{if(claimed.has(key))return;claimed.add(key);E.items.push({k:key,title})};
  const take=(E,t)=>{const x=mbTrack(t,E.rgid);if(!x)return;if(x.alt)alts.push({E,x});else add(E,x.key,x.title)};
  order.forEach(E=>E.rep.forEach(t=>take(E,t)));                          /* pass 1: the standard tracklists */
  order.forEach(E=>E.others.forEach(t=>take(E,t)));                       /* pass 2: songs only on other editions */
  for(const {E,x} of alts){                                               /* pass 3: other versions */
    if(!claimed.has(x.key)&&x.take)add(E,x.key,x.title);                  /* a song only ever released live or as a demo IS the song */
    else if(versions)add(E,x.altKey,x.title);
  }
  return order.filter(E=>E.items.length)
    .sort((a,b)=>(MB_KIND_ORDER.indexOf(a.kind)-MB_KIND_ORDER.indexOf(b.kind))||(a.date<b.date?-1:a.date>b.date?1:0))
    .map(E=>({rgid:E.rgid,title:E.title,year:E.year,kind:E.kind,items:E.items}));
}

/* ---- merge into the log: safe to repeat, never drops a mark ---- */
const mbItemKey=i=>i.k||mbKeyOf(i.title);
const mbMarked=id=>{const m=S.marks[id];return !!(m&&(m.done||m.r))};
function mbFold(into,from){            /* a duplicate's checkmark/rating moves onto the item that stays */
  if(into===from||!S.marks[from])return;
  const a=S.marks[into]||{},b=S.marks[from],m=Object.assign({},a);
  if(b.done)m.done=true;if(!m.r&&b.r)m.r=b.r;S.marks[into]=m;
}
function mbMerge(art,incoming,versions,tidy){
  let a=S.music.find(x=>x.mbid===art.id);
  if(!a){const id0=sid('artist',art.name),hit=S.music.find(x=>x.id===id0);
    if(hit&&!hit.mbid)a=hit;
    else{a={id:hit?sid('artist',art.name,art.id):id0,name:art.name,groups:[]};S.music.push(a)}}
  const seedIds=a.id===sid('artist','radiohead')?new Set(RADIOHEAD.map(r=>sid(a.id,r[0]))):new Set();
  const replaced=g=>g.src==='mb'||g.src==='kept'||seedIds.has(g.id);
  /* one ID per song: an imported item's ID wins, then the first one found */
  const canon=new Map(),before=new Set();
  for(const g of [...a.groups.filter(g=>g.src==='mb'),...a.groups.filter(g=>g.src!=='mb')])
    for(const i of g.items){before.add(i.id);const k=mbItemKey(i);if(!canon.has(k))canon.set(k,i.id);else mbFold(canon.get(k),i.id)}
  const placed=new Set(),idFor=k=>canon.get(k)||sid(a.id,'song',k);
  const groups=[];
  for(const G of incoming){
    const items=[];
    for(const t of G.items){if(placed.has(t.k))continue;placed.add(t.k);items.push({id:idFor(t.k),title:t.title,k:t.k})}
    if(items.length)groups.push({id:sid(a.id,'rg',G.rgid),src:'mb',mbid:G.rgid,title:G.title,year:G.year,kind:G.kind,items});
  }
  const manual=[];
  for(const g of a.groups){if(replaced(g))continue;
    const items=[];for(const i of g.items){const k=mbItemKey(i);if(placed.has(k))continue;placed.add(k);items.push(Object.assign({},i,{id:idFor(k)}))}
    if(items.length)manual.push(Object.assign({},g,{items}))}
  const kept=[];let dropped=0;
  for(const g of a.groups){if(!replaced(g))continue;
    for(const i of g.items){const k=mbItemKey(i);if(placed.has(k))continue;placed.add(k);
      const id=idFor(k);
      if(mbMarked(id)||(tidy&&g.src==='kept'))kept.push({id,title:i.title,k});else dropped++}}
  a.groups=[...groups,...manual];
  if(kept.length)a.groups.push({id:sid(a.id,'kept'),src:'kept',title:'Kept from your earlier list',year:'—',kind:'Not in the MusicBrainz import',items:kept});
  a.mbid=art.id;if(!tidy){a.name=art.name;a.mbVersions=!!versions;a.mbAt=Date.now()}
  const all=groups.flatMap(g=>g.items),kinds={};groups.forEach(g=>kinds[g.kind]=(kinds[g.kind]||0)+1);
  return{aid:a.id,name:a.name,kinds,songs:all.length,added:all.filter(i=>!before.has(i.id)).length,kept:kept.length,dropped};
}
function mbTidy(a){
  const inc=a.groups.filter(g=>g.src==='mb').map(g=>({rgid:g.mbid,title:g.title,year:g.year,kind:g.kind,items:g.items.map(i=>({k:mbItemKey(i),title:i.title}))}));
  mbMerge({id:a.mbid,name:a.name},inc,a.mbVersions,true);
}
function mbReportText(r){
  const names={'Studio album':['studio album','studio albums'],'EP':['EP','EPs'],'Single':['single','singles'],'Compilation':['compilation','compilations'],'Live':['live release','live releases'],'Other':['other release','other releases']};
  const parts=MB_KIND_ORDER.filter(k=>r.kinds[k]).map(k=>r.kinds[k]+' '+names[k][r.kinds[k]===1?0:1]);
  let s=r.name+': '+parts.join(', ')+' · '+r.songs+' songs'+(r.added===r.songs?'.':'. '+r.added+' new, '+(r.songs-r.added)+' were already in your log with their checkmarks and ratings.');
  if(r.kept)s+=' '+r.kept+' song'+(r.kept===1?'':'s')+' you had marked '+(r.kept===1?"isn't":"aren't")+' on MusicBrainz, so '+(r.kept===1?'it stays':'they stay')+' in “Kept from your earlier list”.';
  if(r.dropped)s+=' '+r.dropped+' unmarked song'+(r.dropped===1?' from the old list was':'s from the old list were')+' not found and removed.';
  return s;
}

/* ---- the flow ---- */
async function mbSearch(q){
  if(MBX.busy||MBX.searching)return;
  Object.assign(MBX,{q,err:'',report:'',results:null,pick:null,searching:true,errWhere:'side'});render();
  try{
    const lq=q.replace(/([+\-&|!(){}\[\]^"~*?:\\\/])/g,'\\$1');
    const j=await mbGet('artist',{query:lq,limit:8});
    const list=j.artists||[];if(!list.length)throw MBError('nomatch');

async function mbImport(art,where){
  if(MBX.busy)return;
  const existing=S.music.find(x=>x.mbid===art.id)||S.music.find(x=>x.id===sid('artist',art.name)&&!x.mbid);
  Object.assign(MBX,{busy:true,cancel:false,err:'',report:'',where,errWhere:where,aid:existing?existing.id:null,name:art.name,step:'Asking MusicBrainz',n:0,of:0,note:''});render();
  try{
    const rels=await mbFetchCatalog(art.id);
    if(MBX.cancel)throw MBError('cancel');
    MBX.step='Sorting out duplicates';mbProgress();
    const groups=mbBuild(rels,MBX.versions);
    if(!groups.length)throw MBError('empty');
    const r=mbMerge(art,groups,MBX.versions,false);
    touch();
    UI.tab='music';UI.sel.music=r.aid;UI.filter='all';
    try{localStorage.setItem(KEY+'_tab','music')}catch(e){}

  }catch(e){MBX.err=mbMessage(e,art.name)}
  finally{MBX.busy=false;MBX.cancel=false;render()}
  /* on a phone the sheet sits below the sidebar: bring the result into view */
  if(MBX.errWhere==='sheet'&&window.innerWidth<=760){const el=document.querySelector('.mbok,.sheet .mberr');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
}

/* ---------- sync (playback-sync Worker) ----------
   S.mtime = when you last changed something. SY.last = the mtime the server
   last confirmed. If the server copy is newer we adopt it; if this device has
   changes the server never saw AND the server is newer, we ask. */
const SYNC_KEY=KEY+'_sync';
let SY=(()=>{try{return Object.assign({url:'',key:'',last:0,at:0},JSON.parse(localStorage.getItem(SYNC_KEY)||'{}'))}catch(e){return{url:'',key:'',last:0,at:0}}})();
const saveSync=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}};
const SYS={status:SY.url?'idle':'off',msg:'',remote:null};
let pushTimer=null,inflight=false;
const syncOn=()=>!!(SY.url&&SY.key);
function syncLabel(){
  if(!syncOn())return 'Sync off';
  if(SYS.status==='busy')return 'Syncing…';
  if(SYS.status==='error')return 'Sync problem';
  if(SYS.status==='conflict')return 'Needs a choice';
  if(SY.at)return 'Synced '+new Date(SY.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  return 'Sync ready';
}
function touch(){S.mtime=Date.now();save();if(syncOn()){clearTimeout(pushTimer);pushTimer=setTimeout(()=>push(false),1500)}}
async function api(method,body,force){
  const u=SY.url.replace(/\/+$/,'')+'/'+(force?'?force=1':'');
  const r=await fetch(u,{method,cache:'no-store',headers:Object.assign({'x-sync-key':SY.key},body?{'content-type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  let j=null;try{j=await r.json()}catch(e){}
  return{status:r.status,j};
}
function fail(status,j){
  SYS.status='error';
  SYS.msg=status===401?'The sync key does not match the SECRET on your Worker. Re-enter it and save.'
    :status===500&&j&&j.error?'The Worker is not set up yet: '+j.error+'.'
    :'Sync failed ('+status+'). Try again in a moment.';
}
function ok(){SYS.status='ok';SYS.msg='';SY.at=Date.now();saveSync()}
function adopt(j){S=j;S.flags=S.flags||{};S.marks=S.marks||{};S.music=S.music||[];S.screen=S.screen||[];seedAll();SY.last=S.mtime||0;ok();render()}
async function pull(){
  if(!syncOn()||inflight)return;inflight=true;SYS.status='busy';render();
  try{
    const{status,j}=await api('GET');
    if(status!==200){fail(status,j);return}
    if(j&&j.v===1&&Array.isArray(j.music)){
      const remote=j.mtime||0,local=S.mtime||0;
      if(!SY.last&&remote){adopt(j);return}            /* first sync on this device: take the saved log */
      if(remote>local){ if(local>SY.last){SYS.status='conflict';SYS.remote=j;return} adopt(j);return }
      if(local>remote){inflight=false;await push(false);return}
      SY.last=local;ok();
    }else{inflight=false;await push(false);return}       /* nothing saved yet: upload this device */
  }catch(e){SYS.status='error';SYS.msg='Could not reach your Worker. Check the URL and your connection.'}
  finally{inflight=false;render()}
}
async function push(force){
  if(!syncOn()||inflight)return;inflight=true;SYS.status='busy';render();
  try{
    const{status,j}=await api('PUT',S,force);
    if(status===200){SY.last=S.mtime||0;ok()}
    else if(status===409&&j){ if((S.mtime||0)>SY.last){SYS.status='conflict';SYS.remote=j} else adopt(j) }
    else fail(status,j);
  }catch(e){SYS.status='error';SYS.msg='Could not reach your Worker. Your changes are saved here and will upload next time.'}
  finally{inflight=false;render()}
}

/* Albums and EPs (and live/compilation albums) get an overall rating; singles and
   the other odds and ends do not. The rating lives in marks under the release's own
   ID, so it syncs and survives a re-import like song ratings do. */
const RATEABLE=['Studio album','EP','Live','Compilation'];
function albumRate(g){
  if(!RATEABLE.includes(g.kind))return '';
  const rs=g.items.map(i=>rating(i.id)).filter(Boolean),n=rs.length,r=rating(g.id);
  const avg=n?rs.reduce((x,y)=>x+y,0)/n:0,d=r&&n?r-avg:null,f1=v=>v.toFixed(1);
  return `<div class="arate"><span class="label">Your ${g.kind==='EP'?'EP':'album'} rating</span>${rateDots(g.id)}
    <span class="avg">${n?'Song average '+f1(avg)+' <span class="of">('+n+' of '+g.items.length+' rated)</span>':'No songs rated yet'}</span>
    ${d===null?'':`<span class="diff ${Math.abs(d)<.05?'even':d>0?'up':'down'}">${Math.abs(d)<.05?'Same as the songs':(d>0?'+':'\u2212')+f1(Math.abs(d))+' vs the songs'}</span>`}</div>`}

  if(act==='tab'){UI.tab=b.dataset.v;try{localStorage.setItem(KEY+'_tab',UI.tab)}catch(e){}}
  else if(act==='sel'){UI.sel[UI.tab]=id}
  else if(act==='go'){UI.tab=b.dataset.tab;UI.sel[UI.tab]=id;UI.filter='all'}
  else if(act==='filter'){UI.filter=b.dataset.v}
  else if(act==='tog'){S.marks[id]={...(S.marks[id]||{}),done:!isDone(id)};touch()}
  else if(act==='rate'){const v=+b.dataset.v;S.marks[id]={...(S.marks[id]||{}),r:rating(id)===v?0:v};touch()}
  else if(act==='grpall'){const a=S.music.find(x=>x.id===b.dataset.a),g=a.groups.find(x=>x.id===b.dataset.g),full=g.items.every(i=>isDone(i.id));
    g.items.forEach(i=>S.marks[i.id]={...(S.marks[i.id]||{}),done:!full});touch()}
  else if(act==='seasonall'){const s=S.screen.find(x=>x.id===b.dataset.s),n=+b.dataset.n,se=s.seasons.find(x=>x.n===n);
    const ids=Array.from({length:se.eps},(_,k)=>sid(s.id,'s',n,'e',k+1)),full=ids.every(isDone);
    ids.forEach(i=>S.marks[i]={...(S.marks[i]||{}),done:!full});touch()}
  else if(act==='del'){
    if(UI.armed!==id){UI.armed=id}
    else{
      const inMusic=S.music.find(x=>x.id===id);
      if(inMusic){artistItems(inMusic).forEach(i=>delete S.marks[i.id]);inMusic.groups.forEach(g=>delete S.marks[g.id]);S.music=S.music.filter(x=>x.id!==id);if(id===sid('artist','radiohead'))S.flags.rhDeleted=true}
      else{const s=S.screen.find(x=>x.id===id);if(s){epIds(s).forEach(i=>delete S.marks[i]);S.screen=S.screen.filter(x=>x.id!==id)}}
      UI.armed=null;UI.sel[UI.tab]=null;touch();
    }
  }
  else if(act==='mbpick'){MBX.pick=MBX.results&&MBX.results[+b.dataset.i]||null;MBX.err=''}
  else if(act==='mbback'){MBX.pick=null}
  else if(act==='mbgo'){if(MBX.pick)mbImport({id:MBX.pick.id,name:MBX.pick.name},'side');return}
  else if(act==='mbcancel'){MBX.cancel=true;MBX.note='cancelling';mbProgress();return}
  else if(act==='mbdismiss'){MBX.report='';MBX.err=''}
  else if(act==='mbrefresh'){const a=S.music.find(x=>x.id===b.dataset.a);if(!a)return;
    const mbid=a.mbid||(a.id===sid('artist','radiohead')?RH_MBID:null);if(!mbid)return;
    MBX.versions=!!a.mbVersions;mbImport({id:mbid,name:a.name},'sheet');return}
  else if(act==='mbprefill'){const a=S.music.find(x=>x.id===b.dataset.a);if(!a)return;
    mbSearch(a.name).then(()=>{const el=document.getElementById('mb-q');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})});return}
  else if(act==='opensync'){UI.syncOpen=true;render();const p=document.getElementById('syncpanel');if(p)p.scrollIntoView({behavior:'smooth',block:'center'});return}
  else if(act==='pushnow'){push(false);return}
  else if(act==='pullnow'){pull();return}
  else if(act==='keeplocal'){SYS.remote=null;push(true);return}
  else if(act==='keepremote'){const j=SYS.remote;SYS.remote=null;if(j)adopt(j);return}
  else if(act==='unsync'){SY={url:'',key:'',last:0,at:0};saveSync();SYS.status='off';SYS.msg=''}
  else if(act==='copy'){
    const txt=JSON.stringify(S);const ta=document.getElementById('backup-text');ta.value=txt;
    const done=()=>{UI.copied=true;render();document.getElementById('backup').open=true;document.getElementById('backup-text').value=txt};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>{ta.select()})}else{ta.select()}
    return;
  }
  else if(act==='restore'){
    const ta=document.getElementById('backup-text');
    try{const o=JSON.parse(ta.value);if(!o||o.v!==1||!Array.isArray(o.music))throw 0;S=o;touch();render();return}
    catch(e){ta.value='';ta.placeholder='That text is not a Playback backup. Paste the full text you copied earlier, then try again.';return}
  }
  render();
});

document.addEventListener('change',ev=>{
  if(ev.target.id==='new-type'){UI.addType=ev.target.value;render();return}
  if(ev.target.id==='mb-ver'){MBX.versions=ev.target.checked;return}
});

document.addEventListener('submit',ev=>{
  ev.preventDefault();
  const f=ev.target,d=Object.fromEntries(new FormData(f)),kind=f.dataset.form;
  if(kind==='mbsearch'){const q=(d.q||'').trim();if(q)mbSearch(q);return}
  if(kind==='artist'){const name=d.name.trim();if(!name)return;const id=sid('artist',name);
    if(!S.music.some(x=>x.id===id))S.music.push({id,name,groups:[]});UI.sel.music=id}
  else if(kind==='screen'){const title=d.title.trim();if(!title)return;
    if(UI.addType==='film'){const id=sid('film',title,d.year||'');if(!S.screen.some(x=>x.id===id))S.screen.push({id,type:'film',title,year:d.year.trim()});UI.sel.screen=id}
    else{const eps=(d.seasons||'').split(/[,\s]+/).map(Number).filter(n=>n>0&&n<=200);if(!eps.length)return;
      const id=sid('show',title);if(!S.screen.some(x=>x.id===id))S.screen.push({id,type:'show',title,year:d.year.trim(),seasons:eps.map((n,k)=>({n:k+1,eps:n}))});UI.sel.screen=id}}
  else if(kind==='group'){const a=S.music.find(x=>x.id===f.dataset.a),title=d.title.trim();if(!a||!title)return;
    const gid=sid(a.id,title);let g=a.groups.find(x=>x.id===gid);if(!g){g={id:gid,title,year:d.year.trim()||'—',kind:d.kind,items:[]};a.groups.push(g)}
    const have=new Set(artistItems(a).map(mbItemKey));
    d.tracks.split('\n').map(t=>t.trim()).filter(Boolean).forEach(t=>{const k=mbKeyOf(t);if(have.has(k))return;have.add(k);g.items.push({id:sid(a.id,title,t),title:t})});
    if(!g.items.length)a.groups=a.groups.filter(x=>x!==g)}
  else if(kind==='sync'){
    const url=(d.url||'').trim(),key=(d.key||'').trim();
    if(!/^https:\/\//.test(url)||!key){SYS.status='error';SYS.msg='Enter your Worker URL (starting with https://) and the sync key.';render();return}
    const changed=url!==SY.url;SY.url=url;SY.key=key;if(changed){SY.last=0;SY.at=0}saveSync();SYS.status='idle';SYS.msg='';render();pull();return}
  else if(kind==='season'){const s=S.screen.find(x=>x.id===f.dataset.s),n=+d.eps;if(!s||!(n>0))return;s.seasons.push({n:s.seasons.length+1,eps:n})}
  touch();render();
});

render();
pull();

/* ---------- is there a newer copy? ---------- */
/* 2026.10.21-a -> sortable; a two-letter suffix (after z) still sorts after one */
function buildKey(v){const m=/^(\d{4})\.(\d\d)\.(\d\d)-([a-z]+)$/.exec(v||'');return m?m[1]+m[2]+m[3]+String(m[4].length)+m[4]:''}
const UPD={last:0,dismissed:null,shown:null};
async function checkUpdate(force){
  if(!/^https?:$/.test(location.protocol)||!window.fetch)return;
  if(!force&&Date.now()-UPD.last<5*60e3)return;
  UPD.last=Date.now();
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const html=await r.text();
    const m=html.match(/v:'(\d{4}\.\d\d\.\d\d-[a-z]+)'/);if(!m)return;
    const live=m[1];
    if(!(buildKey(live)>buildKey(BUILD))||live===UPD.dismissed)return;
    /* just reloaded for this build and still got the old copy: GitHub hasn't caught up, try again quietly */
    let tried=null;try{tried=sessionStorage.getItem('playback_upd_tried')}catch(e){}
    if(tried===live&&!force){setTimeout(()=>checkUpdate(true),60e3);return}
    showUpdate(live);
  }catch(e){}
}
function showUpdate(ver){
  UPD.shown=ver;
  document.getElementById('updtxt').textContent='Build '+ver+' is ready';
  const b=document.getElementById('updbar');b.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('up')));
}
document.getElementById('updgo').addEventListener('click',()=>{
  try{sessionStorage.setItem('playback_upd_tried',UPD.shown||'')}catch(e){}
  save();
  location.replace(location.pathname+'?v='+Date.now()+location.hash);
});
document.getElementById('updx').addEventListener('click',()=>{
  UPD.dismissed=UPD.shown;
  const b=document.getElementById('updbar');b.classList.remove('up');setTimeout(()=>{b.hidden=true},320);
});
if(/[?&]v=\d+/.test(location.search))try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
setTimeout(()=>checkUpdate(true),2500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
