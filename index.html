/* ---------- saving on this device ----------
   The log lives in IndexedDB, which holds hundreds of MB. localStorage (about
   5 MB per site, tightest on iPhone) keeps a quick-start copy only while the
   log is small; once it grows past LS_MAX characters, or localStorage refuses
   it, that copy is removed so a stale one can never load. If a save fails
   everywhere, a banner says so instead of failing silently. A missing
   localStorage copy at startup means: wait for IndexedDB before showing the
   log (READY), and never save until then. */
let READY=false;
const LS_MAX=1500000;
const blank=()=>({v:1,music:[],screen:[],marks:{},flags:{}});
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1){READY=true;return o}}}catch(e){}return blank()}
const IDB=(()=>{let p=null;
  const open=()=>p||(p=new Promise((res,rej)=>{
    if(!window.indexedDB)return rej(new Error('no IndexedDB'));
    const r=indexedDB.open('playback',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
  }).catch(e=>{p=null;throw e}));
  const run=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{
    const t=db.transaction('kv',mode),q=fn(t.objectStore('kv'));let out;
    q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=t.onabort=()=>rej(t.error||new Error('aborted'));
  }));
  return{get:k=>run('readonly',s=>s.get(k)),put:(k,v)=>run('readwrite',s=>s.put(v,k))};
})();
const SV={idb:null,ls:false,err:false,bytes:0};   /* idb: true saved / false failed / null not tried */
let idbNext=null,idbBusy=false;
function idbSave(txt){
  idbNext=txt;if(idbBusy)return;idbBusy=true;
  (function step(){const t=idbNext;idbNext=null;
    IDB.put(KEY,t).then(()=>{SV.idb=true},()=>{SV.idb=false}).finally(()=>{saveState();if(idbNext!==null)step();else idbBusy=false})})();
}
function saveState(){const err=SV.idb===false&&!SV.ls;if(err!==SV.err){SV.err=err;if(READY)render()}}
/* A rating means you've heard/watched it, so anything with a rating is always
   checked off. Runs on every save, which covers tapping a rating, the RYM
   imports, merges and synced data, and backfills items rated before this. */
function rateImpliesDone(){const m=S.marks;for(const k in m){const x=m[k];if(x&&x.r&&!x.done)m[k]={...x,done:true}}}
function save(){
  if(!READY)return;

  idbSave(txt);
  SV.ls=false;
  if(txt.length<=LS_MAX||SV.idb!==true){try{localStorage.setItem(KEY,txt);SV.ls=true}catch(e){}}
  if(!SV.ls){try{localStorage.removeItem(KEY)}catch(e){}}
  saveState();
}

function seedAll(){
  S.pendingR=S.pendingR||{};
  const aid=sid('artist','radiohead');
  let a=S.music.find(x=>x.id===aid);
  if(!a&&!S.flags.rhDeleted){a={id:aid,name:'Radiohead',groups:[]};S.music.push(a)}
  if(a&&!a.mbid){   /* once Radiohead comes from MusicBrainz, the hand-typed lists are retired */
    for(const [title,year,kind,tracks] of RADIOHEAD){
      const gid=sid(aid,title);
      let g=a.groups.find(x=>x.id===gid);
      if(!g){g={id:gid,title,year,kind,items:[]};a.groups.push(g)}
      for(const t of tracks){const id=sid(aid,title,t);if(!g.items.some(i=>i.id===id))g.items.push({id,title:t})}
    }
    if(!S.flags.rhAlbums){
      a.groups.filter(g=>g.kind==='Studio album').forEach(g=>g.items.forEach(i=>S.marks[i.id]={...(S.marks[i.id]||{}),done:true}));
      S.flags.rhAlbums=true;
    }
  }
  if(!S.flags.exSeverance){
    const id=sid('show','severance');
    S.screen.push({id,type:'show',title:'Severance',year:'2022',example:true,seasons:[{n:1,eps:9},{n:2,eps:10}]});
    [1,2,3].forEach(e=>S.marks[sid(id,'s',1,'e',e)]={done:true});
    S.flags.exSeverance=true;

  /* imported artists: fold back anything that duplicates a MusicBrainz song
     (an older copy of the app re-adding the hand-typed lists, say) */
  /* 2026.11.03-c: titles keep meaningful brackets now. Stored keys move to the new
     rule once (IDs stay, so checkmarks and ratings don't move). */
  if(!S.flags.key2){
    for(const a of S.music){const have=new Set(artistItems(a).map(mbItemKey));
      for(const g of a.groups)for(const i of g.items){const k=mbItemKey(i);if(k.includes('~')||k.includes('@'))continue;

/* A release from one artist folds into another's: ratings, checkmarks and songs move with it.
   With onlyMatch, a release that has no twin on the keeper is left where it is (returns false). */
function foldGroup(keep,g,onlyMatch){
  const tg=keep.groups.find(x=>x.kind===g.kind&&nTitle(x.title)===nTitle(g.title))
    ||(onlyMatch&&RATEABLE.includes(g.kind)?keep.groups.find(x=>RATEABLE.includes(x.kind)&&nTitle(x.title)===nTitle(g.title)):null);
  if(!tg){if(onlyMatch)return false;keep.groups.push(g);return true}
  if(g.w&&g.w.length&&!(tg.w&&tg.w.length))tg.w=g.w;   /* a collab credit comes along with the album */
  if(!rating(tg.id)&&rating(g.id))S.marks[tg.id]={...(S.marks[tg.id]||{}),r:rating(g.id),...rdCarry(g.id)};
  if(S.rymSeen&&S.rymSeen[g.id]!=null&&S.rymSeen[tg.id]==null)S.rymSeen[tg.id]=S.rymSeen[g.id];
  if(!rating(dxId(tg))&&rating(dxId(g)))S.marks[dxId(tg)]={...(S.marks[dxId(tg)]||{}),r:rating(dxId(g)),...rdCarry(dxId(g))};
  unmark(dxId(g),dxId(tg));
  unmark(g.id,tg.id);
  for(const i of g.items){
    const ti=tg.items.find(x=>mbItemKey(x)===mbItemKey(i));
    if(ti){mbFold(ti.id,i.id);unmark(i.id,ti.id);if(!(ti.f&&ti.f.length)&&i.f&&i.f.length)ti.f=i.f}
    else tg.items.push(i);
  }
  return true;
}

function collabParts(name){

/* An artist you already have under two spellings becomes one: Kanye West and Ye, "Travi$ Scott" and

      if(!keep.simg&&o.simg)keep.simg=o.simg;

      S.music=S.music.filter(x=>x!==o);
    }
    if(ARTIST_SHOW[key])keep.name=ARTIST_SHOW[key];
  }
  for(const c of [...S.music]){
    if(c.mbid)continue;
    const parts=collabParts(c.name);if(!parts.length)continue;
    const members=S.music.filter(m=>m!==c&&parts.includes(nArtist(m.name)));if(!members.length)continue;
    for(const g of [...c.groups]){
      const m=members.find(x=>x.groups.some(t=>RATEABLE.includes(t.kind)&&nTitle(t.title)===nTitle(g.title)));
      if(m){const w=collabOthers(c.name,m.name);if(w.length)g.w=w;
        if(foldGroup(m,g,true))c.groups=c.groups.filter(x=>x!==g);else delete g.w}
    }
    if(!c.groups.length)S.music=S.music.filter(x=>x!==c);

  linkTwins();
}

/* ---------- one album, several artists ----------
   An album made by two artists (Bruno Mars + Silk Sonic) sits on BOTH artist pages, each with its own
   copy of the release. The copies are linked ("twins"): a twin's ratings and checkmarks are kept under
   one shared id, so rating or checking a song on either page shows on the other. Twins are found again
   on every start and after every import: same album title, on two different artists, where one is
   credited on the other's copy ("with ...") or both came from the same MusicBrainz/Spotify release.
   Nothing is moved between pages and no song or album is removed. */
const TWIN=new Map();          /* a twin's id -> the shared id that holds its marks */
const TWIN_RAW=new WeakMap();  /* the marks proxy -> the plain marks object under it */
function canonK(k){
  if(!TWIN.size||typeof k!=='string')return k;
  const t=TWIN.get(k);if(t)return t;
  if(k.endsWith('~dx')){const u=TWIN.get(k.slice(0,-3));if(u)return u+'~dx'}
  return k;
}
const TWIN_MARKS={
  get:(t,k)=>t[canonK(k)],
  set:(t,k,v)=>{t[canonK(k)]=v;return true},
  has:(t,k)=>canonK(k) in t,
  deleteProperty:(t,k)=>{if(canonK(k)!==k)return true;delete t[k];return true}   /* a twin never owns marks, so deleting one must not wipe the shared record */
};
function twinWrap(){if(!S.marks||TWIN_RAW.has(S.marks))return;const p=new Proxy(S.marks,TWIN_MARKS);TWIN_RAW.set(p,S.marks);S.marks=p}
const twinRaw=()=>TWIN_RAW.get(S.marks)||S.marks;
/* remove a mark that has been folded onto another id, unless both are really the same shared record */
function unmark(id,into){if(canonK(id)!==canonK(into))delete S.marks[id]}
function linkTwins(){
  TWIN.clear();twinWrap();
  if(!Array.isArray(S.music)||S.music.length<2)return 0;
  const by=new Map();
  for(const a of S.music)for(const g of a.groups||[]){
    if(g.src==='kept'||!g.items||!g.items.length)continue;
    const k=(RATEABLE.includes(g.kind)?'*':g.kind)+'|'+nTitle(g.title);
    if(!by.has(k))by.set(k,[]);by.get(k).push({a,g});
  }
  const credits=(x,y)=>{const n=nArtist(y.a.name);return (x.g.w||[]).some(w=>nArtist(w)===n)};
  const related=(x,y)=>x.a!==y.a&&((x.g.mbid&&x.g.mbid===y.g.mbid)||credits(x,y)||credits(y,x));
  for(const list of by.values()){
    if(list.length<2)continue;
    const up=list.map((_,i)=>i),find=i=>up[i]===i?i:(up[i]=find(up[i]));
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++)if(related(list[i],list[j]))up[find(j)]=find(i);
    const comps=new Map();list.forEach((m,i)=>{const r=find(i);if(!comps.has(r))comps.set(r,[]);comps.get(r).push(m)});
    for(const comp of comps.values()){
      if(comp.length<2)continue;
      comp.sort((x,y)=>x.g.id<y.g.id?-1:x.g.id>y.g.id?1:0);   /* the lowest id keeps the marks, the same on every device */
      for(const m of comp.slice(1))TWIN.set(m.g.id,comp[0].g.id);
      const home=new Map();
      for(const m of comp)for(const i of m.g.items){
        const k=mbItemKey(i),h=home.get(k);
        if(!h)home.set(k,{id:i.id,g:m.g});
        else if(h.g!==m.g&&h.id!==i.id)TWIN.set(i.id,h.id);
      }
    }
  }
  /* marks already stored under a twin's own id (made before it was linked, or by an older copy of the app) move onto the shared id */
  const raw=twinRaw(),seen=S.rymSeen;
  for(const [al,ca] of TWIN)for(const suf of ['','~dx']){
    const m=raw[al+suf];
    if(m){const c=raw[ca+suf]||{},n={...m,...c};if(m.done)n.done=true;if(!n.r&&m.r)n.r=m.r;raw[ca+suf]=n;delete raw[al+suf]}
    if(seen&&seen[al+suf]!=null){if(seen[ca+suf]==null)seen[ca+suf]=seen[al+suf];delete seen[al+suf]}
  }

}
/* deleting an artist must not take a twin's ratings with it: the shared record moves to a surviving copy first */
function twinRehome(ids){
  const raw=twinRaw();
  for(const [al,ca] of TWIN){if(!ids.has(ca))continue;
    for(const suf of ['','~dx'])if(raw[ca+suf]!==undefined&&raw[al+suf]===undefined)raw[al+suf]=raw[ca+suf]}
}

/* ---------- derived ---------- */
const isDone=id=>!!(S.marks[id]&&S.marks[id].done);
const rating=id=>(S.marks[id]&&S.marks[id].r)||0;
/* the day a rating was set, kept as YYYY-MM-DD on the same mark (rd). Ratings made before this build have no day until you add one. */
const ratedDate=id=>(S.marks[id]&&S.marks[id].r&&S.marks[id].rd)||'';
const rdCarry=id=>ratedDate(id)?{rd:ratedDate(id)}:{};
const todayISO=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmtRd=d=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d||'');return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):''};
function artistItems(a){return a.groups.flatMap(g=>g.items)}
/* function declarations on purpose: the start-up tidy-up uses these before this point in the file runs */
function dxId(g){return g.id+'~dx'}                /* where an album's deluxe rating lives */
function dxName(g){return g.dxTitle||g.title+' (Deluxe)'}
/* a song's title and its guest artists, for display. Guests come from the import (i.f);
   older songs fall back to a "(feat. X)" already written in the title. The credit comes
   out of the title so it isn't shown twice; the stored title never changes. */
function songShow(i){
  const f=Array.isArray(i.f)?i.f.filter(Boolean):[],got=[];
  const word=f.length?'feat\\.?|ft\\.?|featuring|with':'feat\\.?|ft\\.?|featuring';
  let t=String(i.title).replace(new RegExp('\\s*[\\(\\[]\\s*(?:'+word+')\\s+([^\\)\\]]*)[\\)\\]]','ig'),(m,x)=>{got.push(x.trim());return ' '})
    .replace(new RegExp('\\s+[-\u2013\u2014]\\s*(?:'+word+')\\s+(.+)$','i'),(m,x)=>{got.push(x.trim());return ''})
    .replace(/\s+/g,' ').trim();
  if(!t)return{t:String(i.title),f};
  return{t,f:f.length?f:got.filter(Boolean)};
}
function epIds(s){return s.type==='film'?[s.id]:s.seasons.flatMap(se=>Array.from({length:se.eps},(_,k)=>sid(s.id,'s',se.n,'e',k+1)))}
function pct(ids){if(!ids.length)return 0;return Math.round(ids.filter(isDone).length/ids.length*100)}
const sxe=(n,e)=>'S'+String(n).padStart(2,'0')+'E'+String(e).padStart(2,'0');

/* Where you are in a show. A season is Finished when every episode is watched and
   nothing more is coming in it, Caught up when everything out so far is watched but
   more is on the way, and otherwise it shows the last episode you watched. The show
   as a whole stops at the furthest episode you have watched, which is not always
   the first unwatched one (you may have skipped a few). */
function showStatus(s){
  const seasons=[];let stop=null,watched=0;
  for(const se of s.seasons){
    if(!se.eps)continue;
    let d=0,last=0;
    for(let e=1;e<=se.eps;e++)if(isDone(sid(s.id,'s',se.n,'e',e))){d++;last=e}
    seasons.push({n:se.n,eps:se.eps,d,last,state:d===se.eps?((se.total||0)>se.eps?'caught':'done'):d?'going':'new'});
    if(last)stop=[se.n,last];
    watched+=d;
  }
  const more=s.seasons.some(se=>(se.total||0)>se.eps)||!!(s.next&&s.next.d);
  const all=seasons.length>0&&seasons.every(x=>x.d===x.eps);
  return{seasons,stop,watched,finished:seasons.filter(x=>x.state==='done').length,caught:all&&more,done:all&&!more};
}
function stopText(s,st){
  if(!st.watched)return '';
  const f=st.finished,fs=f?' · '+f+' season'+(f===1?'':'s')+' finished':'';
  if(st.done)return st.seasons.length===1?'Finished':'All '+st.seasons.length+' seasons finished';
  if(st.caught)return 'Caught up at '+sxe(st.stop[0],st.stop[1])+fs;
  return 'Stopped at '+sxe(st.stop[0],st.stop[1])+fs;
}
const seasonTag=(st,n)=>{const x=st.seasons.find(y=>y.n===n);
  return !x?'':x.state==='done'?'<span class="tag">Finished</span>':x.state==='caught'?'<span class="tag">Caught up</span>':x.state==='going'?'<span class="tag">Stopped at E'+x.last+'</span>':''};

function upNext(){
  const out=[];
  for(const a of S.music){
    for(const g of a.groups){const i=g.items.find(x=>!isDone(x.id));if(i){out.push({tab:'music',id:a.id,t:i.title,s:a.name+' · '+g.title});break}}
  }
  for(const s of S.screen){
    const on=s.watch&&s.watch.s&&s.watch.s[0]?s.watch.s[0][0]:'';
    if(s.type==='film'){if(!isDone(s.id))out.push({tab:'screen',id:s.id,t:s.title,s:'Film'+(s.year?' · '+s.year:''),on});continue}
    let found=null;
    for(const se of s.seasons){for(let e=1;e<=se.eps;e++){if(!isDone(sid(s.id,'s',se.n,'e',e))){found=[se.n,e];break}}if(found)break}
    if(found)out.push({tab:'screen',id:s.id,t:s.title,s:sxe(found[0],found[1])+' is next',on});
    else if(s.next&&s.next.d&&s.next.d>=new Date().toISOString().slice(0,10))out.push({tab:'screen',id:s.id,t:s.title,s:sxe(s.next.n,s.next.e)+' out '+tmDay(s.next.d),on});
  }
  return out;
}

/* ---------- MusicBrainz discography import ----------
   One paged sweep of the artist's official releases, each page carrying full
   tracklists, at no more than one request a second (MusicBrainz's rule).
   A song is identified by its normalized title (case, punctuation, "&"/"and",
   subtitles in brackets and "remastered"-type tags ignored), so the same song
   on an album, a single, a deluxe edition and a remaster is ONE item.
   Placement: studio albums claim their songs first, oldest first, using the
   edition most pressings share; then EPs, singles, compilations and the rest
   in release order, so a B-side lands on the release that first carried it;
   then (only with "other versions" ticked) songs that only exist on a
   bonus edition of a release join that release. Only digital releases
   count, since that is what streaming services carry. Live albums, remixes, demos and alternate versions are skipped
   unless asked for. Item IDs come from the title key, and an item that is
   already in the log keeps its ID, so checkmarks and ratings never move. */
const MB_API='https://musicbrainz.org/ws/2/';
const RH_MBID='a74b1b7f-71a5-4011-9441-d0b5e4122711';
const MBX={q:'',results:null,pick:null,versions:false,searching:false,busy:false,cancel:false,where:'side',aid:null,name:'',step:'',n:0,of:0,note:'',err:'',report:'',errWhere:'side'};

let mbLast=0;
function MBError(code,status){const e=new Error(code);e.code=code;e.status=status;return e}
async function mbGet(path,params){
  for(let tries=0;;tries++){
    const wait=mbLast+1100-Date.now();if(wait>0)await mbSleep(wait);
    if(MBX.cancel)throw MBError('cancel');
    mbLast=Date.now();
    let r;
    /* no custom headers: browsers won't let a page set User-Agent, and any
       extra header would force a CORS preflight. fmt=json is all it needs. */
    try{r=await fetch(MB_API+path+'?'+new URLSearchParams(Object.assign({},params,{fmt:'json'})))}
    catch(e){throw MBError(navigator.onLine===false?'offline':'network')}
    if(r.status===503||r.status===429){
      if(tries>=4)throw MBError('busy');
      const ra=parseInt(r.headers.get('retry-after'),10);
      MBX.note='MusicBrainz asked us to slow down, waiting a moment';mbProgress();
      await mbSleep((ra>0?Math.min(ra,20):2+tries*3)*1000);
      MBX.note='';continue;
    }
    if(!r.ok)throw MBError('http',r.status);
    try{return await r.json()}catch(e){throw MBError('http',r.status)}
  }
}
function mbMessage(e,q){
  const c=e&&e.code;
  if(c==='offline')return "You're offline. Connect to the internet and try again. Nothing in your log was changed.";
  if(c==='network')return "Couldn't reach MusicBrainz. Check your connection; if that's fine, MusicBrainz may be down for a few minutes. Nothing in your log was changed.";
  if(c==='busy')return 'MusicBrainz is limiting requests right now (it allows about one a second, shared by everyone). Wait a minute and try again. Nothing in your log was changed.';
  if(c==='http')return 'MusicBrainz sent back an error ('+e.status+'). Try again in a few minutes. Nothing in your log was changed.';
  if(c==='nomatch')return 'No artists on MusicBrainz match “'+q+'”. Check the spelling, or try fewer words.';
  if(c==='empty')return 'MusicBrainz has no official releases with tracklists for this artist, so there was nothing to import.';
  if(c==='cancel')return 'Import cancelled. Nothing in your log was changed.';
  return 'Something went wrong while reading MusicBrainz. Nothing in your log was changed.';
}

/* ---- titles ---- */
function mbNorm(s){return String(s).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/[‘’`´']/g,'').replace(/[&+]/g,' ').replace(/[^a-z0-9]+/g,' ')
  .replace(/\band\b/g,' ').replace(/\s+/g,' ').trim()}
/* what a tag in brackets (or after " - ") means: 'alt' = a different version,
   'same' = the same song (remasters, edits, mono), null = part of the title */
function mbVClass(d){
  const s=String(d).toLowerCase().replace(/["“”‘’']/g,'').replace(/\s+/g,' ').trim();
  if(!s)return null;
  if(/\b(live|demo|remix|rmx|rework|reworked|acoustic|instrumental|session|sessions|rehearsal|unplugged|orchestral|a ?cappella|karaoke|alternate|outtake|early)\b/.test(s))return 'alt';
  if(/\bremaster(ed)?\b|\b(mono|stereo|explicit|clean|bonus)\b/.test(s))return 'same';
  if(/^(radio|single|album|lp|original|short|long|full[- ]?length|7|7 inch|12|12 inch)? ?(edit|version|mix)$/.test(s))return 'same';
  if(/\b(mix|version|edit|take|dub)\b/.test(s))return 'alt';
  return null;
}
/* brackets that are just credits ("feat. X", "with Y", "from the film") */
const MB_CREDIT=/^\s*(feat\.?|ft\.?|featuring|with|prod\.?|produced by|from)\s/i;
/* only version tags and credits come off the title; anything else in brackets
   is part of it, so "Song (Reprise)" and "Song (Part 2)" stay separate songs */
function mbSplit(title){
  const descs=[];let base=String(title);
  const stripped=base.replace(/\s*[\(\[]([^\)\]]*)[\)\]]/g,(m,inner)=>{if(mbVClass(inner)||MB_CREDIT.test(inner)){descs.push(inner);return ' '}return m});
  if(stripped.trim())base=stripped;else descs.length=0;            /* "(Nice Dream)" is the whole title */
  const dash=base.match(/^(.*\S)\s+[-–—]\s+(.+)$/);
  if(dash&&(mbVClass(dash[2])||MB_CREDIT.test(dash[2]))){descs.push(dash[2]);base=dash[1]}
  return{base:base.replace(/\s+/g,' ').trim(),descs};
}
const mbK=s=>mbNorm(s).replace(/ /g,'');
function mbKeyOf(title){return mbK(mbSplit(title).base)||mbK(title)}
/* A looser key, used ONLY as a fallback when a song has no exact match. A subtitle in brackets comes off
   ("2 + 2 = 5 (The Lukewarm.)", "Don't Rely on Other Men (Album)"), but brackets that make a different song
   stay ("(Reprise)", "(Part 2)", "(Intro)"), and a title that is all brackets ("(Nice Dream)") stays whole. */
const MB_KEEP_BRACKET=/\b(reprise|part|pt|pts|interlude|intro|outro|medley|skit|prelude|postlude)\b|^\s*\d+\s*$/i;
function mbLoose(title){
  const t=mbSplit(title).base,s=t.replace(/\s*[\(\[]([^\)\]]*)[\)\]]/g,(m,inner)=>MB_KEEP_BRACKET.test(inner)?m:' ');
  return mbK(s.trim()?s:t);
}
/* When two songs fit a title loosely, the plain one wins if exactly one of them is plain, meaning its own
   title has nothing in brackets to ignore: "don't rely on other men" beats "don't rely on other men (single)".
   Two plain songs, or none, and nothing is guessed. */
function mbPickLoose(hits,lk,keyOf){
  if(hits.length===1)return hits[0];
  const plain=hits.filter(t=>keyOf(t)===lk);
  return plain.length===1?plain[0]:null;
}
/* the one song in a list that fits a title loosely; none when nothing fits or when it stays ambiguous */
function mbLooseFind(items,title){
  const lk=mbLoose(title);if(!lk)return null;
  const hits=items.filter(i=>{const k=mbItemKey(i);return !k.includes('~')&&!k.includes('@')&&mbLoose(i.title)===lk});
  return hits.length?mbPickLoose(hits,lk,mbItemKey):null;
}
/* Typos ("Battlefied", "ViIllage", "Festral"). A one-letter slip on its own proves nothing, so this is only
   ever used for a whole group of songs at once (see mbMerge): a key needs 14+ characters to allow 1 slip and
   30+ to allow 2, songs that differ in a digit never match, and a song needs ONE clearly closest candidate. */
const mbFuzzyMax=len=>len>=30?2:len>=14?1:0;
function mbDist(a,b,max){   /* edit distance, giving up (max+1) as soon as it is certain to be over max */
  if(Math.abs(a.length-b.length)>max)return max+1;
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const cur=[i];let lo=i;
    for(let j=1;j<=b.length;j++){const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));cur[j]=v;if(v<lo)lo=v}
    if(lo>max)return max+1;prev=cur}
  return prev[b.length];
}
function mbFuzzyPick(k,cands){   /* the one song whose key is within the allowed slips of k and at least 2 closer than any other */
  const max=mbFuzzyMax(k.length);if(!max)return null;
  const dg=k.replace(/\D/g,'');let best=null,d1=max+3,d2=max+3;
  for(const c of cands){if(c.k.replace(/\D/g,'')!==dg)continue;
    const d=mbDist(k,c.k,max+2);if(d>max+2)continue;
    if(d<d1){d2=d1;d1=d;best=c}else if(d<d2)d2=d}
  return best&&d1<=max&&d2>=d1+2?best:null;
}
function mbTrack(t,rgid){
  const rec=t.recording||{};if(rec.video)return null;
  const title=String(rec.title||t.title||'').trim();
  if(!title||/^\[[^\]]*\]$/.test(title))return null;               /* [untitled], [silence], [data track] */
  const sp=mbSplit(title),key=mbK(sp.base)||mbK(title);if(!key)return null;
  let alt=null,fromDis=false;
  for(const d of sp.descs)if(mbVClass(d)==='alt'){alt=d;break}
  const dis=String(rec.disambiguation||'');
  if(!alt&&dis&&mbVClass(dis)==='alt'){alt=dis;fromDis=true}
  const f=Array.isArray(t.feat)&&t.feat.length?{f:t.feat}:{};      /* guest artists, when the source lists them */
  if(!alt)return{key,title,...f};
  const live=/\blive\b/i.test(alt);
  return{key,title:fromDis?title+' ('+(live?'live':dis)+')':title,...f,alt:true,altKey:key+'~'+(live?'live@'+rgid:mbK(alt)),
    take:/\b(live|demo|acoustic|session|sessions|rehearsal|unplugged|early|outtake)\b/i.test(alt)};   /* remixes and "versions" never stand in for the song */
}

/* ---- fetch + build ---- */
async function mbFetchCatalog(mbid){
  const rels=[];let off=0,total=0,inc='recordings+release-groups+artist-credits';
  for(;;){
    let j;
    try{j=await mbGet('release',{artist:mbid,status:'official',inc,limit:100,offset:off})}
    catch(e){if(e.code==='http'&&e.status===400&&/artist-credits/.test(inc)){inc='recordings+release-groups';continue}throw e}   /* no credits, no features: the import still works */
    const got=j.releases||[];total=j['release-count']||0;rels.push(...got);off+=got.length;
    MBX.step='Reading releases';MBX.n=Math.min(off,total);MBX.of=total;mbProgress();
    if(!got.length||off>=total)break;
  }
  /* anyone else credited on the release itself made it with this artist */
  for(const r of rels){const w=[];for(const c of r['artist-credit']||[]){const nm=c&&c.artist&&c.artist.id!==mbid?String(c.name||c.artist.name||'').trim():'';if(nm&&!/^various artists$/i.test(nm)&&!w.includes(nm))w.push(nm)}if(w.length)r.w=w}
  /* anyone credited on a track besides this artist is a guest on it */
  for(const r of rels)for(const m of r.media||[])for(const t of m.tracks||[]){
    const ac=t['artist-credit']||(t.recording&&t.recording['artist-credit'])||[];
    const f=[];for(const c of ac){const nm=c&&c.artist&&c.artist.id!==mbid?(c.name||c.artist.name):'';if(nm&&!f.includes(nm))f.push(nm)}
    if(f.length)t.feat=f;
  }
  return rels;
}
const MB_KIND_ORDER=['Studio album','EP','Single','Compilation','Live','Other'];
function mbDateKey(d){d=String(d||'');const p=d.split('-');return d?(p[0]||'9999')+'-'+(p[1]||'99')+'-'+(p[2]||'99'):'9999-99-99'}
/* the longest other edition is "the deluxe": its title and cover (release-level cover art) */
function mbDeluxeLook(eds,base){
  const d=(eds||[]).filter(e=>e.n).sort((a,b)=>b.n-a.n)[0];if(!d)return {};

async function mbImport(art,where,forceMb){

    if(!groups){

}

/* ---------- Rate Your Music album ratings ----------
   RYM's export is one row per rated release (ratings already run 1-10). Each
   rating goes onto the matching album or EP here; anything not here yet waits in
   S.pendingR and fills in the moment that artist is imported. Matching is by
   artist and title, never by year: RYM often carries a reissue date. */
const RATEABLE=['Studio album','EP','Live','Compilation','Other'];
const RYX={err:'',report:null};
const decodeEnt=x=>{const t=document.createElement('textarea');t.innerHTML=x;return t.value};
const nrm=x=>decodeEnt(String(x)).normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\$/g,'s').replace(/&/g,' and ').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
/* one artist who goes by two names: the left name is read as the right one (Ye is Kanye West) everywhere
   artists are matched (RYM imports, Spotify plays, imports), so they never split in two */
const ARTIST_SAME={'ye':'kanye west'};
const ARTIST_SHOW={'kanye west':'Kanye West'};   /* the name it is shown under, whichever name an import brings */
/* ARTIST_SAME is the short fixed list; AKA is built from every artist's own "also known as" names

let AKA={};
const akaKey=x=>nrm(x).replace(/^the /,'');
const nArtist=x=>{const n=akaKey(x);return ARTIST_SAME[n]||AKA[n]||n};
function rebuildAka(){
  const m={},own=new Map();
  for(const a of S.music){const k=ARTIST_SAME[akaKey(a.name)]||akaKey(a.name);if(!own.has(k))own.set(k,new Set());own.get(k).add(a.mbid||'')}
  for(const a of S.music){
    if(!Array.isArray(a.aka)||!a.aka.length)continue;
    const home=ARTIST_SAME[akaKey(a.name)]||akaKey(a.name);
    for(const n of a.aka){
      for(const k of [akaKey(n),akaKey(a.name+' '+n),akaKey(n+' '+a.name)]){   /* "공중도둑 (Mid-Air Thief)" reads as him too */
        if(!k||k===home||ARTIST_SAME[k])continue;
        const o=own.get(k);if(o&&[...o].some(id=>id&&id!==a.mbid))continue;   /* a different MusicBrainz artist with that very name is someone else */
        m[k]=home}}

}
/* the other names MusicBrainz lists for an artist (search results and lookups both carry them) */
function mbAkas(x){
  const out=[],seen=new Set([akaKey(x.name||'')]);
  for(const al of (x.aliases||[])){const n=al&&al.name;if(!n)continue;const k=akaKey(n);if(!k||seen.has(k))continue;seen.add(k);out.push(n)}
  return out.slice(0,12);
}
/* an artist's saved "also known as" list: MusicBrainz aliases, the Spotify name, and any earlier name */
function akaSet(a,art,sp,prev){
  const names=[art&&art.name,...((art&&art.aka)||[]),sp&&sp.name,prev,...(a.aka||[])].filter(Boolean);
  const seen=new Set([akaKey(a.name)]),out=[];
  for(const n of names){const k=akaKey(n);if(!k||seen.has(k))continue;seen.add(k);out.push(n)}
  a.aka=out.slice(0,12);
}
/* during an import, before the artist is saved, so Spotify's name already matches */
function akaRemember(art){const h=akaKey(art.name);for(const n of (art.aka||[])){const k=akaKey(n);if(k&&k!==h&&!ARTIST_SAME[k]&&!AKA[k])AKA[k]=ARTIST_SAME[h]||h}}
let akaBusy=false;
/* artists imported before this build have no alias list yet: fetch them quietly, one a second */
async function akaBackfill(){
  if(akaBusy||MBX.busy||MBX.searching||navigator.onLine===false)return;
  const todo=S.music.filter(a=>a.mbid&&a.akaAt==null);if(!todo.length)return;
  akaBusy=true;let n=0;
  try{for(const a of todo){
    if(MBX.busy||MBX.searching)break;
    const j=await mbGet('artist/'+a.mbid,{inc:'aliases'});
    akaSet(a,{name:a.name,aka:mbAkas(j)});a.akaAt=Date.now();n++}}
  catch(e){}
  finally{akaBusy=false}

}
const nTitle=x=>nrm(String(x).replace(/\s*[\(\[][^)\]]*(deluxe|remaster|edition|version|anniversary|expanded)[^)\]]*[\)\]]/ig,''));
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows;
}
function rymEntries(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('shape');
  const H=rows[0].map(h=>h.trim().toLowerCase()),ix=n=>H.indexOf(n);
  if(['title','rating','last name'].some(n=>ix(n)<0))throw new Error('shape');
  const get=(r,n)=>ix(n)<0?'':String(r[ix(n)]||'').trim();
  const by=new Map();let zero=0;
  for(const r of rows.slice(1)){
    const title=decodeEnt(get(r,'title')),rate=parseFloat(get(r,'rating'));
    if(!title)continue;
    if(!(rate>0)){zero++;continue}
    const prim=decodeEnt([get(r,'first name'),get(r,'last name')].filter(Boolean).join(' ')),br=prim.match(/\[(.+)\]\s*$/);
    const fl=get(r,'first name localized'),ll=get(r,'last name localized');
    const display=br?br[1]:prim;
    const names=[...new Set([display,prim,fl&&ll?fl+' '+ll:'',fl&&ll?ll+' '+fl:'',ll].filter(Boolean).map(nArtist))];
    const key=nArtist(display)+'|'+nTitle(title),yr=parseInt(get(r,'release_date'))||9999;
    const e={key,a:display,t:title,r:Math.min(10,rate),n:names,yr};
    const o=by.get(key);if(!o)by.set(key,{...e,dups:[]});
    else{const keep=e.yr<o.yr?e:o,drop=keep===e?o:e;
      by.set(key,{...keep,dups:[...o.dups,...(drop.r!==keep.r?[drop.r]:[])]})}
  }
  return{list:[...by.values()],zero};
}
const pendingFor=a=>{const k=nArtist(a.name);return Object.entries(S.pendingR||{}).filter(([,p])=>p.n.includes(k))};
function rymGroup(a,tk){return a.groups.find(g=>RATEABLE.includes(g.kind)&&nTitle(g.title)===tk)}
/* ratings that were waiting for this artist's albums land on them now */
function applyPending(a){
  let n=0;
  for(const [key,p] of pendingFor(a)){
    const g=rymGroup(a,key.split('|')[1]);if(!g)continue;
    if(!rating(g.id)){S.marks[g.id]={...(S.marks[g.id]||{}),r:p.r};n++}
    rymNote(g.id,p.r);delete S.pendingR[key];

/* artists you do not have yet come in with just the albums you rated (no songs
   until you pull the tracklist from MusicBrainz); their ratings go straight on */
function rymAddWaiting(){
  const out={artists:0,albums:0},made=new Map();
  for(const [key,p] of Object.entries(S.pendingR||{})){
    const k=nArtist(p.a);let a=made.get(k);
    if(!a){if(S.music.some(x=>p.n.includes(nArtist(x.name))))continue;
      a={id:sid('artist',p.a),name:p.a,groups:[]};made.set(k,a)}
    const g={id:sid(a.id,p.t),title:p.t,year:p.y&&p.y<9999?String(p.y):'—',kind:'Studio album',items:[]};
    if(a.groups.some(x=>x.id===g.id))continue;
    a.groups.push(g);S.marks[g.id]={...(S.marks[g.id]||{}),r:p.r};rymNote(g.id,p.r);delete S.pendingR[key];out.albums++;
  }
  [...made.values()].sort((x,y)=>x.name.localeCompare(y.name)).forEach(a=>{a.groups.sort((x,y)=>(x.year>y.year)-(x.year<y.year));S.music.push(a);out.artists++});
  return out;
}
const rymMissing=()=>Object.values(S.pendingR||{}).filter(p=>!S.music.some(x=>p.n.includes(nArtist(x.name)))).length;
function rymImport(text){
  RYX.err='';RYX.report=null;
  try{
    const {list,zero}=rymEntries(text);
    S.pendingR=S.pendingR||{};
    const rp={total:list.length,zero,filled:0,same:0,kept:[],waiting:[],notFound:[],dups:[]};
    for(const e of list){
      if(e.dups.length)rp.dups.push(e.a+' – '+e.t+': kept '+fmt(e.r)+' (also '+e.dups.map(fmt).join(', ')+')');
      const a=S.music.find(x=>e.n.includes(nArtist(x.name)));
      const g=a&&rymGroup(a,e.key.split('|')[1]);
      if(g){
        const cur=rating(g.id);delete S.pendingR[e.key];rymNote(g.id,e.r);
        if(!cur){S.marks[g.id]={...(S.marks[g.id]||{}),r:e.r};rp.filled++}
        else if(cur===e.r)rp.same++;
        else rp.kept.push(e.a+' – '+e.t+': you have '+fmt(cur)+' here, RYM says '+fmt(e.r));
      }else{

    rp.added=rymAddWaiting();

  }

}
function rymReport(){
  const r=RYX.report,cnt=(n,w)=>n+' '+w+(n===1?'':'s');
  const byArtist=l=>{const m={};l.forEach(e=>m[e.a]=(m[e.a]||0)+1);return Object.entries(m).sort((x,y)=>y[1]-x[1]||x[0].localeCompare(y[0])).map(([k,v])=>esc(k)+' ('+v+')').join(', ')};
  let h=`<div class="mbok rymrep" role="status"><span><b>${cnt(r.total,'rated album')}</b> in your file. ${r.filled} filled in now${r.same?', '+r.same+' already matched':''}.</span>`;

  if(r.dups.length)h+=`<details><summary>${cnt(r.dups.length,'album')} appeared twice in your file</summary><ul>${r.dups.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="note">I used the earliest release.</p></details>`;

function rymSide(){

    <div><label class="btn primary" for="rym-file">Choose CSV file</label><input type="file" id="rym-file" accept=".csv,text/csv,text/plain" hidden></div>`;
  if(RYX.err)h+=`<p class="mberr" role="alert">${esc(RYX.err)}</p>`;
  if(RYX.report)h+=rymReport();
  const miss=rymMissing();
  if(miss)h+=`<div><button class="btn" data-act="rymadd">Add the ${miss} waiting album${miss===1?'':'s'} and their artists</button></div>`;
  if(!RYX.report&&n-miss>0)h+=`<p class="note">${cnt0(n-miss)} held for albums not found under an artist you have.</p>`;
  return h+'</div>';
}
const cnt0=n=>n+' rating'+(n===1?'':'s');

/* ---------- Rate Your Music song ratings ----------
   RYM's CSV export has no song ratings, so a small Tampermonkey script
   (rym-helper.user.js in this repo) reads them off the album pages you open on
   RYM and queues them. It hands the queue over with postMessage; anything that
   lands goes back as "done" and leaves the queue, the rest waits for that artist
   or album to be here. A song rating you already set is never overwritten. */
const RTX={bridge:false,queue:[],report:null};
const HELPER_URL='https://frostie4life9.github.io/playback/rym-helper.user.js';
const rtClean=x=>{                        /* the queue comes from outside the app: check every field */
  if(!x||typeof x!=='object'||typeof x.url!=='string'||!/^https:\/\/rateyourmusic\.com\/release\//.test(x.url))return null;
  const str=(v,n)=>typeof v==='string'?v.slice(0,n):'';
  const artists=(Array.isArray(x.artists)?x.artists:[]).map(a=>str(a,200)).filter(Boolean).slice(0,10);
  const tracks=(Array.isArray(x.tracks)?x.tracks:[]).map(t=>({t:str(t&&t.t,300),r:Math.round(Math.min(10,Math.max(0,+(t&&t.r)||0))*2)/2})).filter(t=>t.t&&t.r>0).slice(0,200);
  const title=str(x.title,300);
  if(!title||!artists.length||!tracks.length)return null;
  return{url:x.url,title,artists,tracks,tracklist:(Array.isArray(x.tracklist)?x.tracklist:[]).map(t=>str(t,300)).filter(Boolean).slice(0,200)};
};
window.addEventListener('message',e=>{
  if(e.source!==window||e.origin!==location.origin)return;
  const d=e.data;if(!d||d.src!=='rym-bridge'||d.type!=='queue'||!Array.isArray(d.items))return;
  RTX.bridge=true;RTX.queue=d.items.map(rtClean).filter(Boolean);
  if(UI.tab==='music')render();
});
const rtAsk=()=>window.postMessage({src:'playback',type:'ask'},location.origin);
setTimeout(rtAsk,300);setTimeout(rtAsk,2000);           /* the helper loads after the page */
function rtArtist(names){const ns=names.map(nArtist);return S.music.find(x=>ns.includes(nArtist(x.name)))}
function rtGroup(a,title){const k=nTitle(title),hits=a.groups.filter(g=>nTitle(g.title)===k);return hits.find(g=>RATEABLE.includes(g.kind))||hits[0]}
function rtImport(){
  const rp={albums:0,filled:0,same:0,kept:[],missing:[],songs:[],made:0,loose:[]},done=[];
  for(const e of RTX.queue){
    const a=rtArtist(e.artists),g=a&&rtGroup(a,e.title);
    if(!g){rp.missing.push(e.artists[0]+' – '+e.title+(a?' (album not found under '+a.name+')':' (artist not here yet)'));continue}
    /* an album that came in from the CSV has no songs yet: give it RYM's tracklist,
       with the same song IDs a later MusicBrainz import uses, so nothing doubles */
    if(!g.items.length){
      const seen=new Map();a.groups.forEach(x=>x.items.forEach(i=>seen.set(mbItemKey(i),i.id)));
      for(const t of (e.tracklist.length?e.tracklist:e.tracks.map(x=>x.t))){const k=mbKeyOf(t);if(!k||seen.has(k))continue;
        const id=sid(a.id,'song',k);seen.set(k,id);g.items.push({id,title:t,k});rp.made++}
    }
    const byKey=new Map();g.items.forEach(i=>byKey.set(mbItemKey(i),i));
    const other=new Map();a.groups.forEach(x=>x.items.forEach(i=>{const k=mbItemKey(i);if(!other.has(k))other.set(k,i)}));
    for(const t of e.tracks){
      let i=byKey.get(mbKeyOf(t.t))||other.get(mbKeyOf(t.t));
      if(!i){   /* no exact match: the one song on this album (or else this artist) with the same title minus a bracketed subtitle */
        i=mbLooseFind(g.items,t.t)||mbLooseFind(artistItems(a),t.t);
        if(i)rp.loose.push(t.t+' → '+i.title)}
      if(!i){rp.songs.push(e.artists[0]+' – '+e.title+': '+t.t);continue}
      const cur=rating(i.id);rymNote(i.id,t.r);
      if(!cur){S.marks[i.id]={...(S.marks[i.id]||{}),r:t.r};rp.filled++}
      else if(cur===t.r)rp.same++;
      else rp.kept.push(i.title+': you have '+fmt(cur)+' here, RYM says '+fmt(t.r));
    }
    rp.albums++;done.push(e.url);
  }
  RTX.report=rp;
  if(done.length){RTX.queue=RTX.queue.filter(e=>!done.includes(e.url));window.postMessage({src:'playback',type:'done',urls:done},location.origin);touch()}
}
function rtSide(){
  const cnt=(n,w)=>n+' '+w+(n===1?'':'s');
  let h=`<div class="add"><span class="label">Song ratings from Rate Your Music</span>`;
  if(!RTX.bridge)h+=`<p class="note">RYM's file has no song ratings. On a computer, install the Playback RYM helper in Tampermonkey, then open your album pages on RYM; each one you open is saved for here. It never loads pages on its own.</p>
    <div><a class="btn" href="${HELPER_URL}" target="_blank" rel="noopener">Install the helper</a></div>`;
  else if(!RTX.queue.length)h+=`<p class="note">The helper is on. Open your album pages on RYM, 10 to 15 tabs at a time, and they will wait here.</p>`;
  else{const n=RTX.queue.reduce((x,e)=>x+e.tracks.length,0);
    h+=`<p class="note">${cnt(RTX.queue.length,'album')} waiting, ${cnt(n,'song rating')}.</p><div><button class="btn primary" data-act="rtimport">Import song ratings</button></div>`}
  const r=RTX.report;
  if(r){h+=`<div class="mbok rymrep" role="status"><span><b>${r.filled} song rating${r.filled===1?'':'s'}</b> filled in across ${cnt(r.albums,'album')}${r.same?', '+r.same+' already matched':''}.</span>`;
    if(r.made)h+=`<span>${cnt(r.made,'song')} added from RYM's tracklists to albums that had none yet.</span>`;
    if(r.kept.length)h+=`<details><summary>${cnt(r.kept.length,'rating')} differed, so I kept yours</summary><ul>${r.kept.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`;
    if(r.loose&&r.loose.length)h+=`<details><summary>${cnt(r.loose.length,'song')} matched on a slightly different title</summary><ul>${r.loose.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="note">RYM's title is on the left, the song here on the right.</p></details>`;
    if(r.songs.length)h+=`<details><summary>${cnt(r.songs.length,'song')} not found on the album here</summary><ul>${r.songs.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></details>`;
    if(r.missing.length)h+=`<details><summary>${cnt(r.missing.length,'album')} still waiting</summary><ul>${r.missing.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><p class="note">Import that artist (or the RYM file) and tap Import again.</p></details>`;
    h+='</div>'}
  return h+'</div>';
}

/* ---------- Export your ratings ----------
   Spreadsheets (CSV) of everything you rated, plus a "Not yet in Rate Your Music"
   list, since RYM has no import and those are the ones you type in by hand.
   S.rymSeen remembers the rating RYM had for each album and song the last time it
   came from RYM (the RYM file or the song-ratings helper). Anything rated here that
   was never there, or differs from it, is "not yet in RYM". S.flags.rymBase is set
   once you tell Playback the ratings it already has are on RYM. */
const EXP={open:false};
function rymNote(id,r){(S.rymSeen=S.rymSeen||{})[canonK(id)]=r}
const csvCell=(v,text)=>{let s=v==null?'':String(v);if(text&&/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const csvText=(head,rows)=>'﻿'+[head,...rows].map(r=>r.map(c=>csvCell(c,typeof c==='string')).join(',')).join('\r\n')+'\r\n';
function dlCSV(name,text){
  const day=new Date().toISOString().slice(0,10),url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name.replace('.csv','-'+day+'.csv');
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
const xYear=g=>/^\d{4}/.test(g.year||'')?String(g.year).slice(0,4):'';
const xArtists=()=>[...S.music].sort((x,y)=>x.name.localeCompare(y.name));
const xGroups=a=>[...a.groups].sort((x,y)=>(xYear(x)||'9999').localeCompare(xYear(y)||'9999')||x.title.localeCompare(y.title));
const r2=v=>Math.round(v*100)/100;
function csvAlbums(){
  const rows=[],once=new Set();
  for(const a of xArtists())for(const g of xGroups(a)){
    if(!RATEABLE.includes(g.kind)||once.has(canonK(g.id)))continue;once.add(canonK(g.id));
    const its=stdItems(g),r=rating(g.id),rs=its.map(i=>rating(i.id)).filter(Boolean);
    if(r||rs.length)rows.push([a.name,g.title,xYear(g),g.kind,r||'',rs.length?r2(rs.reduce((x,y)=>x+y,0)/rs.length):'',rs.length,its.length]);
    if(hasDx(g)){const dr=rating(dxId(g)),drs=g.items.map(i=>rating(i.id)).filter(Boolean);   /* the deluxe edition, rated on its own */
      if(dr)rows.push([a.name,dxName(g),xYear(g),g.kind,dr,drs.length?r2(drs.reduce((x,y)=>x+y,0)/drs.length):'',drs.length,g.items.length])}
  }
  return csvText(['Artist','Release','Year','Type','Album rating','Song average','Songs rated','Songs in list'],rows);
}
function csvSongs(){
  const rows=[],seen=new Set();
  for(const a of xArtists())for(const g of xGroups(a))for(const i of g.items){
    const r=rating(i.id);if(!r||seen.has(canonK(i.id)))continue;seen.add(canonK(i.id));
    rows.push([a.name,g.title,xYear(g),g.kind,i.title,r]);
  }
  return csvText(['Artist','Release','Year','Type','Song','Rating'],rows);
}
function csvScreen(){
  const rows=[];
  for(const s of [...S.screen].sort((x,y)=>x.title.localeCompare(y.title))){
    const y=/^\d{4}/.test(s.year||'')?String(s.year).slice(0,4):'';
    if(s.type==='film'){if(rating(s.id))rows.push(['Film',s.title,y,'','',rating(s.id)]);continue}
    if(rating(s.id))rows.push(['Show',s.title,y,'','',rating(s.id)]);
    for(const se of s.seasons){
      const sr=rating(sid(s.id,'s',se.n));if(sr)rows.push(['Season',s.title,y,se.n,'',sr]);
      for(let e=1;e<=se.eps;e++){const er=rating(sid(s.id,'s',se.n,'e',e));if(er)rows.push(['Episode',s.title,y,se.n,e,er])}
    }
  }
  return csvText(['Type','Title','Year','Season','Episode','Rating'],rows);
}
function rymTodo(){
  const seen=S.rymSeen||{},out=[],done=new Set();
  const add=(a,g,i)=>{const id=canonK(i?i.id:g.id),r=rating(id);if(!r||seen[id]===r||done.has(id))return;done.add(id);
    out.push({a:a.name,rel:g.title,song:i?i.title:'',r,was:seen[id]||0})};
  for(const a of xArtists())for(const g of xGroups(a)){if(RATEABLE.includes(g.kind)){add(a,g,null);if(hasDx(g))add(a,{id:dxId(g),title:dxName(g)},null)}g.items.forEach(i=>add(a,g,i))}
  return out;
}
function rymMark(){
  S.rymSeen=S.rymSeen||{};
  for(const a of S.music)for(const g of a.groups){
    if(RATEABLE.includes(g.kind)&&rating(g.id))S.rymSeen[canonK(g.id)]=rating(g.id);
    if(RATEABLE.includes(g.kind)&&hasDx(g)&&rating(dxId(g)))S.rymSeen[canonK(dxId(g))]=rating(dxId(g));
    for(const i of g.items)if(rating(i.id))S.rymSeen[canonK(i.id)]=rating(i.id);
  }
  S.flags=S.flags||{};S.flags.rymBase=true;
}
const csvTodo=()=>csvText(['Artist','Release','Song','What','Your rating','On RYM now','Status'],
  rymTodo().map(x=>[x.a,x.rel,x.song,x.song?'Song rating':'Album rating',x.r,x.was||'',x.was?'Changed here':'New here']));
function expSide(){
  const head=`<summary class="label" style="cursor:pointer">Export ratings</summary>`;
  if(!EXP.open)return `<details id="export">${head}</details>`;
  const cnt=(n,w)=>n+' '+w+(n===1?'':'s');
  let h=`<details id="export" open>${head}
    <p class="note">Download your ratings as spreadsheets (CSV). They double as a backup, since Rate Your Music has no import.</p>
    <div class="tools"><button type="button" class="btn" data-act="expalbums">Albums</button><button type="button" class="btn" data-act="expsongs">Songs</button><button type="button" class="btn" data-act="expscreen">Shows &amp; films</button></div>
    <div class="add"><span class="label">Not yet in Rate Your Music</span>`;
  if(!(S.flags&&S.flags.rymBase)){
    h+=`<p class="note">Playback does not know yet which of your ratings are already on RYM. If they all are, tap below and it will list what you add or change from now on. Importing your RYM file or song ratings again also updates what it knows.</p>
      <div><button type="button" class="btn primary" data-act="rymbase">Everything is on RYM now</button></div>`;
  }else{
    const t=rymTodo();
    if(!t.length)h+=`<p class="note">Nothing waiting. Every rating here matches RYM.</p>`;
    else{
      const nw=t.filter(x=>!x.was).length,ch=t.length-nw;
      h+=`<div class="rymrep"><span><b>${cnt(t.length,'rating')}</b> to enter on RYM: ${nw} new${ch?', '+ch+' changed':''}.</span>
        <details><summary>Show them</summary><ul>${t.slice(0,150).map(x=>'<li>'+esc(x.a+' – '+x.rel+(x.song?': '+x.song:'')+' – '+fmt(x.r)+(x.was?' (RYM has '+fmt(x.was)+')':''))+'</li>').join('')}</ul>${t.length>150?'<p class="note">Showing the first 150. The CSV has all of them.</p>':''}</details></div>
        <div class="tools"><button type="button" class="btn" data-act="exptodo">Download this list</button><button type="button" class="btn" data-act="rymbase">I entered these on RYM</button></div>`;
    }
  }
  return h+'</div></details>';
}
document.addEventListener('toggle',ev=>{const t=ev.target;if(t&&t.id==='export'&&t.open!==EXP.open){EXP.open=t.open;render()}},true);

/* ---------- Your numbers ----------
   Read-only summary of your ratings, worked out from the log each time the panel
   is open (nothing is stored). Album numbers use each release's standard tracklist;
   a deluxe edition's own rating counts as its own album, like the export does. */
const STAT={open:false};
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const median=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
function statData(){
  const alb=[],songs=[],seen=new Set();let heard=0,total=0;
  for(const a of S.music){
    for(const g of a.groups){
      if(RATEABLE.includes(g.kind)){
        const rs=stdItems(g).map(i=>rating(i.id)).filter(Boolean),r=rating(g.id);
        if(r)alb.push({a,g,title:g.title,r,n:rs.length,avg:rs.length?mean(rs):0});
        if(hasDx(g)){const dr=rating(dxId(g)),drs=g.items.map(i=>rating(i.id)).filter(Boolean);
          if(dr)alb.push({a,g,title:dxName(g),r:dr,n:drs.length,avg:drs.length?mean(drs):0,dx:true})}
      }
      for(const i of g.items){if(seen.has(i.id))continue;seen.add(i.id);total++;if(isDone(i.id))heard++;const r=rating(i.id);if(r)songs.push(r)}
    }
  }
  const scr=[];let eps=0;
  for(const s of S.screen){
    const r=rating(s.id);if(r)scr.push({s,r});
    if(s.type!=='film')for(const se of s.seasons)for(let e=1;e<=se.eps;e++)if(rating(sid(s.id,'s',se.n,'e',e)))eps++;
  }
  return{alb,songs,heard,total,scr,eps};
}
function histHtml(vals){
  const bins=Array(20).fill(0);vals.forEach(v=>{const k=Math.min(19,Math.max(0,Math.round(v*2)-1));bins[k]++});
  const mx=Math.max(1,...bins);
  return `<div class="hist" role="img" aria-label="Ratings from 0.5 to 10: ${bins.map((c,k)=>c?c+' at '+fmt((k+1)/2):'').filter(Boolean).join(', ')}">${bins.map((c,k)=>`<i class="${c?'':'z'}" ${c?`style="height:${Math.max(6,Math.round(c/mx*100))}%"`:''} title="${fmt((k+1)/2)}: ${c}"></i>`).join('')}</div>
    <div class="hax"><span>1</span><span>5</span><span>10</span></div>`;
}
function statRows(list){
  return `<ol>${list.map(x=>`<li><button class="srow" data-act="statgo" data-tab="${x.tab||'music'}" data-id="${x.id}"><span class="n">${esc(x.t)}${x.sub?' <small>'+esc(x.sub)+'</small>':''}</span><span class="v">${esc(x.v)}</span></button></li>`).join('')}</ol>`;
}
function statSide(){
  const head=`<summary class="label" style="cursor:pointer">Your numbers</summary>`;
  if(!STAT.open)return `<details id="stats">${head}</details>`;
  const D=statData(),f1=v=>v.toFixed(1);
  const albR=D.alb.map(x=>x.r),sg=D.songs;
  let h=`<details id="stats" open>${head}<div class="stat">`;
  if(!albR.length&&!sg.length&&!D.scr.length&&!D.eps)return h+`<p class="nb">Rate some albums, songs or shows and this fills in.</p></div></details>`;
  h+=`<div class="kpis">
    <div class="kpi"><b>${albR.length}</b><span>Albums rated</span></div>
    <div class="kpi"><b>${albR.length?f1(mean(albR)):'–'}</b><span>Album average</span></div>
    <div class="kpi"><b>${sg.length}</b><span>Songs rated</span></div>
    <div class="kpi"><b>${sg.length?f1(mean(sg)):'–'}</b><span>Song average</span></div>
    <div class="kpi"><b>${D.total?Math.round(D.heard/D.total*100)+'%':'–'}</b><span>${D.heard.toLocaleString()} of ${D.total.toLocaleString()} songs heard</span></div>
  </div>`;
  if(albR.length||sg.length){
    h+=`<div class="cols">`;
    if(albR.length)h+=`<div><h4>How you rate albums <span class="avg">median ${fmt(median(albR))}</span></h4>${histHtml(albR)}</div>`;
    if(sg.length)h+=`<div><h4>How you rate songs <span class="avg">median ${fmt(median(sg))} · ${sg.filter(v=>v>=9).length} at 9 or higher</span></h4>${histHtml(sg)}</div>`;
    h+=`</div>`;
  }
  if(D.alb.length){
    const top=[...D.alb].sort((x,y)=>y.r-x.r||y.avg-x.avg||x.title.localeCompare(y.title)).slice(0,10)
      .map(x=>({id:x.a.id,t:x.title,sub:x.a.name,v:fmt(x.r)}));
    const gap=D.alb.filter(x=>x.n>=3).map(x=>({...x,d:x.r-x.avg}));
    const up=gap.filter(x=>x.d>=.5).sort((x,y)=>y.d-x.d).slice(0,3).map(x=>({id:x.a.id,t:x.title,sub:x.a.name,v:'+'+f1(x.d)}));
    const dn=gap.filter(x=>x.d<=-.5).sort((x,y)=>x.d-y.d).slice(0,3).map(x=>({id:x.a.id,t:x.title,sub:x.a.name,v:'−'+f1(Math.abs(x.d))}));
    const byA={};D.alb.filter(x=>!x.dx).forEach(x=>{(byA[x.a.id]=byA[x.a.id]||{a:x.a,rs:[]}).rs.push(x.r)});
    const arts=Object.values(byA).filter(o=>o.rs.length>=2).map(o=>({id:o.a.id,t:o.a.name,sub:o.rs.length+' albums',v:f1(mean(o.rs)),m:mean(o.rs)}))
      .sort((x,y)=>y.m-x.m||y.sub.localeCompare(x.sub)).slice(0,5);
    h+=`<div class="cols"><div><h4>Top albums</h4>${statRows(top)}</div>`;
    if(arts.length)h+=`<div><h4>Artists you rate highest <span class="avg">2+ albums rated</span></h4>${statRows(arts)}</div>`;
    h+=`</div>`;
    if(up.length||dn.length){
      h+=`<div class="cols">`;
      if(up.length)h+=`<div><h4>Better than their songs <span class="avg">album rating vs song average</span></h4>${statRows(up)}</div>`;
      if(dn.length)h+=`<div><h4>Worse than their songs <span class="avg">album rating vs song average</span></h4>${statRows(dn)}</div>`;
      h+=`</div><p class="nb">Only albums with at least 3 rated songs and a gap of half a point or more.</p>`;
    }
  }
  if(D.scr.length||D.eps){
    const sr=D.scr.map(x=>x.r),topS=[...D.scr].sort((x,y)=>y.r-x.r||x.s.title.localeCompare(y.s.title)).slice(0,5)
      .map(x=>({tab:'screen',id:x.s.id,t:x.s.title,sub:x.s.type==='film'?'Film':'Show',v:fmt(x.r)}));
    h+=`<div><h4>Screen <span class="avg">${D.scr.length} show${D.scr.length===1?'':'s'} and films rated${sr.length?' · average '+f1(mean(sr)):''} · ${D.eps} episode${D.eps===1?'':'s'} rated</span></h4>${topS.length?statRows(topS):''}</div>`;
  }
  return h+'</div></details>';
}
document.addEventListener('toggle',ev=>{const t=ev.target;if(t&&t.id==='stats'&&t.open!==STAT.open){STAT.open=t.open;render()}},true);

/* ---------- Spotify: songs you play get checked off ----------
   Your own Spotify app (Client ID in S.cfg.spotify, which syncs; it is not a secret)
   signs in with PKCE, so there is no client secret anywhere. Scope:
   user-read-recently-played only. Spotify keeps just your last 50 plays, so:
   - with sync Worker v3 the sign-in is handed to the Worker, which checks every hour
     on its own (Cron Trigger) and keeps the plays; the app reads them from there.

  const row=(k,a)=>`<div class="provrow"><span class="pk">${k}</span>${chips(a)}</div>`;
  const free=[w.s.length?row('Stream',w.s):'',w.f.length?row('Free',w.f):''].join('');
  const pay=[w.r.length?row('Rent',w.r):'',w.b.length?row('Buy',w.b):''].join('');

}

/* Episode names, descriptions, air dates and runtimes. A long show is a lot of text,
   so this does NOT go in the synced log: each device keeps its own copy in
   localStorage and fetches it from TMDB (up to 20 seasons per request) the first
   time a show is opened, and again after the show is checked for new episodes. */
const TMC_KEY=KEY+'_eps';
let TMC=(()=>{try{return JSON.parse(localStorage.getItem(TMC_KEY))||{}}catch(e){return{}}})();
const TME={busy:null,failed:{}};
function tmcSave(){try{localStorage.setItem(TMC_KEY,JSON.stringify(TMC))}catch(e){TMC={};try{localStorage.removeItem(TMC_KEY)}catch(_){}}}
function epInfo(s,n,e){const c=s.tmdb&&TMC[s.tmdb];const l=c&&c.s[n];return l&&l[e-1]||null}
function tmNeedsEps(s){
  if(!s.tmdb||!tmKey()||TME.busy||TME.failed[s.tmdb])return false;
  const c=TMC[s.tmdb];return !c||c.at<(s.tmAt||0)||(!s.hasInfo);
}
async function tmLoadEps(s){
  if(!tmNeedsEps(s))return;
  TME.busy=s.tmdb;
  try{
    const nums=s.seasons.map(x=>x.n),out={};let info=null;
    for(let i=0;i<Math.max(nums.length,1);i+=20){
      const chunk=nums.slice(i,i+20);
      const j=await tmGet('tv/'+s.tmdb,{language:'en-US',...(chunk.length?{append_to_response:chunk.map(n=>'season/'+n).join(',')}:{})});
      if(!info)info=tmInfo(j);
      for(const n of chunk){const se=j['season/'+n];if(!se)continue;
        out[n]=(se.episodes||[]).sort((a,b)=>a.episode_number-b.episode_number)
          .map(e=>({t:e.name||'',o:e.overview||'',d:e.air_date||'',rt:e.runtime||0}))}
    }
    TMC[s.tmdb]={at:Date.now(),s:out};tmcSave();
    if(info){Object.assign(s,info,{hasInfo:true});touch()}
  }catch(e){TME.failed[s.tmdb]=true}
  finally{TME.busy=null;render()}
}
const tmMarked=id=>{const m=S.marks[id];return !!(m&&(m.done||m.r))};
function tmMergeShow(tid,d){
  let s=tmExisting('show',tid,d.title,d.year),isNew=false;
  if(!s){let id=sid('show',d.title);if(S.screen.some(x=>x.id===id))id=sid('show',d.title,'tmdb',tid);
    s={id,type:'show',title:d.title,year:d.year,seasons:[]};S.screen.push(s);isNew=true}
  const before=epIds(s).length,old=new Map(s.seasons.map(x=>[x.n,x])),out=[];
  const lastMarked=(n,upto)=>{for(let e=upto;e>0;e--)if(tmMarked(sid(s.id,'s',n,'e',e)))return e;return 0};
  for(const t of d.seasons){const cur=old.get(t.n);old.delete(t.n);
    out.push({n:t.n,eps:Math.max(t.aired,cur?lastMarked(t.n,cur.eps):0),total:t.total})}
  for(const cur of old.values()){const k=lastMarked(cur.n,cur.eps);if(k)out.push({n:cur.n,eps:k})}   /* not on TMDB: kept only if you checked something */
  s.seasons=out.sort((a,b)=>a.n-b.n);

}
function tmMergeFilm(tid,d){

/* ---------- UI state ---------- */
let S=load();
function boot(){
  seedAll();READY=true;
  if(!S.flags.r10){for(const k in S.marks){if(S.marks[k].r)S.marks[k].r=S.marks[k].r*2}S.flags.r10=true;save()}

if(READY)boot();

/* ---------- sync (playback-sync Worker) ----------
   S.mtime = when you last changed something. SY.last = the mtime the server
   last confirmed. If the server copy is newer we adopt it; if this device has
   changes the server never saw AND the server is newer, we ask. */
const SYNC_KEY=KEY+'_sync';
let SY=(()=>{try{return Object.assign({url:'',key:'',last:0,at:0},JSON.parse(localStorage.getItem(SYNC_KEY)||'{}'))}catch(e){return{url:'',key:'',last:0,at:0}}})();
const saveSync=()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(SY))}catch(e){}};
const SYS={status:SY.url?'idle':'off',msg:'',remote:null};
let pushTimer=null,inflight=false;
const syncOn=()=>!!(SY.url&&SY.key);
function syncLabel(){
  if(!syncOn())return 'Sync off';
  if(SYS.status==='busy')return 'Syncing…';
  if(SYS.status==='error')return 'Sync problem';
  if(SYS.status==='conflict')return 'Needs a choice';
  if(SY.at)return 'Synced '+new Date(SY.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  return 'Sync ready';
}
function touch(){S.mtime=Date.now();save();if(syncOn()&&SYS.status!=='conflict'){clearTimeout(pushTimer);pushTimer=setTimeout(()=>push(false),1500)}}
/* Compressed sync: a Worker from 2026.11.03 on answers with x-pb-worker: 2 and
   takes the log gzipped (about 5x smaller, up to 20 MB after compression).
   Until the Worker is updated, plain JSON still works under its old 1 MB cap. */
const GZ_OK=typeof CompressionStream==='function'&&typeof DecompressionStream==='function';
const gzip=txt=>new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
const gunzip=buf=>new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
async function api(method,body,force){
  const q=[];if(force)q.push('force=1');if(GZ_OK)q.push('gz=1');
  if(body&&!force)q.push('base='+(SY.last||0));   /* the saved version this device last saw: the Worker refuses the upload if the log has moved on since */
  const headers={'x-sync-key':SY.key};let payload;
  if(body){
    const txt=JSON.stringify(body);
    if(GZ_OK&&SY.gz){payload=await gzip(txt);headers['content-type']='application/gzip';q.push('mtime='+(body.mtime||0))}
    else{payload=txt;headers['content-type']='application/json'}
  }
  const u=SY.url.replace(/\/+$/,'')+'/'+(q.length?'?'+q.join('&'):'');
  const r=await fetch(u,{method,cache:'no-store',headers,body:payload});
  const wv=+(r.headers.get('x-pb-worker')||0),gz=wv>=2,sentGz=headers['content-type']==='application/gzip';if(gz!==!!SY.gz||(r.ok&&wv!==(SY.wv||0))){SY.gz=gz;if(r.ok)SY.wv=wv;saveSync()}
  if(r.status===413&&gz&&GZ_OK&&!sentGz)return api(method,body,force);   /* just learned the Worker takes gzip */
  let j=null;
  try{j=/gzip/.test(r.headers.get('content-type')||'')?JSON.parse(await gunzip(await r.arrayBuffer())):await r.json()}catch(e){}
  return{status:r.status,j};
}
function fail(status,j){
  SYS.status='error';
  SYS.msg=status===401?'The sync key does not match the SECRET on your Worker. Re-enter it and save.'
    :status===500&&j&&j.error?'The Worker is not set up yet: '+j.error+'.'
    :status===413?'Your log ('+mb(SV.bytes)+') is too big for this version of the sync Worker. Paste the new worker/playback-sync.js from GitHub into your Worker and deploy; the newer one takes the log compressed, so it fits logs many times larger.'
    :'Sync failed ('+status+'). Try again in a moment.';
}
/* the choice between this device and the synced log: show what each one holds so the
   fuller one is obvious, and make keeping the one with fewer ratings take two taps */
function logSum(o){let s=0,r=0;for(const a of (o&&o.music)||[])for(const g of a.groups||[])s+=(g.items||[]).length;
  const m=(o&&o.marks)||{};for(const k in m)if(m[k]&&m[k].r)r++;return{s,r,t:(o&&o.mtime)||0}}
function conflictBanner(){
  const L=logSum(S),R=logSum(SYS.remote),n=x=>x.toLocaleString(),
    when=t=>t?new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'unknown',
    localFirst=L.r>R.r||(L.r===R.r&&L.t>R.t),loses=Math.max(0,R.r-L.r),armed=UI.keepArm,
    pl=(v,w)=>n(v)+' '+w+(v===1?'':'s'),
    line=(lab,x)=>`<li><b>${lab}:</b> ${pl(x.r,'rating')}, ${pl(x.s,'song')}, last changed ${esc(when(x.t))}</li>`,
    keep=`<button class="btn ${localFirst?'primary':''}" data-act="keeplocal">${armed?'Tap again to replace the synced log'+(loses?' ('+n(loses)+' fewer ratings)':''):'Keep this device'}</button>`,
    use=`<button class="btn ${localFirst?'':'primary'}" data-act="keepremote">Use synced version</button>`;
  return `<div class="banner" role="alert"><p>This device and the synced log both changed since this device last synced. Which version should win?</p>
    <ul class="note">${line('Synced log',R)}${line('This device',L)}</ul>
    ${loses&&!armed?`<p class="note">Keeping this device would replace the synced log, which has ${n(loses)} more ratings.</p>`:''}
    ${localFirst?keep+use:use+keep}</div>`;
}
function ok(){SYS.status='ok';SYS.msg='';SY.at=Date.now();saveSync()}
function adopt(j){S=j;S.flags=S.flags||{};S.marks=S.marks||{};S.music=S.music||[];S.screen=S.screen||[];seedAll();SY.last=S.mtime||0;save();ok();render()}
async function pull(){
  if(!READY||!syncOn()||inflight)return;inflight=true;SYS.status='busy';render();
  try{
    const{status,j}=await api('GET');
    if(status!==200){fail(status,j);return}
    if(j&&j.v===1&&Array.isArray(j.music)){
      const remote=j.mtime||0,local=S.mtime||0;
      if(!SY.last&&remote){adopt(j);return}            /* first sync on this device: take the saved log */
      if(remote>local){ if(local>SY.last){SYS.status='conflict';SYS.remote=j;return} adopt(j);return }
      if(local>remote){inflight=false;await push(false);return}
      SY.last=local;ok();briefPush();
    }else{inflight=false;await push(false);return}       /* nothing saved yet: upload this device */
  }catch(e){SYS.status='error';SYS.msg='Could not reach your Worker. Check the URL and your connection.'}
  finally{inflight=false;render()}
}
/* ---------- list for your morning brief ----------
   A Worker from 2026.11.05 on (x-pb-worker 5) keeps a tiny list of the next episode
   of each show you follow, so your morning brief can say what lands tonight. The app
   works it out and sends it after a sync; the Worker never opens your log. A show
   counts as followed once you have watched something, or when it is a premiere you
   added. "behind" means you still have episodes that are already out. */
let briefSig='';
function briefData(){
  const shows=[];
  for(const s of S.screen){
    if(s.type!=='show'||s.example||!s.next||!s.next.d)continue;
    const st=showStatus(s);
    if(!st.watched&&!(s.next.n===1&&s.next.e===1))continue;
    shows.push({t:s.title,n:s.next.n,e:s.next.e,d:s.next.d,behind:st.watched>0&&!st.done&&!st.caught});
  }
  shows.sort((a,b)=>a.d.localeCompare(b.d)||a.t.localeCompare(b.t));
  return{v:1,shows:shows.slice(0,100)};
}
async function briefPush(){
  if(!syncOn()||(SY.wv||0)<5)return;

function cropDraw(c,size,guide){
  const im=CROP.img,ctx=c.getContext('2d'),W=c.width;

/* the vinyl's own color: the middle value of the ring between the label and the edge */
function ringColor(c){
  const W=c.width,d=c.getContext('2d').getImageData(0,0,W,W).data,R=[],G=[],B=[];
  for(let i=0;i<1400;i++){const a=i*2.399963,rr=W*(.31+.15*((i*7919)%997)/997),px=Math.round(W/2+Math.cos(a)*rr),py=Math.round(W/2+Math.sin(a)*rr);
    if(px<0||py<0||px>=W||py>=W)continue;const o=(py*W+px)*4;R.push(d[o]);G.push(d[o+1]);B.push(d[o+2])}
  const med=a=>{a.sort((p,q)=>p-q);return a[a.length>>1]||0};
  return '#'+[med(R),med(G),med(B)].map(v=>v.toString(16).padStart(2,'0')).join('');

    const sArt=g.img||(g.mbid&&!/^sp:/.test(g.mbid)?'https://coverartarchive.org/release-group/'+g.mbid+'/front-250':''),art=dx?(g.dxImg||sArt):sArt;

    /* one groove per song; a long release folds songs into at most 22 grooves */

      rings.push(seg.length&&seg.every(i=>isDone(i.id)))}

        <span class="ttl">${esc(s.t)}${s.f.length?`<span class="feat">feat. ${esc(s.f.join(', '))}</span>`:''}</span>
        <button class="check" data-act="tog" data-id="${i.id}" aria-pressed="${dn}" aria-label="${r?'Rated '+fmt(r)+'. ':''}${dn?'Heard':'Not heard'}: ${esc(i.title)}"><svg viewBox="0 0 44 44" aria-hidden="true"><circle class="rg-t" cx="22" cy="22" r="16"/>${r?`<circle class="rg-v" cx="22" cy="22" r="16" stroke-dasharray="${dash}"/>`:''}</svg>${r?`<span class="rg-n">${fmt(r)}</span>`:dn?'<span class="rg-d"></span>':''}</button></div>
        ${UI.rOpen===i.id?rateMeter(i.id,s.t):''}`}).join('');
    return `<div class="group sleeve ${dx?'dxon':''} ${UI.dxAnim===g.id?'dxanim':''} ${SLIN.has(String(g.id))?'in':''}" data-acol="${g.id}" style="--acs:${col};--acd:${colD}">
      <div class="sl-hero">
        ${listBtn(g,a)}
        <div class="sl-pack">
          <div class="sl-disc" role="img" aria-label="${gd} of ${shown.length} songs heard">${ringHtml}<span class="sl-lab">${shown.length?gd+'/'+shown.length:'\u2013'}</span></div>
          <div class="sl-cover">${art?`<img src="${esc(art)}" ${dx&&sArt&&art!==sArt?`data-f="${esc(sArt)}" `:''}alt="" loading="lazy" decoding="async" onerror="if(this.dataset.f){this.src=this.dataset.f;this.removeAttribute('data-f')}else this.remove()">`:''}<span class="sl-ph" aria-hidden="true">${esc((g.title||'?').trim().charAt(0).toUpperCase())}</span></div>
        </div>

      </div>

      ${albumBar(g,a,full,shown.length)}

/* where this artist's list came from, and the button to (re)import it */
function mbArtistBar(a){
  const isRH=a.id===sid('artist','radiohead');
  let h='';
  if(MBX.busy&&MBX.where==='sheet'&&MBX.aid===a.id)h+=mbProgHtml();
  else if(a.mbid)h+=`<div class="mbsrc"><span class="label">From ${a.src==='sp'?'Spotify':'MusicBrainz'} · ${a.mbAt?'updated '+esc(new Date(a.mbAt).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})):'imported'}${a.mbVersions?' · with other versions':''}</span>
      <button class="link" data-act="mbrefresh" data-a="${a.id}" ${MBX.busy?'disabled':''}>${a.src!=='sp'&&spCanImport()?'Rebuild from Spotify':'Check for new releases'}</button></div>`;
  else if(isRH)h+=`<div class="mbsrc warn"><p class="note">The non-album lists here were typed by hand and aren't verified. Replacing them with MusicBrainz's list keeps every checkmark and rating you have.</p>
      <div><button class="btn primary" data-act="mbrefresh" data-a="${a.id}" ${MBX.busy?'disabled':''}>Replace with the verified MusicBrainz list</button></div></div>`;
  else h+=`<div class="mbsrc"><span class="label">Added by hand</span><button class="link" data-act="mbprefill" data-a="${a.id}" ${MBX.busy?'disabled':''}>Find on MusicBrainz</button></div>`;
  if(undoAvail(a))h+=`<div class="mbsrc"><span class="label">Before the last import \u00b7 ${esc(new Date(UNDO[a.id].at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))}</span><button class="link" data-act="mbundo" data-a="${a.id}">${UI.undoArm===a.id?'Tap again to restore it':'Undo last import'}</button></div>`;
  if(MBX.aid===a.id&&MBX.errWhere==='sheet'){
    if(MBX.err)h+=`<p class="mberr" role="alert">${esc(MBX.err)}</p>${mbFallbackBtn()}`;
    if(MBX.report)h+=`<p class="mbok" role="status">${esc(MBX.report)}<button class="link" data-act="mbdismiss">Got it</button></p>`;
  }
  return h;
}

/* Each episode gets its own 1\u201310 rating, like songs. The season keeps its own
   overall rating too, shown beside the average of the episodes you rated, the same
   way albums sit beside their song average. Episode ratings live in marks under the
   episode ID, so they sync and survive a TMDB refresh. */
/* the whole show: your own overall rating, shown beside the average of your season
   ratings and of your episode ratings */
function showRate(s){
  const avgOf=ids=>{const rs=ids.map(rating).filter(Boolean);return{n:rs.length,of:ids.length,a:rs.length?rs.reduce((x,y)=>x+y,0)/rs.length:0}};
  const se=avgOf(s.seasons.filter(x=>x.eps).map(x=>sid(s.id,'s',x.n))),ep=avgOf(epIds(s)),r=rating(s.id),f1=v=>v.toFixed(1);
  const d=r&&ep.n?r-ep.a:null;
  return `<div class="arate srate"><span class="label">Your show rating</span>${rateDots(s.id)}
    <span class="avg">${se.n?'Season average '+f1(se.a)+' <span class="of">('+se.n+' of '+se.of+')</span>':'No seasons rated yet'}</span>
    <span class="avg">${ep.n?'Episode average '+f1(ep.a)+' <span class="of">('+ep.n+' of '+ep.of+')</span>':'No episodes rated yet'}</span>
    ${d===null?'':`<span class="diff ${Math.abs(d)<.05?'even':d>0?'up':'down'}">${Math.abs(d)<.05?'Same as the episodes':(d>0?'+':'\u2212')+f1(Math.abs(d))+' vs the episodes'}</span>`}</div>`}

function epRow(s,n,e){
  const id=sid(s.id,'s',n,'e',e),x=epInfo(s,n,e),open=!!UI.epOpen[id];
  const day=x&&x.d?new Date(x.d+'T12:00:00').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'}):'';
  const meta=[sxe(n,e),day,x&&x.rt?x.rt+'m':''].filter(Boolean).join(' · ');
  const title=x&&x.t?(x.o?`<button class="eptl" data-act="epx" data-id="${id}" aria-expanded="${open}">${esc(x.t)}</button>`:`<span class="eptl">${esc(x.t)}</span>`)+`<span class="epm">${esc(meta)}</span>`
    :`<span class="mono">${sxe(n,e)}</span>`;
  return `<div class="track ep ${isDone(id)?'done':''}"><span class="num">${e}</span>
    <button class="check" data-act="tog" data-id="${id}" aria-pressed="${isDone(id)}" aria-label="Watched ${sxe(n,e)}"></button>
    <div class="ttl">${title}${open&&x&&x.o?`<p class="epo">${esc(x.o)}</p>`:''}</div>${rateDots(id)}</div>`}

function seasonRate(sk,sids){
  const rs=sids.map(rating).filter(Boolean),n=rs.length,r=rating(sk);
  const avg=n?rs.reduce((x,y)=>x+y,0)/n:0,d=r&&n?r-avg:null,f1=v=>v.toFixed(1);
  return `<div class="arate"><span class="label">Your season rating</span>${rateDots(sk)}
    <span class="avg">${n?'Episode average '+f1(avg)+' <span class="of">('+n+' of '+sids.length+' rated)</span>':'No episodes rated yet'}</span>
    ${d===null?'':`<span class="diff ${Math.abs(d)<.05?'even':d>0?'up':'down'}">${Math.abs(d)<.05?'Same as the episodes':(d>0?'+':'\u2212')+f1(Math.abs(d))+' vs the episodes'}</span>`}</div>`}

function showView(s){
  if(tmNeedsEps(s))setTimeout(()=>tmLoadEps(s),0);
  else if(tmNeedsWatch(s))setTimeout(()=>tmLoadWatch(s),0);
  const ids=epIds(s),p=pct(ids),done=ids.filter(isDone).length;
  const out=s.seasons.filter(se=>se.eps).length,rated=ids.filter(i=>rating(i)).length,ss=showStatus(s),stopLine=stopText(s,ss);
  return `<div class="head">${tmPoster(s)}<div class="ring" style="--p:${p}"><span>${p}%</span></div>
    <div class="meta"><h2>${esc(s.title)}${s.example?'<span class="ex">Example</span>':''}</h2><span class="mono">${s.year?esc(s.year)+' · ':''}${done} of ${ids.length} episodes watched · ${rated} rated · ${out} season${out===1?'':'s'}</span>
      ${s.genres&&s.genres.length||s.network?`<span class="genres">${esc([(s.genres||[]).join(', '),s.network,s.creators&&s.creators.length?'Created by '+s.creators.join(', '):''].filter(Boolean).join(' · '))}</span>`:''}
      ${stopLine?`<span class="note">${esc(stopLine)}</span>`:''}

    ${s.overview?`<p class="overview">${esc(s.overview)}</p>`:''}
    ${watchBlock(s)}
    ${showRate(s)}
    ${tmBar(s)}
    ${TME.busy===s.tmdb?'<p class="note">Getting episode names and descriptions from TMDB…</p>':''}
    ${s.seasons.map(se=>{const sids=Array.from({length:se.eps},(_,k)=>sid(s.id,'s',se.n,'e',k+1)),sd=sids.filter(isDone).length,sk=sid(s.id,'s',se.n),more=(se.total||0)-se.eps;
      if(!se.eps)return `<div class="group"><div class="ghead"><h3>Season ${se.n}</h3><span class="sp"></span><span class="label">Not out yet${se.total?' · '+se.total+' episode'+(se.total===1?'':'s')+' planned':''}</span></div></div>`;
      return `<div class="group"><div class="ghead"><h3>Season ${se.n}</h3>${seasonTag(ss,se.n)}<span class="sp"></span>${more>0?`<span class="label">${more} more coming</span>`:''}<span class="mono">${sd}/${se.eps}</span><span class="bar"><i style="width:${sd/se.eps*100}%"></i></span>

    ${s.tmdb?'':`<details class="more"><summary>Add a season</summary>

    <div>${delBtn(s.id,'Delete show')}</div>`;
}

function filmView(f){

    <div class="meta"><h2>${esc(f.title)}</h2><span class="mono">Film${f.year?' · '+esc(f.year):''}${f.runtime?' · '+Math.floor(f.runtime/60)+'h '+(f.runtime%60)+'m':''}</span></div></div>

    if(x&&(!x.scan||(x.scan.none&&Date.now()-x.scan.at>2592e6)))setTimeout(()=>colFindScans(x),0)}

    if(nv[0]){nv[0].dataset.v=VSTEPS[Math.max(0,i-1)][0];nv[0].disabled=i<=0}if(nv[1]){nv[1].dataset.v=VSTEPS[Math.min(4,i+1)][0];nv[1].disabled=i>=4}}return}
  else if(act==='phdel'){const x=colAll().find(c=>c.id===id);if(x)photoDel(x,b.dataset.k);return}
  else if(act==='cropx'){cropClose();return}
  else if(act==='cropok'){cropSave();return}
  else if(act==='vrescan'){const x=colAll().find(c=>c.id===id);if(x){x.scan=null;colFindScans(x)}return}
  else if(act==='colopen'){UI.colOpen=UI.colOpen===id?null:id;UI.colEdit=null;
    for(const k in COL.imgs)if(COL.imgs[k]&&COL.imgs[k].err)delete COL.imgs[k]}   /* reopening retries photos that failed */

    S.collection=colAll().filter(x=>x.id!==id);UI.colDel=null;if(UI.colEdit===id)UI.colEdit=null;if(UI.colOpen===id)UI.colOpen=null;touch()}else UI.colDel=id}

/* ---------- is there a newer copy? ---------- */
/* 2026.10.21-a -> sortable; a two-letter suffix (after z) still sorts after one */
function buildKey(v){const m=/^(\d{4})\.(\d\d)\.(\d\d)-([a-z]+)$/.exec(v||'');return m?m[1]+m[2]+m[3]+String(m[4].length)+m[4]:''}
const UPD={last:0,dismissed:null,shown:null};
async function checkUpdate(force){
  if(!/^https?:$/.test(location.protocol)||!window.fetch)return;
  if(!force&&Date.now()-UPD.last<20e3)return;
  UPD.last=Date.now();
  try{
    /* cheap look first: sw.js is ~2 KB and carries the same build id as the page, so polling it every
       30 seconds costs almost nothing. Only when it shows something newer (or can't be read) is the
       whole page fetched to confirm. The check at load always reads the page itself. */
    if(!force){try{const q=await fetch('sw.js?_='+Date.now(),{cache:'no-store'});
      if(q.ok){const sm=(await q.text()).match(/playback-(\d{4}\.\d\d\.\d\d-[a-z]+)/);if(sm&&!(buildKey(sm[1])>buildKey(BUILD)))return}}catch(e){}}
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const html=await r.text();
    const m=html.match(/v:'(\d{4}\.\d\d\.\d\d-[a-z]+)'/);if(!m)return;
    const live=m[1];
    if(!(buildKey(live)>buildKey(BUILD))||live===UPD.dismissed)return;
    /* just reloaded for this build and still got the old copy: GitHub hasn't caught up, try again quietly */
    let tried=null;try{tried=sessionStorage.getItem('playback_upd_tried')}catch(e){}
    if(tried===live&&!force){if(!UPD.retry){UPD.retry=true;setTimeout(()=>{UPD.retry=false;checkUpdate(true)},60e3)}return}
    showUpdate(live);
  }catch(e){}
}
function showUpdate(ver){
  UPD.shown=ver;
  document.getElementById('updtxt').textContent='Build '+ver+' is ready';
  const b=document.getElementById('updbar');b.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>b.classList.add('up')));
}
document.getElementById('updgo').addEventListener('click',()=>{
  try{sessionStorage.setItem('playback_upd_tried',UPD.shown||'')}catch(e){}
  save();
  location.replace(location.pathname+'?v='+Date.now()+location.hash);
});
document.getElementById('updx').addEventListener('click',()=>{
  UPD.dismissed=UPD.shown;
  const b=document.getElementById('updbar');b.classList.remove('up');setTimeout(()=>{b.hidden=true},320);
});
if(/[?&]v=\d+/.test(location.search))try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
setTimeout(()=>checkUpdate(true),2500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});
/* and keep looking while the app is simply left open on screen */
setInterval(()=>{if(document.visibilityState==='visible')checkUpdate(false)},30e3);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
